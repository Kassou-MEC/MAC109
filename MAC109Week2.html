<section data-tab="Start" data-file="Start Page">
  <p class="eyebrow">LaGuardia Community College · MEC Department · MAC 109 — Software Studio</p>
  <h1>Week 2: Your app<br>learns math 🧮</h1>
  <p class="sub">Input/output, data types &amp; casting. Last week your app could <em>talk</em>. Today it learns to <em>calculate</em> — and along the way you'll meet the strangest fact in beginner programming: <code class="inline">"5" + "3"</code> is not <code class="inline">8</code>.</p>
  <div class="startrow">
    <div>
      <p class="pill">Today you will</p>
      <ul class="objlist">
        <li>Explain why <b>"5" + "3" = "53"</b> — and never be fooled again</li>
        <li>Choose the right <b>type</b>: string, int, double (and meet bool &amp; var)</li>
        <li>Cross the bridge both ways with <b>Convert</b> — text ⇄ number</li>
        <li>Use <b>+ − * / %</b>, parentheses, and dodge the int-division trap</li>
        <li>Read a real calculation handler <b>line by line</b></li>
        <li>Ship <b>Milestone 2</b>: a live calculation in YOUR domain app</li>
      </ul>
    </div>

<span class="cl"><span class="ln">1</span><span class="k">double</span><span class="p"> a = </span><span class="t">Convert</span><span class="p">.</span><span class="m">ToDouble</span><span class="p">(txtA.</span><span class="m">Text</span><span class="p">);</span></span></pre>

<section data-tab="The Twist" data-file="Recap.cs">
  <p class="eyebrow">01 · Warm-up — and a plot twist</p>
  <h2>The Greeter's dark secret</h2>
  <p class="sub">Last week's rhythm was <b>read → glue → write</b>: read <code class="inline">txtName.Text</code>, glue with <code class="inline">+</code>, write <code class="inline">lblGreeting.Text</code>. So… let's "add" two numbers the same way:</p>
  <div class="codewin">
    <div class="bar">MainWindow.cs — looks reasonable, right?</div>
    <pre>
<span class="cl"><span class="ln">1</span><span class="p">lblResult.</span><span class="m">Text</span><span class="p"> = txtA.</span><span class="m">Text</span><span class="p"> + txtB.</span><span class="m">Text</span><span class="p">;</span></span></pre>

<!-- 3 ▸ Types -->
<section data-tab="Types" data-file="DataTypes.cs">
  <p class="eyebrow">02 · Data types</p>
  <h2>Every variable has a type — forever</h2>
  <p class="sub">A <b>type</b> tells C# what kind of thing lives in a variable and what operations make sense on it. Click each card to flip it — guess first!</p>
  <div class="grid3">
    <div class="flip" tabindex="0" role="button" aria-label="Flip card: string">
      <div class="inner">
        <div class="face front"><span class="big">string</span><small>text of any length ▸ click to flip</small></div>
        <div class="face back"><p>A <b>string</b> holds <b>text</b> in double quotes: <code class="inline">"Maria"</code>, <code class="inline">"Hello!"</code> — even <code class="inline">"5"</code>. For strings, <code class="inline">+</code> glues. Every <code class="inline">.Text</code> property is a string, always.</p></div>
      </div>
    </div>
    <div class="flip" tabindex="0" role="button" aria-label="Flip card: int">
      <div class="inner">
        <div class="face front"><span class="big">int</span><small>whole numbers ▸ click to flip</small></div>
        <div class="face back"><p>An <b>int</b> holds <b>whole numbers</b>: <code class="inline">42</code>, <code class="inline">-3</code>, <code class="inline">0</code>. Perfect for counting things that can't be fractional: students, rooms, items in stock. No quotes — quotes would make it a string!</p></div>
      </div>
    </div>
    <div class="flip" tabindex="0" role="button" aria-label="Flip card: double">
      <div class="inner">
        <div class="face front"><span class="big">double</span><small>decimal numbers ▸ click to flip</small></div>
        <div class="face back"><p>A <b>double</b> holds numbers <b>with decimals</b>: <code class="inline">3.5</code>, <code class="inline">19.99</code>, <code class="inline">98.6</code>. Money, averages, measurements. When in doubt this semester, <b>use double</b> — it handles whole numbers too.</p></div>
      </div>
    </div>
  </div>
  <div class="grid2" style="margin-top:18px">
    <div class="card"><span class="pill">Preview · bool</span><h3>true / false</h3><p>A <b>bool</b> holds exactly two possible values: <code class="inline">true</code> or <code class="inline">false</code>. It's the fuel of decisions — and it becomes the star of the show next week, when your app learns <code class="inline">if</code>.</p></div>
    <div class="card"><span class="pill">Shortcut · var</span><h3>"Compiler, you figure it out"</h3><p><code class="inline">var price = 19.99;</code> — the compiler sees the value and makes <code class="inline">price</code> a double. Convenient! But don't be fooled: the type is still <b>locked in forever</b>. <code class="inline">var</code> saves typing, not thinking.</p></div>
  </div>
  <p class="note">🧠 <b>Declaration anatomy</b> — memorize this shape: <code class="inline">type name = value;</code> &nbsp;→&nbsp; <code class="inline">double price = 19.99;</code> reads as "create a box named <i>price</i> that only holds decimal numbers, and put 19.99 in it."</p>
</section>

<!-- 4 ▸ Convert -->
<section data-tab="Convert" data-file="Convert.cs">
  <p class="eyebrow">03 · Casting — crossing the bridge</p>
  <h2>Convert: from text to number and back</h2>
  <p class="sub">Your UI speaks <b>string</b>; your math speaks <b>number</b>. <code class="inline">Convert</code> is the bridge between them — and you'll cross it in <i>every</i> calculation you ever write.</p>
  <div class="codewin">
    <div class="bar">The full round trip — text ▸ number ▸ math ▸ text</div>
    <pre>
<span class="cl"><span class="ln">1</span><span class="k">string</span><span class="p"> input = txtAge.</span><span class="m">Text</span><span class="p">;              </span><span class="c">// "19"  ← text (it's ALWAYS text)</span></span>
<span class="cl"><span class="ln">2</span><span class="k">int</span><span class="p"> age = </span><span class="t">Convert</span><span class="p">.</span><span class="m">ToInt32</span><span class="p">(input);       </span><span class="c">//  19   ← now a real number</span></span>
<span class="cl"><span class="ln">3</span><span class="k">int</span><span class="p"> next = age + </span><span class="n">1</span><span class="p">;                     </span><span class="c">//  20   ← math works!</span></span>
<span class="cl"><span class="ln">4</span><span class="p">lblOut.</span><span class="m">Text</span><span class="p"> = </span><span class="s">"Next year: "</span><span class="p"> + next;   </span><span class="c">// "Next year: 20" ← text again</span></span></pre>
  </div>
  <div class="winapp" style="max-width:320px">
    <div class="wtitle"><span class="t">Convert Demo</span><span class="wb">— ▢ ✕</span></div>
    <div class="wbody">
      <span class="wf-text">19</span>
      <span class="wf-btn">Next year</span>
      <span class="wf-out">Next year: 20</span>
    </div>
  </div>
  <p class="figcap"><b>The round trip, on screen.</b> "19" crossed the bridge, became 19, gained a year as a real number, and came back as text.</p>
  <div class="grid2" style="margin-top:16px">
    <div class="card"><span class="pill">Text → number</span><h3>The Convert family</h3><p><code class="inline">Convert.ToDouble(txtPrice.Text)</code> for decimals · <code class="inline">Convert.ToInt32(txtCount.Text)</code> for whole numbers. Same shape every time: <b>Convert dot To-the-type-you-want, parentheses around the text.</b></p></div>
    <div class="card"><span class="pill">Number → text</span><h3>Glue does it for free</h3><p>Going back is easier: the moment a number touches a string with <code class="inline">+</code>, C# converts it automatically — that's line 4 above. (There's also <code class="inline">next.ToString()</code> when you need it explicitly.)</p></div>
  </div>
  <p class="note">🍌 <b>The banana warning:</b> <code class="inline">Convert.ToDouble("banana")</code> compiles perfectly — the grammar is legal — but <b>explodes when it runs</b> (a FormatException). That's a <i>runtime error</i>, a whole different beast from the red squiggles you met last week. Next week, <code class="inline">if</code> starts guarding the door; in Week 10, <code class="inline">try/catch</code> finishes the job. For now: type numbers during your demos. 😉</p>
</section>

  var FULLCODE="using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Interactivity;\nusing Avalonia.Layout;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    // ---- fields: controls the handlers must reach later ----\n    TextBox txtName = new TextBox { Watermark = \"Type your name\u2026\" };\n    TextBlock lblGreeting = new TextBlock { FontSize = 18 };\n    TextBox txtA = new TextBox { Watermark = \"First number\" };\n    TextBox txtB = new TextBox { Watermark = \"Second number\" };\n    TextBlock lblResult = new TextBlock { FontSize = 18, FontWeight = FontWeight.Bold };\n\n    public MainWindow()\n    {\n        Title = \"My Studio App \u2014 Maria\";\n        Width = 500; Height = 520;\n        Background = Brushes.MintCream;\n\n        // ---- greeter section (Week 1) ----\n        var lblWelcome = new TextBlock { Text = \"Welcome to MAC 109!\", FontSize = 22 };\n        var btnGreet = new Button { Content = \"Say Hello\" };\n        btnGreet.Click += BtnGreet_Click;\n\n        // ---- calculator section (Week 2) ----\n        var btnAdd = new Button { Content = \"+\" };  btnAdd.Click += BtnAdd_Click;\n        var btnSub = new Button { Content = \"\u2212\" };  btnSub.Click += BtnSub_Click;\n        var btnMul = new Button { Content = \"\u00d7\" };  btnMul.Click += BtnMul_Click;\n        var btnDiv = new Button { Content = \"\u00f7\" };  btnDiv.Click += BtnDiv_Click;\n        var buttonRow = new StackPanel { Orientation = Orientation.Horizontal, Spacing = 8,\n                                         Children = { btnAdd, btnSub, btnMul, btnDiv } };\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(20), Spacing = 12,\n            Children = { lblWelcome, txtName, btnGreet, lblGreeting,\n                         txtA, txtB, buttonRow, lblResult }\n        };\n    }\n\n    void BtnGreet_Click(object sender, RoutedEventArgs e)\n    {\n        lblGreeting.Text = \"Hello, \" + txtName.Text + \"!\";\n    }\n\n    void BtnAdd_Click(object sender, RoutedEventArgs e)\n    {\n        double a = Convert.ToDouble(txtA.Text);\n        double b = Convert.ToDouble(txtB.Text);\n        lblResult.Text = a + \" + \" + b + \" = \" + (a + b);\n    }\n\n    void BtnSub_Click(object sender, RoutedEventArgs e)\n    {\n        double a = Convert.ToDouble(txtA.Text);\n        double b = Convert.ToDouble(txtB.Text);\n        lblResult.Text = a + \" \u2212 \" + b + \" = \" + (a - b);\n    }\n\n    void BtnMul_Click(object sender, RoutedEventArgs e)\n    {\n        double a = Convert.ToDouble(txtA.Text);\n        double b = Convert.ToDouble(txtB.Text);\n        lblResult.Text = a + \" \u00d7 \" + b + \" = \" + (a * b);\n    }\n\n    void BtnDiv_Click(object sender, RoutedEventArgs e)\n    {\n        double a = Convert.ToDouble(txtA.Text);\n        double b = Convert.ToDouble(txtB.Text);\n        lblResult.Text = a + \" \u00f7 \" + b + \" = \" + (a / b);\n    }\n}\n";

     opts:['3.4','3','2','0'],
     a:2,why:'% is the REMAINDER: 5 fits into 17 three times (15), leaving 2. Bonus intuition: anything % 2 tells you even (0) or odd (1) \u2014 that trick pays off next week.'},
    {q:'What does lblResult.Text = "Total: " + 5 + 2; display?',
     opts:['Total: 7','Total: 52','52','A compile error'],
     a:1,why:'+ works left to right. \u201cTotal: \u201d + 5 glues into text first (\u201cTotal: 5\u201d), and from then on everything glues: \u201cTotal: 52\u201d. Compute first \u2014 "Total: " + (5 + 2) \u2014 or better, into a named variable.'}
  ];
  var host=document.getElementById('quizHost');var score=0,answered=0;
  quiz.forEach(function(Q,qi){
    var box=document.createElement('div');box.className='q';
    var h=document.createElement('h3');h.textContent=(qi+1)+'. '+Q.q;box.appendChild(h);
    var why=document.createElement('p');why.className='why';why.textContent=Q.why;
    Q.opts.forEach(function(o,oi){
      var b=document.createElement('button');b.className='opt';b.textContent=o;
      b.addEventListener('click',function(){
        if(box.dataset.done)return;box.dataset.done='1';answered++;
        box.querySelectorAll('.opt').forEach(function(x,xi){
          x.disabled=true;
          if(xi===Q.a)x.classList.add('right');
        });
        if(oi===Q.a){score++;}else{b.classList.add('wrong');}
        why.classList.add('show');
        document.getElementById('quizScore').textContent='Score: '+score+' / '+quiz.length+(answered===quiz.length?(score===quiz.length?'  🏆 Perfect!':'  — review the explanations above, then move on.'):'');
      });
      box.appendChild(b);
    });
    box.appendChild(why);host.appendChild(box);
  });


  /* ---------- predict the output ---------- */
  var predict=[
    {c:'5 + 3', a:'8', w:'Two ints \u2014 real addition. The boring one, to warm up.'},
    {c:'"5" + "3"', a:'"53"', w:'Two strings \u2014 + glues. THE trap of the week: this is what raw .Text values do.'},
    {c:'"5" + 3', a:'"53"', w:'String meets number: the string wins. C# converts the 3 to text and glues. One string in the chain turns everything to glue.'},
    {c:'7 / 2', a:'3', w:'int \u00f7 int stays int: C# chops off the .5 with zero remorse. No warning, no error.'},
    {c:'7.0 / 2', a:'3.5', w:'One double in the mix and division turns honest. This is why our calculators use double.'},
    {c:'7 % 2', a:'1', w:'% is the remainder: 2 fits into 7 three times, 1 left over. Odd numbers % 2 always give 1.'},
    {c:'10 % 5', a:'0', w:'Divides evenly \u2014 remainder 0. \u201cx % y == 0\u201d is how code asks \u201cdoes y divide x?\u201d \u2014 huge next week.'},
    {c:'2 + 3 * 4', a:'14', w:'PEMDAS lives: multiplication first (12), then + 2. Same rules as math class.'},
    {c:'(2 + 3) * 4', a:'20', w:'Parentheses overrule everything. When in doubt, add them \u2014 they\u2019re free and they document your intent.'}
  ];
  var ph=document.getElementById('predictHost');
  if(ph){predict.forEach(function(P){
    var row=document.createElement('div');row.className='prow2';
    row.innerHTML='<code>'+P.c.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code><span class="hintbtn">think\u2026 then click to reveal</span><span class="ans">\u2192 '+P.a.replace(/</g,'&lt;')+'</span><span class="pwhy">'+P.w+'</span>';
    row.addEventListener('click',function(){row.classList.add('rev');});
    ph.appendChild(row);
  });}

  /* ---------- copy buttons ---------- */
  stage.querySelectorAll('.codewrap').forEach(function(w){
    var btn=w.querySelector('.copy');var pre=w.querySelector('pre.code');
    if(!btn||!pre)return;
    btn.addEventListener('click',function(){
      function flash(){btn.textContent='Copied \u2713';setTimeout(function(){btn.textContent='Copy';},1600);}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(pre.innerText).then(flash,flash);}
      else{flash();}
    });
  });

  /* ---------- boot ---------- */
  slides[0].classList.add('active');
  tabs[0].classList.add('active');
  prevBtn.disabled=true;
  document.getElementById('lncol').textContent='Slide 1 of '+slides.length+' \u00b7 '+secs[0].dataset.file;
})();
</script>
</body>
</html>
