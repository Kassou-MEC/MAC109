<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>MAC 109 · Assignment 1 — C# Syntax</title>
<style>
:root{
  --bg:#0f1220; --surface:#181c2e; --surface2:#222840; --border:#2f3654;
  --ink:#eef0f8; --ink2:#c3c9dd; --muted:#9098b4;
  --brand:#6d63ff; --brand2:#a45cff; --brand-soft:#2a2d55; --brand-ink:#c9c5ff;
  --good:#22c58b; --good-soft:#12352b; --bad:#f06a60; --bad-soft:#3d1f23; --warn:#f5b83d; --warn-soft:#352b12;
  --code-bg:#0a0d18; --code-border:#2a3150; --code-text:#e6e9f2; --code-ln:#5b627a;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:96px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.92em}
p code,li code,label code,.q code{background:var(--code-bg);border:1px solid var(--code-border);border-radius:6px;padding:1px 6px;color:var(--brand-ink)}
.hidden{display:none !important}

#top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
#top .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
#top .ttl{font-weight:700;font-size:15px}
#top .ttl small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
#top .right{margin-left:auto;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:12px}
#progressWrap{width:130px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
#progressBar{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}
.chip{background:var(--brand-soft);color:var(--brand-ink);border-radius:999px;padding:3px 12px;font-weight:600;font-size:13px}

main{max-width:880px;margin:0 auto;padding:26px 16px}
h1{font-size:30px;line-height:1.2;margin-bottom:10px;text-wrap:balance}
h2{font-size:21px;margin:34px 0 4px}
.eyebrow{color:var(--brand-ink);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.sub{color:var(--ink2)}
.partnote{color:var(--muted);font-size:14.5px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin:14px 0}
.card.q{position:relative}
.qhead{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.qnum{font-family:var(--mono);font-weight:700;color:var(--brand-ink);flex:0 0 auto}
.qtext{font-weight:600;flex:1}
.pts{color:var(--muted);font-size:13px;white-space:nowrap}
ul.rules{margin:12px 0 0 20px;color:var(--ink2)}
ul.rules li{margin:5px 0}

.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface2);border:1px solid var(--border);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-within,.cl.click:focus-visible,.tokbtn:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
input[type=text],select,textarea{background:var(--code-bg);border:1px solid var(--code-border);border-radius:10px;padding:9px 12px;width:100%}
textarea{font-family:var(--mono);font-size:14.5px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:20px}

.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

.codebox{background:var(--code-bg);border:1px solid var(--code-border);border-radius:10px;margin:10px 0;overflow-x:auto;padding:10px 0}
.cl{display:flex;font-family:var(--mono);font-size:14px;line-height:1.7;color:var(--code-text);white-space:pre;padding-right:14px}
.cl .ln{flex:0 0 42px;text-align:right;padding-right:14px;color:var(--code-ln);user-select:none}
.cl.click{cursor:pointer}
.cl.click:hover{background:#1a2036}
.cl.sel{background:var(--warn-soft);box-shadow:inset 3px 0 0 var(--warn)}
.cl.right{background:var(--good-soft);box-shadow:inset 3px 0 0 var(--good)}
.cl.wrong{background:var(--bad-soft);box-shadow:inset 3px 0 0 var(--bad)}
.cl.missed{box-shadow:inset 3px 0 0 var(--good)}
.cl input{width:130px;padding:1px 8px;border-radius:6px;font-family:var(--mono);font-size:14px;border-color:var(--brand)}
.outlabel{font-size:13px;color:var(--muted);margin:8px 0 4px}

.tyrow{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--border)}
.tyrow:last-child{border-bottom:0}
.tyrow .lit{font-family:var(--mono);flex:1;color:var(--code-text)}
.tyrow select{width:150px}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border-radius:10px;border:1px dashed var(--border);margin:8px 0}
.tray.answer{border-style:solid;background:var(--code-bg);border-color:var(--code-border)}
.tokbtn{font-family:var(--mono);font-size:14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 11px;cursor:pointer;color:var(--code-text)}
.tokbtn:disabled{cursor:default}
.tray.answer .tokbtn{background:var(--brand-soft);border-color:var(--brand)}
.tray .ph{color:var(--muted);font-size:13.5px;align-self:center}

.fb{margin-top:12px;border-radius:10px;padding:10px 14px;font-size:14.5px;border:1px solid var(--border);background:var(--surface2);color:var(--ink2)}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)} .fb b.part{color:var(--warn)}
.fb pre{font-family:var(--mono);font-size:13.5px;margin-top:6px;white-space:pre-wrap;color:var(--code-text)}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:14px;align-items:center}
#bar .grow{flex:1;color:var(--muted);font-size:13.5px}
.codeout{font-family:var(--mono);font-size:13px;word-break:break-all;background:var(--code-bg);border:1px solid var(--code-border);border-radius:10px;padding:12px;max-height:150px;overflow:auto;margin:10px 0;user-select:all}
.score{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:20px;color:var(--muted);font-weight:600}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.parts div{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.parts div b{display:block;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.sealed{border-color:var(--warn);background:var(--warn-soft)}
#instr{border-color:var(--brand)}
.rc{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.14em;color:var(--warn)}
.tblwrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--brand-ink);font-weight:600;margin-top:14px}
.keylist{font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:var(--ink2);margin-top:8px}
footer{max-width:880px;margin:0 auto;padding:0 16px 20px;color:var(--muted);font-size:13px}
footer a{color:var(--muted)}
@media (max-width:600px){h1{font-size:24px}.card{padding:16px}#top .ttl small{display:none}.tyrow{flex-wrap:wrap}}
@media print{
  body{background:#fff;color:#000;padding:0}
  #top,#bar,footer,#instr,.noprint{display:none !important}
  .card{border:1px solid #999;background:#fff;break-inside:avoid}
  .codebox,.codeout,input,select,textarea,.opt,.tray,.tokbtn,.fb,.parts div{background:#fff !important;color:#000 !important;border-color:#999 !important}
  .cl,.cl .ln,.sub,.partnote,.pts,.qnum,.eyebrow,.tyrow .lit{color:#000 !important}
  .opt.sel{border:2px solid #000 !important}
  .cl.sel{box-shadow:inset 4px 0 0 #000}
}
</style>
</head>

/* ---------- tiny helpers ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');}
function utf8(s){return new TextEncoder().encode(s);}
function hex(b){var o='';for(var i=0;i<b.length;i++)o+=(b[i]<16?'0':'')+b[i].toString(16);return o;}
function unhex(h){var b=new Uint8Array(h.length/2);for(var i=0;i<b.length;i++)b[i]=parseInt(h.substr(i*2,2),16);return b;}
function cat(a,b){var o=new Uint8Array(a.length+b.length);o.set(a);o.set(b,a.length);return o;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}

function b64e(s){var b=utf8(s),t='';for(var i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var t=atob(s),b=new Uint8Array(t.length);for(var i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return new TextDecoder().decode(b);}

/* ---------- SHA-256 (pure JS so the page works anywhere, even opened as a file) ---------- */
var K256=(function(){var k=[],n=2,i=0;function isP(x){for(var d=2;d*d<=x;d++)if(x%d===0)return false;return true;}
  while(i<64){if(isP(n)){var c=Math.pow(n,1/3);k[i++]=((c-Math.floor(c))*4294967296)>>>0;}n++;}return k;})();
function sha(msg){
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l=msg.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(msg);m[l]=0x80;
  var bits=l*8;m[n-4]=bits>>>24;m[n-3]=(bits>>>16)&255;m[n-2]=(bits>>>8)&255;m[n-1]=bits&255;
  var w=new Uint32Array(64);
  for(var off=0;off<n;off+=64){
    for(var i=0;i<16;i++)w[i]=(m[off+i*4]<<24|m[off+i*4+1]<<16|m[off+i*4+2]<<8|m[off+i*4+3])>>>0;
    for(i=16;i<64;i++){var x=w[i-15],y=w[i-2];
      w[i]=(w[i-16]+((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+w[i-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10)))>>>0;}
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var t1=(h+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&f)^(~e&g))+K256[i]+w[i])>>>0;
      var t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&b)^(a&c)^(b&c)))>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  var out=new Uint8Array(32);for(i=0;i<8;i++){out[i*4]=H[i]>>>24;out[i*4+1]=(H[i]>>>16)&255;out[i*4+2]=(H[i]>>>8)&255;out[i*4+3]=H[i]&255;}
  return out;
}
function kdf(pass,salt){var h=sha(utf8(salt+'|'+pass));for(var i=0;i<ITER;i++)h=sha(h);return h;}
function unwrap(pass,salt,wrapHex){ // returns master key or null
  var k=kdf(pass,salt),w=unhex(wrapHex),m=new Uint8Array(32);for(var i=0;i<32;i++)m[i]=w[i]^k[i];
  return checkM(m)?m:null;
}
function checkM(m){return hex(sha(m)).slice(0,16)===SEAL.chk;}
function openKey(m){
  var ct=unhex(SEAL.blob),pt=new Uint8Array(ct.length);
  for(var blk=0;blk*32<ct.length;blk++){
    var ks=sha(cat(m,new Uint8Array([blk>>>24,(blk>>>16)&255,(blk>>>8)&255,blk&255])));
    for(var i=0;i<32&&blk*32+i<ct.length;i++)pt[blk*32+i]=ct[blk*32+i]^ks[i];
  }
  return JSON.parse(new TextDecoder().decode(pt));
}
function normCode(s){return String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');}

/* ---------- seeded per-student versions (from last name) ---------- */
function normName(n){return String(n).trim().replace(/\s+/g,' ').toLowerCase();}
function seedOf(name,tag){var s=normName(name)+'#'+tag,h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){var a=seed;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,name,tag){var r=rng(seedOf(name,tag)),a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function variant(name,id,n){return seedOf(name,'v'+id)%n;}

/* ---------- grading (needs the opened key) ---------- */
function normOut(s){return String(s||'').replace(/\r/g,'').split('\n').map(function(l){return l.trim();}).filter(function(l){return l!=='';});}
function r1(x){return Math.round(x*10)/10;}
function grade(name,ans,K){
  var items=[],parts={},total=0;
  function add(part,id,label,got,max,ok,yours,correct,why){items.push({part:part,id:id,label:label,got:got,max:max,yours:yours,correct:correct,why:why||''});parts[part]=r1((parts[part]||0)+got);}
  QD.mc.forEach(function(q){var k=K.mc[q.id],a=ans[q.id]||'';function txt(id){for(var i=0;i<q.o.length;i++)if(q.o[i][0]===id)return q.o[i][1];return '(no answer)';}
    add('mc',q.id,q.q,a===k[0]?PTS.mc:0,PTS.mc,a===k[0],txt(a),txt(k[0]),k[1]);});
  QD.po.forEach(function(q){var k=K.po[q.id],vi=variant(name,q.id,q.v.length),exp=normOut(k[0][vi]),stu=normOut(ans[q.id]);
    var hit=0;for(var i=0;i<exp.length;i++)if(stu[i]===exp[i])hit++;
    var got=r1(PTS.po*hit/Math.max(exp.length,stu.length));
    add('po',q.id,'Predict the output',got,PTS.po,got===PTS.po,stu.join('\n')||'(no answer)',exp.join('\n'),k[1]);});
  (function(){var k=K.bug,sel=(ans.bug||[]).slice(0,4),hit=0;sel.forEach(function(l){if(k[0].indexOf(l)>=0)hit++;});
    add('bug','bug','Bug hunt',hit*PTS.bug,4*PTS.bug,hit===4,sel.length?'lines '+sel.slice().sort(function(a,b){return a-b;}).join(', '):'(no lines chosen)','lines '+k[0].join(', '),k[0].map(function(l){return 'Line '+l+': '+k[1][l];}).join('\n'));})();
  QD.ty.forEach(function(q){var k=K.ty[q[0]],a=ans[q[0]]||'';add('ty',q[0],'Type of '+q[1],a===k?PTS.ty:0,PTS.ty,a===k,a||'(no answer)',k,'');});
  QD.tok.forEach(function(q){var k=K.tok[q.id],a=(ans[q.id]||[]).join(' ');add('tok',q.id,q.q,a===k[0]?PTS.tok:0,PTS.tok,a===k[0],a||'(no answer)',k[0],k[1]);});
  QD.bl.forEach(function(q){var k=K.bl[q.id],a=String(ans[q.id]||'').trim(),ok=k[0].indexOf(a)>=0;add('bl',q.id,q.q,ok?PTS.bl:0,PTS.bl,ok,a||'(no answer)',k[0][0],k[1]);});
  items.forEach(function(i){total+=i.got;});
  return {total:r1(total),parts:parts,items:items};
}

/* ---------- submission codes ---------- */
function makeCode(){
  var body=b64e(JSON.stringify({a:AID,n:S.name,t:new Date().toISOString(),r:S.ans}));
  return AID+'.'+body+'.'+receipt(body);
}
function receipt(body){return hex(sha(utf8(body+'|'+AID+'|seal'))).slice(0,6).toUpperCase();}
function readCode(code){
  var p=String(code).trim().split('.');if(p.length!==3||p[0]!==AID)return null;
  try{var o=JSON.parse(b64d(p[1]));if(!o||!o.n||!o.r)return null;return {name:o.n,t:o.t,ans:o.r,rcpt:p[2],ok:receipt(p[1])===p[2]};}catch(e){return null;}
}

/* ---------- rendering the assignment ---------- */
function codeLines(code,opts){
  opts=opts||{};
  return '<div class="codebox">'+code.split('\n').map(function(l,i){
    var n=i+1,cls='cl',attr='';
    if(opts.click&&l.trim()!==''){cls+=' click';attr=' tabindex="0" role="button" data-line="'+n+'"';}
    var body=esc(l)||' ';
    if(opts.blank)body=body.replace('____','<input type="text" id="in_'+opts.blank+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="missing code">');
    return '<div class="'+cls+'"'+attr+'><span class="ln">'+(opts.noln?'':n)+'</span><span>'+body+'</span></div>';
  }).join('')+'</div>';
}

function paintMC(id){var els=document.querySelectorAll('input[name="'+id+'"]');for(var i=0;i<els.length;i++)els[i].parentNode.classList.toggle('sel',els[i].checked);}

function restore(){

  progress();
}
function countAnswered(){var c=0,t=0;
  QD.mc.forEach(function(q){t++;if(S.ans[q.id])c++;});
  QD.po.concat(QD.bl).forEach(function(q){t++;if(String(S.ans[q.id]||'').trim())c++;});
  t++;if((S.ans.bug||[]).length)c++;
  QD.ty.forEach(function(q){t++;if(S.ans[q[0]])c++;});
  QD.tok.forEach(function(q){t++;if((S.ans[q.id]||[]).length)c++;});
  return [c,t];}
function progress(){var p=countAnswered();$('progressBar').style.width=(100*p[0]/p[1])+'%';$('progTxt').textContent=p[0]+' / '+p[1]+' answered';
  $('barTxt').textContent=locked()?'Submitted and locked.':(p[0]<p[1]?(p[1]-p[0])+' item(s) still unanswered · your work saves automatically on this device':'Everything answered · ready to submit');}
function changed(){save();progress();}

/* ---------- start, submit, status ---------- */
function showStart(){
  $('start').innerHTML='<p class="eyebrow">Week 1 · Auto-graded assignment · 100 points</p><h1>C# Syntax — show what you can read and write</h1>'+
   '<p class="sub">Based on the Week 1 lecture: the program skeleton, statements, variables, data types and conversion, strings, arithmetic, methods, objects, and the four grammar rules.</p>'+
   '<div class="card"><label for="nameIn"><b>Your last name</b></label><p class="partnote">Last name only. Do not enter a student ID.</p>'+
   '<div class="row"><input type="text" id="nameIn" maxlength="40" autocomplete="family-name" style="max-width:320px" placeholder="e.g. Lopez"><button class="btn" id="beginBtn">Begin</button></div><div class="err" id="nameErr" role="alert"></div>'+
   '<ul class="rules"><li>Your version of some questions is generated from your last name — type it the same way every time.</li><li>Answers save automatically on this device. You can close the page and come back.</li><li>When you press <b>Lock &amp; submit</b> your answers are final and you receive a submission code to paste into Brightspace.</li><li>Your grade stays hidden until your professor gives the class a release code.</li></ul></div>'+
   '<details class="card"><summary style="margin-top:0">Already submitted on another device? Check your grade</summary><p class="partnote" style="margin-top:10px">Paste your submission code, then enter the release code from your professor.</p><textarea id="lateCode" rows="3" placeholder="M109A1. …" aria-label="submission code"></textarea><div class="row" style="margin-top:10px"><button class="btn ghost" id="lateBtn">Load my submission</button></div><div class="err" id="lateErr" role="alert"></div></details>';
  $('beginBtn').onclick=begin;$('nameIn').onkeydown=function(e){if(e.key==='Enter')begin();};
  $('lateBtn').onclick=function(){var o=readCode($('lateCode').value);if(!o||!o.ok){$('lateErr').textContent='That is not a valid submission code. Copy the whole code, from M109A1 to the end.';return;}
    S.name=o.name;S.ans=o.ans;S.sub={code:$('lateCode').value.trim(),t:o.t};save();enter();};
}
function begin(){var v=$('nameIn').value.trim().replace(/\s+/g,' ');
  if(/\d/.test(v)){$('nameErr').textContent='Last name only — no numbers or ID.';return;}
  if(!/^[A-Za-zÀ-ɏ' -]{2,40}$/.test(v)){$('nameErr').textContent='Please type your last name (letters only, at least 2).';return;}
  S.name=v;S.ans={};S.sub=null;save();enter();}
function enter(){
  $('start').classList.add('hidden');$('work').classList.remove('hidden');$('bar').classList.remove('hidden');
  $('who').textContent=S.name;$('who').classList.remove('hidden');
  render();showStatus();
}
function submit(){
  var p=countAnswered(),msg=(p[0]<p[1]?'You still have '+(p[1]-p[0])+' unanswered item(s).\n\n':'')+'Lock and submit? You will not be able to change your answers.';
  if(!window.confirm(msg))return;
  S.sub={code:makeCode(),t:new Date().toISOString()};save();restore();QD.tok.forEach(paintTok);showStatus();window.scrollTo(0,0);
}
function showStatus(){
  var st=$('status');$('submitBtn').classList.toggle('hidden',locked());
  if(!locked()){st.innerHTML=INSTR?'<div class="card"><b>Instructor preview.</b> <span class="sub">Answer as “'+esc(S.name)+'”; your grade appears as soon as you submit.</span> <button class="btn ghost small" id="resetBtn">Start over</button></div>':'';hookReset();return;}
  var o=readCode(S.sub.code),h='<div class="card"><p class="eyebrow">Submitted · '+esc(new Date(S.sub.t).toLocaleString())+'</p><h1 style="font-size:24px">Thank you, '+esc(S.name)+'. Your answers are locked.</h1>'+
   '<p class="sub">Copy this submission code and paste it into the Brightspace assignment. Receipt: <b class="mono">'+esc(o?o.rcpt:'')+'</b></p><div class="codeout" id="codeOut">'+esc(S.sub.code)+'</div>'+
   '<div class="row noprint"><button class="btn" id="copyBtn">Copy submission code</button>'+(INSTR?'<button class="btn ghost small" id="resetBtn">Start over</button>':'')+'<span id="copyMsg" class="sub"></span></div></div>';
  if(KEY){h+=resultCard(grade(S.name,S.ans,KEY));}
  else{h+='<div class="card sealed noprint"><b>Your grade is sealed.</b><p class="sub">It will open when your professor gives the class a release code.</p><div class="row" style="margin-top:10px"><input type="text" id="rcIn" maxlength="12" style="max-width:200px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em" placeholder="Release code" aria-label="release code" autocomplete="off"><button class="btn" id="rcBtn">Show my grade</button></div><div class="err" id="rcErr" role="alert"></div></div>';}
  st.innerHTML=h;hookReset();
  $('copyBtn').onclick=function(){var done=function(){$('copyMsg').textContent='Copied.';};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(S.sub.code).then(done,sel);else sel();
    function sel(){var r=document.createRange();r.selectNodeContents($('codeOut'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);$('copyMsg').textContent='Code selected — press Ctrl/⌘+C.';}};
  if($('rcBtn')){$('rcBtn').onclick=tryRelease;$('rcIn').onkeydown=function(e){if(e.key==='Enter')tryRelease();};}
  if(KEY)feedback(grade(S.name,S.ans,KEY));
}
function hookReset(){if($('resetBtn'))$('resetBtn').onclick=function(){if(!window.confirm('Clear this attempt on this device and start over?'))return;lsDel(LS_STATE);location.reload();};}
function tryRelease(){
  var c=normCode($('rcIn').value);if(c.length<4){$('rcErr').textContent='Enter the release code from your professor.';return;}
  $('rcErr').textContent='Checking…';
  setTimeout(function(){var m=unwrap(c,SEAL.sR,SEAL.wR);
    if(!m){$('rcErr').textContent='That code is not correct. Grades open only after your professor releases them.';return;}
    KEY=openKey(m);S.rc=c;save();showStatus();},30);
}
function resultCard(g){
  return '<div class="card"><p class="eyebrow">Your grade</p><div class="score">'+g.total+'<small> / 100</small></div><div class="parts">'+
    PARTS.map(function(p){return '<div>'+p[1]+'<b>'+(g.parts[p[0]]||0)+' / '+p[2]+'</b></div>';}).join('')+'</div><p class="sub" style="margin-top:12px">Scroll down to see each question marked, with the correct answer and why.</p></div>';
}
function feedback(g){
  g.items.forEach(function(it){
    var card=$('q_'+(it.part==='ty'?'ty':it.id));if(!card)return;
    var full=it.got===it.max,cls=full?'ok':(it.got>0?'part':'no');
    if(it.part==='mc'){var k=KEY.mc[it.id][0],els=document.querySelectorAll('input[name="'+it.id+'"]');
      for(var i=0;i<els.length;i++){var L=els[i].parentNode;if(els[i].value===k)L.classList.add('right');else if(els[i].checked)L.classList.add('wrong');}}
    if(it.part==='bug'){var good=KEY.bug[0],sel=S.ans.bug||[],ls=document.querySelectorAll('#bugBox .cl.click');
      for(var j=0;j<ls.length;j++){var n=+ls[j].getAttribute('data-line'),isG=good.indexOf(n)>=0,isS=sel.indexOf(n)>=0;ls[j].classList.remove('sel');
        if(isG&&isS)ls[j].classList.add('right');else if(isS)ls[j].classList.add('wrong');else if(isG)ls[j].classList.add('missed');}}
    if(it.part==='ty'){var row=$('row_'+it.id);if(row&&!row.querySelector('.tyfb'))row.insertAdjacentHTML('beforeend','<span class="tyfb pts"><b class="'+cls+'" style="color:var(--'+(full?'good':'bad')+')">'+(full?'✓ correct':'✗ '+esc(it.correct))+'</b></span>');return;}
    var multi=/\n/.test(it.correct)||it.part==='po';
    card.querySelector('.fbslot').innerHTML='<div class="fb"><b class="'+cls+'">'+(full?'✓ Correct':(it.got>0?'◐ Partly correct':'✗ Not correct'))+' · '+it.got+' / '+it.max+'</b>'+
      (full?'':(multi?'<div>Correct answer:</div><pre>'+esc(it.correct)+'</pre>':'<div>Correct answer: <code>'+fmt(it.correct)+'</code></div>'))+
      (it.why?(/\n/.test(it.why)?'<pre>'+esc(it.why)+'</pre>':'<div>'+fmt(it.why)+'</div>'):'')+'</div>';
  });
}

/* ---------- instructor console ---------- */
function roster(){try{return JSON.parse(lsGet(LS_ROSTER)||'[]');}catch(e){return [];}}
function showInstr(){
  var el=$('instr');el.classList.remove('hidden');
  var rc=KEY.rc,codes=roster();
  var rows=codes.map(function(c){var o=readCode(c);if(!o)return null;var g=grade(o.name,o.ans,KEY);return {o:o,g:g};}).filter(Boolean)
    .sort(function(a,b){return normName(a.o.name)<normName(b.o.name)?-1:1;});
  var seen={};rows.forEach(function(r){var k=normName(r.o.name);seen[k]=(seen[k]||0)+1;});
  var h='<p class="eyebrow">Instructor console · only visible on this device</p>'+
    '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="sub">Release code — give this to the class when you want grades to open</div><div class="rc">'+esc(rc.slice(0,3)+'-'+rc.slice(3))+'</div></div>'+
    '<div class="sub" style="text-align:right">'+rows.length+' submission(s)'+(rows.length?' · average <b style="color:var(--ink)">'+r1(rows.reduce(function(s,r){return s+r.g.total;},0)/rows.length)+'</b>':'')+'</div></div>'+
    '<div class="outlabel" style="margin-top:16px">Paste submission codes from Brightspace (one or many, separated by spaces or new lines)</div><textarea id="pasteIn" rows="3" placeholder="M109A1. …" aria-label="submission codes"></textarea>'+
    '<div class="row" style="margin-top:10px"><button class="btn" id="addBtn">Grade pasted codes</button><button class="btn ghost small" id="csvBtn"'+(rows.length?'':' disabled')+'>Download CSV</button><button class="btn ghost small" id="clrBtn"'+(rows.length?'':' disabled')+'>Clear list</button><span id="addMsg" class="sub"></span></div>';
  if(rows.length){h+='<div class="tblwrap"><table><thead><tr><th>Last name</th><th class="num">Grade</th>'+PARTS.map(function(p){return '<th class="num">'+p[1]+'</th>';}).join('')+'<th>Submitted</th><th>Receipt</th></tr></thead><tbody>'+
    rows.map(function(r){var dup=seen[normName(r.o.name)]>1;return '<tr><td>'+esc(r.o.name)+(dup?' <span style="color:var(--warn)" title="More than one submission with this last name">⚠ duplicate</span>':'')+'</td><td class="num"><b>'+r.g.total+'</b></td>'+
      PARTS.map(function(p){return '<td class="num">'+(r.g.parts[p[0]]||0)+'</td>';}).join('')+'<td>'+esc(r.o.t?new Date(r.o.t).toLocaleString():'')+'</td><td class="mono">'+esc(r.o.rcpt)+(r.o.ok?'':' <span style="color:var(--bad)">✗ altered</span>')+'</td></tr>';}).join('')+'</tbody></table></div>';}
  h+='<details><summary>Answer key</summary><div class="keylist">'+esc(keyText())+'</div></details>'+
    '<p class="sub" style="margin-top:14px;font-size:13.5px">You are signed in as instructor on this browser, so no code is needed here. <a href="#" id="outLink" style="color:var(--brand-ink)">Sign out on this device</a></p>';
  el.innerHTML=h;
  $('addBtn').onclick=function(){var toks=$('pasteIn').value.split(/\s+/).filter(Boolean),cur=roster(),add=0,bad=0;
    toks.forEach(function(t){var o=readCode(t);if(!o){bad++;return;}if(cur.indexOf(t)<0){cur.push(t);add++;}});
    lsSet(LS_ROSTER,JSON.stringify(cur));showInstr();$('addMsg').textContent=add+' added'+(bad?' · '+bad+' not recognized':'');};
  $('clrBtn').onclick=function(){if(window.confirm('Remove all graded submissions from this device?')){lsDel(LS_ROSTER);showInstr();}};
  $('csvBtn').onclick=function(){var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"';};
    var csv=[['Last name','Grade'].concat(PARTS.map(function(p){return p[1];})).concat(['Submitted','Receipt','Code intact']).map(q).join(',')].concat(rows.map(function(r){
      return [r.o.name,r.g.total].concat(PARTS.map(function(p){return r.g.parts[p[0]]||0;})).concat([r.o.t||'',r.o.rcpt,r.o.ok?'yes':'NO']).map(q).join(',');})).join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='MAC109_Assignment1_grades.csv';document.body.appendChild(a);a.click();a.remove();};
  $('outLink').onclick=function(e){e.preventDefault();lsDel(LS_IK);location.reload();};
}
function keyText(){var K=KEY,o=[];
  o.push('PART A');QD.mc.forEach(function(q){var k=K.mc[q.id][0];q.o.forEach(function(op){if(op[0]===k)o.push('  '+q.q.replace(/`/g,'')+'\n      → '+op[1].replace(/`/g,''));});});
  o.push('PART B (version depends on last name)');QD.po.forEach(function(q,i){K.po[q.id][0].forEach(function(a,v){o.push('  Program '+(i+1)+' v'+(v+1)+': '+a.split('\n').join(' ⏎ '));});});
  o.push('PART C  broken lines: '+K.bug[0].join(', '));
  o.push('PART D');QD.ty.forEach(function(q){o.push('  '+q[1]+' → '+K.ty[q[0]]);});
  o.push('PART E');QD.tok.forEach(function(q){o.push('  '+K.tok[q.id][0]);});
  o.push('PART F');QD.bl.forEach(function(q){o.push('  '+K.bl[q.id][0].join(' or '));});
  return o.join('\n');}
function instrLogin(e){
  e.preventDefault();if(INSTR)return;
  var p=window.prompt('Instructor passcode');if(!p)return;
  var m=unwrap(p.trim(),SEAL.sI,SEAL.wI);if(!m){window.alert('Incorrect passcode.');return;}
  lsSet(LS_IK,hex(m));location.reload();
}

/* ---------- boot ---------- */
load();
(function(){var ik=lsGet(LS_IK);if(ik&&/^[0-9a-f]{64}$/.test(ik)){var m=unhex(ik);if(checkM(m)){KEY=openKey(m);INSTR=true;}}
  if(!KEY&&S.rc){var m2=unwrap(S.rc,SEAL.sR,SEAL.wR);if(m2)KEY=openKey(m2);}})();
$('instrLink').onclick=instrLogin;
$('submitBtn').onclick=submit;
$('printBtn').onclick=function(){window.print();};
if(INSTR){showInstr();$('instrLink').classList.add('hidden');}
if(S.name)enter();else showStart();
})();
</script>
</body>
