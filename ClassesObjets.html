<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>MAC 109 · Classes &amp; Objects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1220;--surface:#181c2e;--surface2:#222840;--border:#2f3654;
  --ink:#eef0f8;--ink2:#c3c9dd;--muted:#9098b4;
  --brand:#6d63ff;--brand2:#a45cff;--brand-soft:#2a2d55;--brand-ink:#c9c5ff;
  --good:#22c58b;--good-soft:#12352b;--bad:#f06a60;--bad-soft:#3d1f23;--warn:#f5b83d;--warn-soft:#352b12;
  --code-bg:#0a0d18;--code-bar:#151a2c;--code-border:#2a3150;--code-text:#e6e9f2;--code-ln:#5b627a;
  --kw:#7aa2f7;--type:#2ac3de;--str:#e0af68;--com:#7f8aa8;--met:#c0caf5;--num:#ff9e64;--hl:#2c3350;--pin:#3b4a7a;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace;
  --radius:14px;--shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--sans)}
b{font-weight:700}
#app{display:flex;flex-direction:column;height:100vh}
#top{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:10px 22px;flex:0 0 auto}
#top .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
#top .ttl{font-weight:700;font-size:15px}
#top .ttl small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
#top .right{margin-left:auto;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:14px}
#progressWrap{width:140px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
#progressBar{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}
#tabstrip{background:var(--surface);display:flex;overflow-x:auto;flex:0 0 auto;border-bottom:1px solid var(--border);padding:0 14px;scrollbar-width:thin;gap:2px}
.tab{background:transparent;color:var(--ink2);border:none;border-bottom:3px solid transparent;padding:10px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.tab:hover{color:var(--brand-ink)}
.tab.active{color:#8b83ff;border-bottom-color:#8b83ff}
.tab.active .dot{background:#8b83ff}
.tab.done .dot{background:var(--good)}
#stage{flex:1 1 auto;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;overflow-y:auto;padding:34px max(40px,calc((100% - 1200px)/2)) 110px;display:none;animation:slidein .3s ease}
.slide.active{display:block}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}*{transition:none!important}}
#bottom{background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 22px;flex:0 0 auto}
#bottom button{background:var(--brand);color:#fff;border:none;padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600}
#bottom button.ghost{background:var(--surface2);color:var(--ink)}
#bottom button:disabled{opacity:.35;cursor:default}
#bottom .where{color:var(--muted);font-size:13px}
#bottom .grow{flex:1}
#bottom .hint{color:var(--muted);font-size:12.5px}
@media(max-width:700px){#bottom .hint,#top .right,#top .ttl small{display:none}.slide{padding:22px 16px 110px}}

.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8b83ff;margin-bottom:10px;font-weight:600}
h1{font-size:clamp(30px,4.2vw,46px);font-weight:800;line-height:1.12;margin-bottom:14px;letter-spacing:-.02em}
h2{font-size:clamp(24px,3vw,32px);font-weight:800;margin-bottom:8px;letter-spacing:-.015em;line-height:1.2}
h3{font-size:17px;font-weight:700}
h3.sec{font-size:20px;margin:28px 0 6px}
.sub{color:var(--ink2);max-width:80ch;font-size:16.5px;margin-bottom:20px}
.grad{background:linear-gradient(90deg,#8b83ff,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card p{color:var(--ink2);font-size:15px;margin-top:6px}
.pill{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--brand-soft);color:var(--brand-ink);border-radius:20px;padding:3px 11px;margin-bottom:8px;font-weight:600}
.pill.g{background:var(--good-soft);color:#7ff0c3}.pill.w{background:var(--warn-soft);color:#fcd67a}.pill.r{background:var(--bad-soft);color:#ffb3ac}
code.inline,.card code,.sub code,li code,td code,.note code,.tip code,.why code,.q code,.fwhy code{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);padding:0 6px;border-radius:6px;font-size:.86em;color:var(--brand-ink)}
.note{background:var(--warn-soft);border:1px solid #5c4a1a;border-radius:12px;padding:12px 16px;color:#fbe3a6;font-size:14.5px;margin-top:16px}
.tip{background:var(--good-soft);border:1px solid #235e4a;border-radius:12px;padding:12px 16px;color:#bff5dd;font-size:14.5px;margin-top:16px}
.objlist li{list-style:none;padding:6px 0 6px 28px;position:relative;font-size:15.5px}
.objlist li::before{content:"▸";position:absolute;left:8px;color:#8b83ff;font-weight:700}
.checklist li{list-style:none;padding:9px 0 9px 32px;position:relative;font-size:15px;border-bottom:1px dashed var(--border)}
.checklist li::before{content:"✓";position:absolute;left:4px;color:var(--good);font-weight:800}
.kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:12.5px}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:start}
@media(max-width:900px){.hero{grid-template-columns:1fr}}

/* code + explanation */
.ex{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,1fr);gap:16px;align-items:start;margin:14px 0 24px}
@media(max-width:900px){.ex{grid-template-columns:1fr}}
.codewin{background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius);overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.codewin .bar{background:var(--code-bar);padding:9px 14px;font-family:var(--mono);font-size:12px;color:#aab1c8;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--code-border);flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}
.fname{font-weight:700;color:#e6e9f2}
.ftabs{display:flex;gap:4px}
.ftab{background:transparent;border:1px solid transparent;color:#8a92ad;border-radius:7px;padding:3px 10px;font-family:var(--mono);font-size:12px;cursor:pointer;font-weight:600}
.ftab.on{background:#262c48;border-color:#3d4661;color:#fff}
.tag{font-size:10.5px;background:#2f3650;color:#c0caf5;border-radius:20px;padding:2px 9px;font-family:var(--sans);font-weight:600}
.btns{margin-left:auto;display:flex;gap:6px}
.btns button{background:#2f3650;border:1px solid #3d4661;color:#e6e9f2;border-radius:7px;padding:3px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
.btns button:hover{background:#3b4463}
.btns button.run{background:var(--good);border-color:var(--good);color:#fff}
.codewin pre{padding:10px 0 12px;font-family:var(--mono);font-size:14px;line-height:1.7;overflow:auto;color:var(--code-text);max-height:640px}
.cl{display:flex;padding:0 14px 0 0;white-space:pre;border-left:3px solid transparent}
.cl .ln{width:44px;color:var(--code-ln);text-align:right;padding-right:16px;flex:0 0 auto;user-select:none}
.cl .src{white-space:pre;flex:1 1 auto}
.cl.explain{cursor:pointer}
.cl.explain:hover,.cl.explain.hot{background:var(--hl);border-left-color:#8b83ff}
.cl.explain.pinned{background:var(--pin);border-left-color:#ffd166}
.cl.explain:focus-visible{outline:none;background:var(--hl);border-left-color:#8b83ff}
.cl.step{background:rgba(255,176,32,.16);border-left-color:#ffb020}
.k{color:var(--kw)}.t{color:var(--type)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.m{color:var(--met)}.n{color:var(--num)}.p{color:var(--code-text)}
.explain-panel{position:sticky;top:6px}
.expl{background:var(--surface);border:1px solid var(--border);border-left:5px solid #8b83ff;border-radius:var(--radius);padding:16px 18px;min-height:150px;box-shadow:var(--shadow)}
.expl.pinned{border-left-color:#e0a800}
.expl .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pinbadge{display:none;background:var(--warn-soft);color:#fcd67a;border-radius:20px;padding:1px 8px;letter-spacing:0;text-transform:none;font-family:var(--sans);font-weight:600}
.expl.pinned .pinbadge{display:inline-block}
.expl .codeq{font-family:var(--mono);font-size:13px;color:var(--brand-ink);background:var(--brand-soft);border-radius:8px;padding:6px 10px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.expl .why{font-size:15.5px;color:var(--ink);line-height:1.65}
.expl .why b{color:var(--brand-ink)}
.expl.idle .codeq{display:none}
.expl.idle .why{color:var(--muted)}
.term{background:#0b0d16;border:1px solid #2a2f44;border-radius:var(--radius);padding:12px 16px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.8;color:#d8dcea;margin-top:12px;min-height:80px}
.term .thead{font-size:10.5px;letter-spacing:.12em;color:#6b7390;font-weight:700;margin-bottom:4px}
.term .tline{white-space:pre-wrap;animation:pop .25s ease;min-height:1.8em}
.term .placeholder{color:#5f6785;font-style:italic}
.term .tdone{color:#5f6785;font-style:italic;font-family:var(--sans);font-size:12px}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

/* flip */
.flip{perspective:900px;cursor:pointer;min-height:170px}
.flip .inner{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--border);padding:18px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.face.front{background:var(--surface)}
.face.front .big{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--brand-ink)}
.face.front small{color:var(--muted);margin-top:8px;font-size:12.5px}
.face.back{background:linear-gradient(135deg,#4a42c9,#7c3aed);color:#fff;transform:rotateY(180deg);border:none}
.face.back p{font-size:14px;line-height:1.5}
.face.back code{background:rgba(0,0,0,.25);border-radius:5px;padding:0 5px;font-family:var(--mono);font-size:12.5px}

/* blueprint visual */
.bp{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:6px 0 20px}
.bp-class{background:repeating-linear-gradient(0deg,#16284a 0 23px,#1b3159 23px 24px),repeating-linear-gradient(90deg,#16284a 0 23px,#1b3159 23px 24px);background-blend-mode:lighten;border:2px dashed #5d8bd6;border-radius:14px;padding:16px 20px;font-family:var(--mono);color:#cfe1ff;min-width:230px}
.bp-class b{display:block;color:#fff;font-size:16px;margin-bottom:6px}
.bp-class div{font-size:13px;opacity:.9}
.bp-arrow{font-family:var(--mono);color:#ffb020;font-size:14px;text-align:center}
.bp-arrow span{display:block;font-size:30px;line-height:1}
.bp-objs{display:flex;gap:12px;flex-wrap:wrap}
.bp-obj{background:var(--surface);border:2px solid var(--good);border-radius:14px;padding:12px 16px;font-family:var(--mono);font-size:13px;min-width:150px;box-shadow:var(--shadow)}
.bp-obj b{display:block;color:#7ff0c3;margin-bottom:4px}

/* anatomy */
.anat{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,1fr);gap:18px;align-items:start}
@media(max-width:900px){.anat{grid-template-columns:1fr}}
.anat-code{background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius);padding:16px 18px;font-family:var(--mono);font-size:14.5px;line-height:1.8;white-space:pre;overflow-x:auto}
.zone{border-radius:6px;cursor:pointer;padding:2px 4px;margin:0 -4px;display:inline-block;border:1px dashed transparent}
.zone:hover{border-color:#8b83ff}
.zone.on{background:#2c3350;border-color:#ffb020}
.zone.z1{color:#7aa2f7}.zone.z2{color:#2ac3de}.zone.z3{color:#e0af68}.zone.z4{color:#9ece6a}.zone.z5{color:#ff9e64}.zone.z6{color:#c0caf5}

/* factory */
.fac{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.fac{grid-template-columns:1fr}}
.fac-form label{display:block;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:10px}
.fac-form input{width:100%;background:var(--surface2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14.5px;margin-top:4px}
.bigbtn{margin-top:14px;width:100%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:10px;padding:11px;font-family:var(--mono);font-weight:700;font-size:14px;cursor:pointer}
.bigbtn.ghosty{background:var(--surface2);color:var(--ink);border:1px solid var(--border);font-family:var(--sans);font-size:13px;padding:8px}
.genline{margin-top:12px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border:1px solid var(--code-border);border-radius:9px;padding:9px 11px;color:var(--code-text);white-space:pre-wrap;word-break:break-word;min-height:42px}
.heap{background:repeating-linear-gradient(45deg,#121627 0 12px,#141a2e 12px 24px);border:1px solid var(--border);border-radius:var(--radius);padding:14px;min-height:240px}
.heap-h{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:10px}
.objs{display:flex;flex-wrap:wrap;gap:12px}
.obj{background:var(--surface);border:2px solid var(--c,#22c58b);border-radius:14px;padding:12px 14px;min-width:200px;box-shadow:var(--shadow);animation:born .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes born{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.obj .oh{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--c,#7ff0c3);font-weight:700;margin-bottom:6px}
.obj .vn{background:var(--c,#22c58b);color:#0b0d16;border-radius:6px;padding:0 7px}
.obj .fld{font-family:var(--mono);font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px}
.obj .fld b{color:var(--ink);font-weight:600}
.obj .fld.flash b{animation:flash 1s}
@keyframes flash{0%{color:#ffb020}100%{color:var(--ink)}}
.obj .ob{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.obj .ob button{background:var(--surface2);border:1px solid var(--border);color:var(--ink);border-radius:7px;padding:3px 9px;font-family:var(--mono);font-size:11.5px;cursor:pointer}
.obj .ob button:hover{border-color:var(--c)}
.flog{margin-top:12px}

/* memory stepper */
.mem{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:24px}
.memctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.memctl button{background:var(--surface2);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
.memctl button.go{background:#ffb020;color:#1b1400;border-color:#ffb020}
.memctl button:disabled{opacity:.35;cursor:default}
.memctl .ms{font-family:var(--mono);color:var(--muted);font-size:13px}
.memgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}
@media(max-width:800px){.memgrid{grid-template-columns:1fr}}
.mcol h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.var{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:7px 10px;margin-bottom:8px;font-family:var(--mono);font-size:14px;animation:pop .3s}
.var .ref{border-radius:6px;padding:0 8px;font-size:12.5px;color:#0b0d16;font-weight:700}
.var .val{color:var(--num);font-weight:700}
.mobjs{display:flex;gap:12px;flex-wrap:wrap}
.mobj{border:2px solid var(--c);border-radius:12px;padding:10px 14px;min-width:190px;font-family:var(--mono);font-size:13px;background:#12162a;animation:pop .3s}
.mobj .oh{color:var(--c);font-weight:700;margin-bottom:4px}
.mobj .who{color:var(--muted);font-size:11.5px;margin-top:6px}
.mobj .fld.ch b{color:#ffb020}
.mobj .fld{display:flex;justify-content:space-between;gap:10px;color:var(--ink2)}
.mobj .fld b{color:var(--ink);font-weight:600}
.memnote{margin-top:12px;color:var(--ink2);font-size:15px;min-height:48px}
.memout{margin-top:6px}

/* tables */
.bridge{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:14.5px}
.bridge th{background:var(--surface2);text-align:left;padding:11px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.bridge td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:top;color:var(--ink2)}
.bridge td b{color:var(--ink)}
.bridge td.arrow{color:#8b83ff;font-weight:800;text-align:center;width:36px}
.bridge td code{white-space:nowrap}

/* window preview */
.prevbox{margin-top:12px}
.prevcap-top{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:6px}
.prevcap{font-size:13.5px;color:var(--ink2);margin-top:6px}
.wv-wrap{position:relative;width:100%}
.wv{transform-origin:top left;border-radius:9px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5);font-family:'Segoe UI',Inter,system-ui,sans-serif;border:1px solid #9aa0b4;background:#fff}
.wv-title{height:32px;display:flex;align-items:center;gap:8px;padding-left:10px;background:#eeeeee;color:#1b1b1b;font-size:12.5px;border-bottom:1px solid #dcdcdc}
.wv-tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wv-btns{display:flex;height:100%}
.wv-btns i{font-style:normal;width:40px;display:flex;align-items:center;justify-content:center;color:#444;font-size:12px}
.wv-body{overflow:hidden;color:#1b1b1b;font-size:14px;background:#fff}
.wv-stack{display:flex;flex-direction:column;align-items:stretch}
.wv-text{line-height:1.3}
.wv-btn{align-self:flex-start;background:#fdfdfd;border:1px solid #d0d0d0;border-bottom-color:#bcbcbc;border-radius:4px;padding:5px 11px;font-size:14px;color:#1b1b1b;cursor:pointer;font-family:inherit;text-align:center}
.wv-btn:hover{filter:brightness(.97)}
.wv-btn:active{filter:brightness(.92)}
.wv-box{background:#fff;border:1px solid #c8c8c8;border-bottom:1px solid #8a8a8a;border-radius:4px;padding:6px 10px;font-size:14px;color:#1b1b1b;font-family:inherit;outline:none;width:100%}

<section data-tab="Start">
  <p class="eyebrow">Lecture · Object-Oriented Programming</p>
  <h1>Classes &amp; Objects:<br>design your <span class="grad">own types</span>, then build them with <code class="inline" style="font-size:.8em">new</code></h1>
  <div class="hero">
    <div>
      <p class="sub">So far you've used types other people wrote: <code>string</code>, <code>Button</code>, <code>TextBox</code>. Today you write your <b>own</b>. A <b>class</b> describes a kind of thing (a Student, a Book, a BankAccount), and <b>instantiation</b> means building real <b>objects</b> from it. This is the heart of C#, and the heart of your semester app: every student in your roster will be an object.</p>
      <p class="pill">By the end of today you can</p>
      <ul class="objlist">
        <li>Explain <b>class</b> vs <b>object</b> (blueprint vs real thing) and what <b>instantiation</b> means</li>
        <li>Write a class with <b>fields</b>, <b>properties</b> and <b>methods</b></li>
        <li>Create objects with <code>new</code>, a <b>constructor</b>, or an <b>object initializer</b></li>
        <li>Predict what happens when two variables refer to the <b>same object</b></li>
        <li>Protect data with <b>private</b> and read-only properties (<b>encapsulation</b>)</li>
        <li>Override <b>ToString()</b> and keep many objects in a <b>List</b></li>
        <li>Recognize every GUI control as an object, and put <b>your</b> objects in a window</li>
      </ul>
    </div>
    <div>
      <div class="card"><span class="pill g">How this page works</span><p>Every code box is a <b>complete program</b>. <b>Hover</b> any line and its explanation appears on the right; <b>click</b> a line to pin it. <b>▶ Run</b> shows the real output (each program was compiled and run), and <b>Copy</b> gives you the whole file for VS Code.</p></div>
      <div class="card" style="margin-top:14px"><span class="pill">The running example</span><p>Most examples use the <b>Student</b> class from your Student Management app: <code>Name</code>, <code>Id</code>, <code>Age</code>. Other examples come from the other course domains: <b>Library</b>, <b>Banking</b>, <b>Hotel</b>, <b>Inventory</b>, <b>Restaurant</b>.</p></div>
      <div class="tip">🧭 Running these in VS Code: create a <b>Console App</b> (Ctrl+Shift+P ▸ .NET: New Project ▸ Console App), replace everything in <b>Program.cs</b> with a copied example, press <b>F5</b>.</div>
    </div>
  </div>
</section>

<section data-tab="Big Idea">
  <p class="eyebrow">01 · The big idea</p>
  <h2>A class is a <span class="grad">blueprint</span>. An object is a <span class="grad">house built from it</span>.</h2>
  <p class="sub">An architect draws <b>one</b> blueprint and the builder makes <b>many</b> houses from it. Every house has the same rooms, but each has its own paint color and its own family. In C#, the blueprint is a <b>class</b>, each house is an <b>object</b>, and building one is <b>instantiation</b>, done with the keyword <code>new</code>.</p>
  <div class="bp">
    <div class="bp-class"><b>class Student</b><div>Name : string</div><div>Id &nbsp;&nbsp;: int</div><div>Age &nbsp;: int</div><div style="margin-top:6px;color:#9fd0ff">Introduce()</div></div>
    <div class="bp-arrow"><span>⟹</span>new Student()<br>× 3</div>
    <div class="bp-objs">
      <div class="bp-obj"><b>object #1</b>Name: "Maria"<br>Id: 1001<br>Age: 19</div>
      <div class="bp-obj"><b>object #2</b>Name: "Ahmed"<br>Id: 1002<br>Age: 22</div>
      <div class="bp-obj"><b>object #3</b>Name: "Lin"<br>Id: 1003<br>Age: 20</div>
    </div>
  </div>
  <h3 style="margin-bottom:10px">Vocabulary: flip each card (guess first!)</h3>
  <div class="grid4">
    <div class="flip" tabindex="0" role="button"><div class="inner"><div class="face front"><span class="big">class</span><small>▸ click to flip</small></div><div class="face back"><p>A <b>blueprint</b> for a kind of thing: what data it has and what it can do. Writing a class creates no objects.</p></div></div></div>
    <div class="flip" tabindex="0" role="button"><div class="inner"><div class="face front"><span class="big">object</span><small>▸ click to flip</small></div><div class="face back"><p>One real <b>thing</b> built from a class, with its own values. Also called an <b>instance</b>.</p></div></div></div>
    <div class="flip" tabindex="0" role="button"><div class="inner"><div class="face front"><span class="big">new</span><small>▸ click to flip</small></div><div class="face back"><p>The keyword that <b>instantiates</b> (builds) an object: <code>new Student()</code>. Every object starts with <b>new</b>.</p></div></div></div>
    <div class="flip" tabindex="0" role="button"><div class="inner"><div class="face front"><span class="big">constructor</span><small>▸ click to flip</small></div><div class="face back"><p>A special method with the class's name that runs automatically on <b>new</b>, to set the object up.</p></div></div></div>
    <div class="flip" tabindex="0" role="button"><div class="inner"><div class="face front"><span class="big">field</span><small>▸ click to flip</small></div><div class="face back"><p>A variable that lives <b>inside</b> each object: <code>public int Age;</code></p></div></div></div>
    <div class="flip" tabindex="0" role="button"><div class="inner"><div class="face front"><span class="big">property</span><small>▸ click to flip</small></div><div class="face back"><p>A named value with <b>get</b>/<b>set</b> that can guard its data: <code>public int Age { get; set; }</code>. <code>Text</code> and <code>Width</code> are properties.</p></div></div></div>
    <div class="flip" tabindex="0" role="button"><div class="inner"><div class="face front"><span class="big">method</span><small>▸ click to flip</small></div><div class="face back"><p>Something an object can <b>do</b>: <code>s1.Introduce();</code></p></div></div></div>
    <div class="flip" tabindex="0" role="button"><div class="inner"><div class="face front"><span class="big">reference</span><small>▸ click to flip</small></div><div class="face back"><p>What an object variable really holds: an <b>arrow</b> to the object, not the object itself.</p></div></div></div>
  </div>
  <h3 class="sec">Surprise: you've been using objects for weeks</h3>
  <div class="used">
    <div><code>"Maria".Length</code>Every string is an object with properties.</div>
    <div><code>new Button { Content = "Save" }</code>Instantiating Avalonia's Button class.</div>
    <div><code>txtName.Text</code>Reading a property of a TextBox object.</div>
    <div><code>new Thickness(20)</code>Calling a constructor with an argument.</div>
    <div><code>new MainWindow()</code>Program.cs instantiates <b>your</b> window class.</div>
    <div><code>btnGo.Click += …</code>Events belong to objects too.</div>
    <div><code>name.ToUpper()</code>Calling a method on an object.</div>
    <div><code>List&lt;string&gt;</code>Collections are objects that hold objects.</div>
  </div>
</section>

<section data-tab="First Class">
  <p class="eyebrow">02 · Your first class</p>
  <h2>Write a class, then <span class="grad">instantiate</span> it with <code class="inline" style="font-size:.8em">new</code></h2>
  <p class="sub">Click each colored part of the class to learn its name. Then hover the full program below.</p>
  <div class="anat">
<div class="anat-code"><span class="zone z1" data-z="0">class</span> <span class="zone z2" data-z="1">Student</span>
<span class="zone z6" data-z="2">{</span>
    <span class="zone z3" data-z="3">public</span> <span class="zone z4" data-z="4">string Name = "";</span>
    <span class="zone z3" data-z="3">public</span> <span class="zone z4" data-z="4">int Id;</span>
    <span class="zone z3" data-z="3">public</span> <span class="zone z4" data-z="4">int Age;</span>
<span class="zone z6" data-z="2">}</span>

<span class="zone z2" data-z="5">Student</span> s1 = <span class="zone z5" data-z="6">new Student()</span>;
s1<span class="zone z5" data-z="7">.</span>Name = "Maria";</div>
    <div class="expl" id="zInfo"><div class="lbl" id="zLbl">Click a colored part ←</div><div class="why" id="zText">Every class follows this shape: the keyword <b>class</b>, a name, and a body in braces holding the data each object will carry.</div></div>
  </div>
  <div class="ex" data-ex="first"></div>
  <div class="note">🧠 <b>Two places, two jobs:</b> the <b>class</b> (top) <i>describes</i> a student; <b>Main</b> (bottom) <i>creates and uses</i> one. In bigger projects the class gets its own file, <b>Student.cs</b>, just like in your Student Management app.</div>
</section>

<section data-tab="Many Objects">
  <p class="eyebrow">03 · One class, many objects</p>
  <h2>Each object keeps <span class="grad">its own data</span></h2>
  <p class="sub">Three <code>new</code>s = three separate students. Changing one never changes the others. Run it and check that only Ahmed got older.</p>
  <div class="ex" data-ex="many"></div>
  <h3 class="sec">What's inside a brand-new object?</h3>
  <p class="sub">Before you set anything, every field holds its type's <b>default value</b>: numbers are <code>0</code>, bools are <code>false</code>, and a string is whatever you initialized it to (we use <code>""</code>).</p>
  <div class="ex" data-ex="defaults"></div>
</section>

<section data-tab="★ Object Factory">
  <p class="eyebrow">04 · Try it: the object factory</p>
  <h2>Press <code class="inline" style="font-size:.8em">new</code> and watch objects <span class="grad">appear in memory</span></h2>
  <p class="sub">Fill in the form and instantiate Students. Each one gets its own box in memory (the <b>heap</b>). Then call methods on individual objects and see that only <b>that</b> object changes.</p>
  <div class="fac">
    <div class="card fac-form">
      <span class="pill">class Student</span>
      <label>Variable name<input id="fVar" value="s1" spellcheck="false"></label>
      <label>Name<input id="fName" value="Maria" spellcheck="false"></label>
      <label>Id<input id="fId" value="1001"></label>
      <label>Age<input id="fAge" value="19"></label>
      <button class="bigbtn" id="fNew" type="button">new Student(…)</button>
      <div class="genline" id="fGen">// the C# for your next object appears here</div>
      <button class="bigbtn ghosty" id="fReset" type="button">↺ Clear memory</button>
    </div>
    <div>
      <div class="heap"><div class="heap-h">HEAP · OBJECTS IN MEMORY (<span id="fCount">0</span>)</div><div class="objs" id="fObjs"><span style="color:var(--muted)">Nothing here yet. The class alone builds nothing. Press <b>new</b>!</span></div></div>
      <div class="term flog"><div class="thead">CONSOLE OUTPUT</div><div id="fLog"><div class="placeholder">Method calls print here.</div></div></div>
    </div>
  </div>
</section>

<section data-tab="Methods">
  <p class="eyebrow">05 · Methods: what objects can do</p>
  <h2>Methods use <span class="grad">the object's own data</span></h2>
  <p class="sub">A method written inside the class can read and change that object's fields. Call it with the dot: <code>s1.Introduce()</code> runs with Maria's data, <code>s2.Introduce()</code> with Ahmed's. Methods can also take <b>parameters</b> and <b>return</b> values, just like the methods you wrote earlier.</p>
  <div class="ex" data-ex="methods"></div>
  <div class="grid3">
    <div class="card"><span class="pill">void method</span><p>Does something, returns nothing: <code>Introduce()</code>, <code>HaveBirthday()</code>.</p></div>
    <div class="card"><span class="pill">returning method</span><p>Answers a question: <code>int YearsUntil(int targetAge)</code> gives back an int.</p></div>
    <div class="card"><span class="pill g">GUI link</span><p>Controls have methods too: <code>txtName.Focus()</code> moves the cursor into that one TextBox object.</p></div>
  </div>
</section>

<section data-tab="Properties">
  <p class="eyebrow">06 · Properties: the professional way to expose data</p>
  <h2>Fields store data. <span class="grad">Properties</span> control access to it.</h2>
  <p class="sub">From the outside, a property looks exactly like a field: <code>s.Name = "Maria"</code>. The difference is inside: a property has a <b>get</b> (runs when read) and a <b>set</b> (runs when assigned), so the class decides what's allowed. Every GUI setting you've used is a property: <code>Title</code>, <code>Width</code>, <code>Text</code>, <code>Content</code>.</p>
  <div class="ex" data-ex="autoprop"></div>
  <h3 class="sec">A property that protects its data</h3>
  <p class="sub">A full property with a <b>private</b> field behind it. The <b>set</b> checks every new value and rejects impossible ages. Nobody can put a student into an impossible state.</p>
  <div class="ex" data-ex="props"></div>
  <table class="bridge">
    <thead><tr><th>You write</th><th>Meaning</th></tr></thead>
    <tbody>
      <tr><td><code>public int Age;</code></td><td><b>Field</b>: raw storage, no checks.</td></tr>
      <tr><td><code>public int Age { get; set; }</code></td><td><b>Auto-property</b>: readable and writable; C# creates the hidden storage.</td></tr>
      <tr><td><code>public string Label { get { return …; } }</code></td><td><b>Read-only, computed</b> property: no set.</td></tr>
      <tr><td><code>private int age;</code> + <code>public int Age { get {…} set {…} }</code></td><td><b>Full property</b> guarding a private field.</td></tr>
    </tbody>
  </table>
</section>

<section data-tab="Constructors">
  <p class="eyebrow">07 · Constructors: setting an object up as it's born</p>
  <h2>A <span class="grad">constructor</span> runs automatically on every <code class="inline" style="font-size:.8em">new</code></h2>
  <p class="sub">Without a constructor you write <code>new Student()</code> and then set each value. With one, you pass the values straight into <code>new</code>, and the class can <b>require</b> them. How to spot a constructor: <b>same name as the class</b>, and <b>no return type</b> (not even void).</p>
  <div class="ex" data-ex="ctor"></div>
  <h3 class="sec">Several constructors (overloading) and <code class="inline">this</code></h3>
  <p class="sub">A class can offer several constructors with different parameter lists. C# picks the one that matches your arguments. <code>this</code> means "the object being built right now".</p>
  <div class="ex" data-ex="ctor2"></div>
  <div class="tip">🪟 <b>GUI link:</b> <code>new Thickness(20)</code> and <code>new Thickness(10, 20)</code> are two overloaded constructors of Avalonia's Thickness class. Your <code>public MainWindow()</code> is the constructor of your window class, which is why it runs once when the window opens.</div>
</section>

<section data-tab="Initializers">
  <p class="eyebrow">08 · Object initializers: the GUI shape</p>
  <h2><code class="inline" style="font-size:.8em">new Student { … }</code>: create <span class="grad">and</span> set in one statement</h2>
  <p class="sub">An <b>object initializer</b> calls the constructor, then sets the properties listed in braces. Commas separate them; no semicolons inside. You've written this shape in every GUI lab: <code>new Button { Content = "Save" }</code>.</p>
  <div class="ex" data-ex="init"></div>
  <table class="bridge">
    <thead><tr><th>Your own class</th><th></th><th>An Avalonia class</th></tr></thead>
    <tbody>
      <tr><td><code>new Student()</code></td><td class="arrow">↔</td><td><code>new Button()</code></td></tr>
      <tr><td><code>s1.Name = "Maria";</code></td><td class="arrow">↔</td><td><code>btnSave.Content = "Save";</code></td></tr>
      <tr><td><code>new Student { Name = "Ahmed", Age = 22 }</code></td><td class="arrow">↔</td><td><code>new TextBlock { Text = "Hi", FontSize = 20 }</code></td></tr>
      <tr><td><code>new Student("Maria", 1001, 19)</code></td><td class="arrow">↔</td><td><code>new Thickness(20)</code></td></tr>
      <tr><td><code>s1.Introduce();</code></td><td class="arrow">↔</td><td><code>txtName.Focus();</code></td></tr>
    </tbody>
  </table>
</section>

<section data-tab="References">
  <p class="eyebrow">09 · References: variables hold arrows, not objects</p>
  <h2><code class="inline" style="font-size:.8em">b = a</code> copies the <span class="grad">arrow</span>, not the student</h2>
  <p class="sub">An object variable holds a <b>reference</b>: an arrow to where the object lives. Copying the variable copies the arrow, so both variables point at the <b>same</b> object. Press <b>Step ▶</b> and watch memory change line by line (the current line glows orange in the code).</p>
  <div class="mem" id="mem">
    <div class="memctl"><button type="button" id="mBack">◀ Back</button><button type="button" class="go" id="mStep">Step ▶</button><button type="button" id="mReset">↺ Reset</button><span class="ms" id="mPos"></span></div>
    <div class="memgrid">
      <div class="mcol"><h4>VARIABLES (STACK)</h4><div id="mVars"></div></div>
      <div class="mcol"><h4>OBJECTS (HEAP)</h4><div class="mobjs" id="mObjs"></div></div>
    </div>
    <div class="memnote" id="mNote"></div>
    <div class="term memout"><div class="thead">OUTPUT SO FAR</div><div id="mOut"></div></div>
  </div>
  <div class="ex" data-ex="refs" id="refsEx"></div>
  <div class="grid2">
    <div class="card"><span class="pill">Value types</span><p><code>int</code>, <code>double</code>, <code>decimal</code>, <code>bool</code>, <code>char</code>: the variable holds the value. Copying makes an independent copy.</p></div>
    <div class="card"><span class="pill w">Reference types</span><p>Classes (Student, Button, List…): the variable holds an arrow. Copying shares the object. A variable that points to nothing holds <b>null</b>; using it crashes with a <i>NullReferenceException</i>.</p></div>
  </div>
  <div class="tip">🪟 <b>GUI link:</b> <code>Children = { lblInfo, btnSave }</code> stores <b>references</b>. When a click handler later changes <code>lblInfo.Text</code>, the screen updates, because the window and your field point to the <b>same</b> TextBlock object.</div>
</section>

<section data-tab="Encapsulation">
  <p class="eyebrow">10 · Encapsulation: objects protect their own data</p>
  <h2><span class="grad">private</span> data, <span class="grad">public</span> methods with rules</h2>
  <p class="sub"><b>Encapsulation</b> means the class keeps its data private and offers public methods that enforce the rules. Outside code can't set a balance to a million dollars; it has to call <code>Deposit</code> and <code>Withdraw</code>, which check every request. (Banking domain.)</p>
  <div class="ex" data-ex="bank"></div>
  <div class="grid3">
    <div class="card"><span class="pill">public</span><p>Anyone can use it: methods and properties that form the class's "front desk".</p></div>
    <div class="card"><span class="pill r">private</span><p>Only code inside the class. <b>The default</b>: if you forget <code>public</code>, it's private.</p></div>
    <div class="card"><span class="pill g">Why bother?</span><p>Bugs can only happen in one place (inside the class), and the object can never end up in an impossible state.</p></div>
  </div>
</section>

<section data-tab="ToString & Lists">
  <p class="eyebrow">11 · Showing objects, and keeping many of them</p>
  <h2><code class="inline" style="font-size:.8em">ToString()</code> decides how an object <span class="grad">looks as text</span></h2>
  <p class="sub">Every class inherits a <code>ToString()</code> method that just returns the class name. <b>Override</b> it and your objects print nicely, and, very important for your GUI, that's the text a <b>ListBox</b> shows for each object.</p>
  <div class="ex" data-ex="tostring"></div>
  <h3 class="sec">A List of objects: your roster</h3>
  <p class="sub"><code>List&lt;Student&gt;</code> holds as many Student objects as you add. Your Milestone app uses <code>ObservableCollection&lt;Student&gt;</code>, which works the same way but also updates the ListBox automatically (see the GUI tab).</p>
  <div class="ex" data-ex="list"></div>
</section>

<section data-tab="static">
  <p class="eyebrow">12 · static vs instance</p>
  <h2>Belongs to <span class="grad">each object</span>, or to <span class="grad">the class</span>?</h2>
  <p class="sub">Normal members (Name, Introduce) belong to <b>each object</b>: you need an object to use them. A <b>static</b> member belongs to the <b>class itself</b>: there's one copy, used through the class name. Now <code>static void Main</code>, <code>Math.Max</code> and <code>Console.WriteLine</code> make sense!</p>
  <div class="ex" data-ex="static"></div>
  <table class="bridge">
    <thead><tr><th></th><th>Instance (no static)</th><th>static</th></tr></thead>
    <tbody>
      <tr><td><b>Belongs to</b></td><td>each object</td><td>the class</td></tr>
      <tr><td><b>How many copies</b></td><td>one per object</td><td>exactly one</td></tr>
      <tr><td><b>Called with</b></td><td><code>s1.Introduce()</code>, <code>txtName.Text</code></td><td><code>Student.Count</code>, <code>Math.Max(3, 9)</code>, <code>int.Parse("5")</code></td></tr>
    </tbody>
  </table>
</section>

ng {age}.\");\n            }\n        }\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Student s = new Student();\n        s.Name = \"Maria\";\n        s.Id = 1001;\n        s.Age = 19;\n        Console.WriteLine($\"{s.Name}, age {s.Age}\");\n\n        s.Age = -5;\n        s.Age = 500;\n        Console.WriteLine($\"{s.Name}, age {s.Age}\");\n\n        s.Age = 20;\n        Console.WriteLine($\"{s.Name}, age {s.Age}\");\n    }\n}", "refs": "using System;\n\nclass Student\n{\n    public string Name { get; set; } = \"\";\n    public int Age { get; set; }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Student a = new Student { Name = \"Maria\", Age = 19 };\n        Student b = a;\n        b.Name = \"Maria Lopez\";\n        Console.WriteLine(a.Name);\n        Console.WriteLine(a == b);\n\n        Student c = new Student { Name = \"Maria Lopez\", Age = 19 };\n        Console.WriteLine(a == c);\n\n        b = c;\n        b.Age = 30;\n        Console.WriteLine($\"a: {a.Name}, {a.Age}\");\n        Console.WriteLine($\"c: {c.Name}, {c.Age}\");\n\n        int x = 5;\n        int y = x;\n        y = 99;\n        Console.WriteLine($\"x is still {x}, y is {y}\");\n    }\n}", "static": "using System;\n\nclass Student\n{\n    public static int Count = 0;\n\n    public string Name { get; set; }\n\n    public Student(string name)\n    {\n        Name = name;\n        Count = Count + 1;\n    }\n\n    public void Introduce()\n    {\n        Console.WriteLine($\"Hi, I am {Name}.\");\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Console.WriteLine($\"Students so far: {Student.Count}\");\n\n        Student a = new Student(\"Maria\");\n        Student b = new Student(\"Ahmed\");\n        a.Introduce();\n        b.Introduce();\n\n        Console.WriteLine($\"Students so far: {Student.Count}\");\n\n        Console.WriteLine(Math.Max(3, 9));\n        Console.WriteLine(a.Name.Length);\n    }\n}", "tostring": "using System;\n\nclass Course\n{\n    public string Code { get; set; } = \"\";\n}\n\nclass Student\n{\n    public string Name { get; set; } = \"\";\n    public int Id { get; set; }\n    public int Age { get; set; }\n\n    public override string ToString()\n    {\n        return $\"{Name} (#{Id}), age {Age}\";\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Course c = new Course { Code = \"MAC109\" };\n        Student s = new Student { Name = \"Maria\", Id = 1001, Age = 19 };\n\n        Console.WriteLine(c);\n        Console.WriteLine(s);\n        Console.WriteLine(\"Selected: \" + s);\n\n        string label = s.ToString();\n        Console.WriteLine(label.ToUpper());\n    }\n}", "p_menu": "using System;\nusing System.Collections.Generic;\n\nclass MenuItem\n{\n    public string Name { get; set; } = \"\";\n    public decimal Price { get; set; }\n\n    public override string ToString()\n    {\n        return $\"{Name,-12} ${Price:F2}\";\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        List<MenuItem> order = new List<MenuItem>();\n        order.Add(new MenuItem { Name = \"Tacos\", Price = 9.50m });\n        order.Add(new MenuItem { Name = \"Lemonade\", Price = 3.25m });\n        order.Add(new MenuItem { Name = \"Flan\", Price = 4.75m });\n\n        decimal total = 0;\n        foreach (MenuItem item in order)\n        {\n            Console.WriteLine(item);\n            total = total + item.Price;\n        }\n\n        Console.WriteLine($\"Items: {order.Count}\");\n        Console.WriteLine($\"Total: ${total:F2}\");\n    }\n}", "p_product": "using System;\n\nclass Product\n{\n    private int quantity;\n\n    public string Name { get; set; }\n    public decimal Price { get; set; }\n\n    public int Quantity\n    {\n        get\n        {\n            return quantity;\n        }\n    }\n\n    public Product(string name, decimal price, int quantity)\n    {\n        Name = name;\n        Price = price;\n        this.quantity = quantity;\n    }\n\n    public void Restock(int amount)\n    {\n        quantity = quantity + amount;\n    }\n\n    public void Sell(int amount)\n    {\n        if (amount > quantity)\n        {\n            Console.WriteLine($\"Only {quantity} {Name} left. Sale refused.\");\n            return;\n        }\n        quantity = quantity - amount;\n        Console.WriteLine($\"Sold {amount} {Name} for ${Price * amount:F2}.\");\n    }\n\n    public override string ToString()\n    {\n        return $\"{Name}: {Quantity} in stock at ${Price:F2}\";\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Product p = new Product(\"Notebook\", 3.50m, 10);\n        Console.WriteLine(p);\n\n        p.Sell(4);\n        p.Sell(20);\n        p.Restock(15);\n\n        Console.WriteLine(p);\n    }\n}", "p_room": "using System;\n\nclass Room\n{\n    public int Number { get; set; }\n    public string Type { get; set; }\n    public decimal PricePerNight { get; set; }\n    public bool IsBooked { get; set; }\n\n    public Room(int number, string type, decimal pricePerNight)\n    {\n        Number = number;\n        Type = type;\n        PricePerNight = pricePerNight;\n        IsBooked = false;\n    }\n\n    public decimal TotalFor(int nights)\n    {\n        return PricePerNight * nights;\n    }\n\n    public void Book()\n    {\n        if (IsBooked)\n        {\n            Console.WriteLine($\"Room {Number} is already booked.\");\n            return;\n        }\n        IsBooked = true;\n        Console.WriteLine($\"Room {Number} is now booked.\");\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Room r1 = new Room(101, \"Single\", 89.50m);\n        Room r2 = new Room(204, \"Suite\", 210m);\n\n        r1.Book();\n        r1.Book();\n        Console.WriteLine($\"3 nights in room {r2.Number} ({r2.Type}): ${r2.TotalFor(3):F2}\");\n        Console.WriteLine($\"Room {r1.Number} booked? {r1.IsBooked}\");\n        Console.WriteLine($\"Room {r2.Number} booked? {r2.IsBooked}\");\n    }\n}", "gui0": "using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    public MainWindow()\n    {\n        Title = \"Same class, different objects\";\n        Width = 420;\n        Height = 260;\n\n        Button btnSave = new Button();\n        btnSave.Content = \"Save\";\n        btnSave.Width = 120;\n\n        Button btnDelete = new Button { Content = \"Delete\", Width = 160 };\n        Button btnHelp = new Button { Content = \"Help\", Background = Brushes.Gold };\n\n        var lblInfo = new TextBlock\n        {\n            Text = \"Three Button objects, one Button class.\",\n            FontSize = 16\n        };\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(20),\n            Spacing = 10,\n            Children = { lblInfo, btnSave, btnDelete, btnHelp }\n        };\n    }\n}", "gui1": "using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Interactivity;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    Student student = new Student(\"Maria\", 1001, 19);\n    TextBlock lblInfo = new TextBlock { FontSize = 20, Foreground = Brushes.DarkSlateBlue };\n\n    public MainWindow()\n    {\n        Title = \"One Student object\";\n        Width = 420;\n        Height = 220;\n\n        lblInfo.Text = student.ToString();\n\n        var btnBirthday = new Button { Content = \"Have a birthday\" };\n        btnBirthday.Click += BtnBirthday_Click;\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(20),\n            Spacing = 12,\n            Children = { lblInfo, btnBirthday }\n        };\n    }\n\n    void BtnBirthday_Click(object? sender, RoutedEventArgs e)\n    {\n        student.HaveBirthday();\n        lblInfo.Text = student.ToString();\n    }\n}", "gui2": "using System.Collections.ObjectModel;\nusing Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Interactivity;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    ObservableCollection<Student> students = new ObservableCollection<Student>();\n\n    TextBox txtName = new TextBox { Watermark = \"Name\" };\n    TextBox txtId = new TextBox { Watermark = \"Student ID\" };\n    TextBox txtAge = new TextBox { Watermark = \"Age\" };\n    ListBox lstStudents = new ListBox { Height = 140 };\n    TextBlock lblStatus = new TextBlock { Foreground = Brushes.SeaGreen };\n\n    public MainWindow()\n    {\n        Title = \"Student Roster\";\n        Width = 440;\n        Height = 420;\n\n        lstStudents.ItemsSource = students;\n\n        var btnAdd = new Button { Content = \"Add student\" };\n        btnAdd.Click += BtnAdd_Click;\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(20),\n            Spacing = 8,\n            Children = { txtName, txtId, txtAge, btnAdd, lstStudents, lblStatus }\n        };\n    }\n\n    void BtnAdd_Click(object? sender, RoutedEventArgs e)\n    {\n        int.TryParse(txtId.Text, out int id);\n        int.TryParse(txtAge.Text, out int age);\n\n        Student s = new Student(txtName.Text ?? \"\", id, age);\n        students.Add(s);\n\n        lblStatus.Text = $\"Added {s.Name}. Roster size: {students.Count}\";\n        txtName.Text = \"\";\n        txtId.Text = \"\";\n        txtAge.Text = \"\";\n    }\n}", "student": "namespace MyStudioApp;\n\npublic class Student\n{\n    public string Name { get; set; }\n    public int Id { get; set; }\n    public int Age { get; set; }\n\n    public Student(string name, int id, int age)\n    {\n        Name = name;\n        Id = id;\n        Age = age;\n    }\n\n    public void HaveBirthday()\n    {\n        Age = Age + 1;\n    }\n\n    public override string ToString()\n    {\n        return $\"{Name} (#{Id}), age {Age}\";\n    }\n}", "engine": "using System;\nusing Avalonia;\nusing Avalonia.Controls.ApplicationLifetimes;\nusing Avalonia.Themes.Fluent;\n\nnamespace MyStudioApp;\n\n// PART 1: The launcher. Starts Avalonia.\nclass Program\n{\n    [STAThread]\n    public static void Main(string[] args)\n    {\n        AppBuilder.Configure<App>()\n                  .UsePlatformDetect()\n                  .StartWithClassicDesktopLifetime(args);\n    }\n}\n\n// PART 2: The app. Loads the modern theme, opens your window.\npublic class App : Application\n{\n    public override void OnFrameworkInitializationCompleted()\n    {\n        Styles.Add(new FluentTheme());\n        if (ApplicationLifetime is IClassicDesktopStyleApplicationLifetime desktop)\n        {\n            desktop.MainWindow = new MainWindow();   // <- opens YOUR file\n        }\n        base.OnFrameworkInitializationCompleted();\n    }\n}"};

function noteFor(key,line){
  var t=line.trim();
  if(t==='')return 'A blank line: breathing room for human eyes.';
  if(EXN[key]&&EXN[key][t])return EXN[key][t];
  if(GEN[t])return GEN[t];
  for(var i=0;i<RULES.length;i++){var m=t.match(RULES[i][0]);if(m)return RULES[i][1](m);}
  return null;
}

(function(){
"use strict";
var KW=/^(using|class|static|void|int|double|decimal|string|bool|var|new|return|public|private|override|base|namespace|if|is|else|out|true|false|object|this|foreach|in|get|set|value)$/;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(line){
  var out='',i=0,n=line.length;
  while(i<n){
    var ch=line[i];
    if(ch==='/'&&line[i+1]==='/'){out+='<span class="c">'+esc(line.slice(i))+'</span>';break;}
    if(ch==='"'||(ch==='$'&&line[i+1]==='"')){var j=i+(ch==='$'?2:1);while(j<n&&line[j]!=='"'){if(line[j]==='\\')j++;j++;}j++;out+='<span class="s">'+esc(line.slice(i,j))+'</span>';i=j;continue;}
    if(/[A-Za-z_]/.test(ch)){
      var j2=i;while(j2<n&&/[A-Za-z0-9_]/.test(line[j2]))j2++;
      var w=line.slice(i,j2),rest=line.slice(j2);
      var cls=KW.test(w)?'k':/new\s+$/.test(line.slice(0,i))?'t':/^\s*[(<]/.test(rest)?'m':/^[A-Z]/.test(w)?'t':'p';
      out+='<span class="'+cls+'">'+esc(w)+'</span>';i=j2;continue;
    }
    if(/[0-9]/.test(ch)){var j3=i;while(j3<n&&/[0-9.m]/.test(line[j3]))j3++;out+='<span class="n">'+line.slice(i,j3)+'</span>';i=j3;continue;}
    out+=esc(ch);i++;
  }
  return out;
}
function copyText(txt,btn){
  function ok(){btn.textContent='Copied ✓';setTimeout(function(){btn.textContent='Copy';},1600);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,ok);}
  else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);ok();}
}

function codeView(host,files,o){
  o=o||{};
  var win=document.createElement('div');win.className='codewin';
  var bar=document.createElement('div');bar.className='bar';
  bar.innerHTML='<span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>';
  var ftabs=document.createElement('span');ftabs.className='ftabs';bar.appendChild(ftabs);
  if(o.tag){var tg=document.createElement('span');tg.className='tag';tg.textContent=o.tag;bar.appendChild(tg);}
  var btns=document.createElement('span');btns.className='btns';bar.appendChild(btns);
  var copy=document.createElement('button');copy.type='button';copy.textContent='Copy';btns.appendChild(copy);
  var run=null;if(o.run){run=document.createElement('button');run.type='button';run.className='run';run.textContent='▶ Run';btns.appendChild(run);}
  win.appendChild(bar);var pre=document.createElement('pre');win.appendChild(pre);
  var panel=document.createElement('div');panel.className='explain-panel';
  var expl=document.createElement('div');expl.className='expl idle';
  expl.innerHTML='<div class="lbl"><span>Explanation</span><span class="pinbadge">📌 pinned · click again to unpin</span></div><div class="codeq"></div><div class="why"></div>';
  panel.appendChild(expl);
  var codeq=expl.querySelector('.codeq'),why=expl.querySelector('.why'),lbl=expl.querySelector('.lbl span');
  var IDLE='Hover any line of the code to read what it does. Click a line to pin it.';
  why.innerHTML=IDLE;
  var term=null;
  if(o.run){term=document.createElement('div');term.className='term';term.innerHTML='<div class="thead">▶ RUN → OUTPUT</div><div class="placeholder">Press ▶ Run. Predict the output first!</div>';panel.appendChild(term);}
  if(o.extra)panel.appendChild(o.extra);
  var cur=null,pinned=null,rows=[],lines=[];
  function show(i){expl.classList.remove('idle');lbl.textContent=cur.name+' · line '+(i+1);codeq.textContent=lines[i].trim()||'(blank line)';why.innerHTML=noteFor(cur.key,lines[i])||'';}
  function idle(){if(pinned!==null){show(pinned);return;}expl.classList.add('idle');lbl.textContent='Explanation';why.innerHTML=IDLE;}
  function load(f){
    cur=f;pinned=null;expl.classList.remove('pinned');idle();
    lines=CODE[f.key].split('\n');pre.innerHTML='';rows=[];
    lines.forEach(function(L,i){
      var row=document.createElement('span');row.className='cl explain';row.tabIndex=0;row.setAttribute('role','button');
      row.setAttribute('aria-label','Line '+(i+1)+': '+(L.trim()||'blank'));
      row.innerHTML='<span class="ln">'+(i+1)+'</span><span class="src">'+(hl(L)||' ')+'</span>';
      row.addEventListener('mouseenter',function(){if(pinned===null){rows.forEach(function(r){r.classList.remove('hot');});row.classList.add('hot');show(i);}});
      row.addEventListener('mouseleave',function(){if(pinned===null){row.classList.remove('hot');idle();}});
      row.addEventListener('focus',function(){if(pinned===null)show(i);});
      row.addEventListener('click',function(){
        if(pinned===i){pinned=null;row.classList.remove('pinned');expl.classList.remove('pinned');show(i);return;}
        rows.forEach(function(r){r.classList.remove('pinned','hot');});pinned=i;row.classList.add('pinned');expl.classList.add('pinned');show(i);
      });
      row.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();}});
      pre.appendChild(row);rows.push(row);
    });
    ftabs.querySelectorAll('.ftab,.fname').forEach(function(b){b.classList.toggle('on',b.dataset.k===f.key);});
  }
  files.forEach(function(f,i){
    var b=document.createElement(files.length>1?'button':'span');
    if(files.length>1){b.type='button';b.className='ftab';b.addEventListener('click',function(){load(f);});}else b.className='fname';
    b.dataset.k=f.key;b.textContent=f.name;ftabs.appendChild(b);
  });
  copy.addEventListener('click',function(){copyText(CODE[cur.key],copy);});
  if(run){run.addEventListener('click',function(){
    var outLines=OUT[o.run];term.innerHTML='<div class="thead">▶ RUN → OUTPUT</div>';run.disabled=true;
    outLines.forEach(function(t,k){setTimeout(function(){var d=document.createElement('div');d.className='tline';d.textContent=t;term.appendChild(d);
      if(k===outLines.length-1){var e=document.createElement('div');e.className='tdone';e.textContent='✔ program finished';term.appendChild(e);run.disabled=false;run.textContent='↻ Run again';}},140*(k+1));});
  });}
  load(files[0]);
  host.innerHTML='';host.appendChild(win);host.appendChild(panel);
  return {rowAt:function(i){return rows[i];},lines:function(){return lines;},clearStep:function(){rows.forEach(function(r){r.classList.remove('step');});}};
}

/* ============ memory stepper ============ */
(function(){
  var C1='#22c58b',C2='#2ac3de';
  var STEPS=[
    {line:'Student a = new Student { Name = "Maria", Age = 19 };',vars:{a:1},objs:{1:{Name:'"Maria"',Age:'19'}},ch:{1:['Name','Age']},note:'<b>new</b> builds object #1 on the heap. The variable <b>a</b> holds an arrow (reference) to it.'},
    {line:'Student b = a;',vars:{b:1},note:'No <b>new</b>, so no new object. <b>b</b> gets a copy of the <b>arrow</b>: a and b now point to the same object #1.'},
    {line:'b.Name = "Maria Lopez";',objs:{1:{Name:'"Maria Lopez"'}},ch:{1:['Name']},note:'Following b’s arrow leads to object #1, so #1 changes.'},
    {line:'Console.WriteLine(a.Name);',out:'Maria Lopez',note:'a follows its arrow to the same object #1: <b>Maria Lopez</b>.'},
    {line:'Console.WriteLine(a == b);',out:'True',note:'For objects, == compares arrows: same object, so <b>True</b>.'},
    {line:'Student c = new Student { Name = "Maria Lopez", Age = 19 };',vars:{c:2},objs:{2:{Name:'"Maria Lopez"',Age:'19'}},ch:{2:['Name','Age']},note:'<b>new</b> again: object #2. Same values as #1, but a separate object.'},
    {line:'Console.WriteLine(a == c);',out:'False',note:'Different arrows, so <b>False</b>, even though the data looks identical.'},
    {line:'b = c;',vars:{b:2},note:'b’s arrow moves to object #2. Object #1 is untouched; only a points to it now.'},
    {line:'b.Age = 30;',objs:{2:{Age:'30'}},ch:{2:['Age']},note:'Changes object #2 (shared by b and c).'},
    {line:'Console.WriteLine($"a: {a.Name}, {a.Age}");',out:'a: Maria Lopez, 19',note:'a still points to #1: age <b>19</b>.'},
    {line:'Console.WriteLine($"c: {c.Name}, {c.Age}");',out:'c: Maria Lopez, 30',note:'c points to #2: age <b>30</b>.'},
    {line:'int x = 5;',ints:{x:'5'},note:'An <b>int</b> is a value type: the variable holds the number itself. No arrow, no heap object.'},
    {line:'int y = x;',ints:{y:'5'},note:'y gets a <b>copy</b> of the value 5.'},
    {line:'y = 99;',ints:{y:'99'},note:'Only y changes.'},
    {line:'Console.WriteLine($"x is still {x}, y is {y}");',out:'x is still 5, y is 99',note:'Values are copied; objects are shared.'}
  ];
  var pos=-1,view=views.refs;
  var lines=CODE.refs.split('\n').map(function(l){return l.trim();});
  STEPS.forEach(function(s){s.idx=lines.indexOf(s.line);});
  function state(upto){
    var st={vars:{},objs:{},ints:{},out:[],order:[]};
    for(var i=0;i<=upto;i++){var s=STEPS[i];
      if(s.vars)for(var v in s.vars){if(!(v in st.vars))st.order.push(v);st.vars[v]=s.vars[v];}
      if(s.ints)for(var v2 in s.ints){if(!(v2 in st.ints))st.order.push(v2);st.ints[v2]=s.ints[v2];}
      if(s.objs)for(var o in s.objs){st.objs[o]=st.objs[o]||{};for(var f in s.objs[o])st.objs[o][f]=s.objs[o][f];}
      if(s.out)st.out.push(s.out);}
    return st;
  }
  function draw(){
    var V=document.getElementById('mVars'),O=document.getElementById('mObjs'),N=document.getElementById('mNote'),T=document.getElementById('mOut');
    view.clearStep();
    document.getElementById('mBack').disabled=pos<0;document.getElementById('mStep').disabled=pos>=STEPS.length-1;
    document.getElementById('mPos').textContent=pos<0?'before line 13':'step '+(pos+1)+' / '+STEPS.length+' · line '+(STEPS[pos].idx+1);
    if(pos<0){V.innerHTML='<span style="color:var(--muted)">(empty)</span>';O.innerHTML='<span style="color:var(--muted)">(empty)</span>';N.innerHTML='Press <b>Step ▶</b> to run line 13.';T.innerHTML='';return;}
    var st=state(pos),s=STEPS[pos];
    var r=view.rowAt(s.idx);if(r){r.classList.add('step');var pre=r.parentNode;pre.scrollTop=Math.max(0,r.offsetTop-120);}
    V.innerHTML='';st.order.forEach(function(v){var d=document.createElement('div');d.className='var';
      if(v in st.vars){var id=st.vars[v];d.innerHTML='<span>Student '+v+'</span><span class="ref" style="background:'+(id===1?C1:C2)+'">→ #'+id+'</span>';}
      else d.innerHTML='<span>int '+v+'</span><span class="val">'+st.ints[v]+'</span>';
      V.appendChild(d);});
    O.innerHTML='';Object.keys(st.objs).forEach(function(id){var ob=st.objs[id],c=id==='1'?C1:C2;
      var who=st.order.filter(function(v){return st.vars[v]===+id;});
      var ch=(s.ch&&s.ch[id])||[];
      var d=document.createElement('div');d.className='mobj';d.style.setProperty('--c',c);
      d.innerHTML='<div class="oh">Student object #'+id+'</div>'+['Name','Age'].map(function(f){return '<div class="fld'+(ch.indexOf(f)>=0?' ch':'')+'"><span>'+f+'</span><b>'+esc(ob[f])+'</b></div>';}).join('')+
        '<div class="who">'+(who.length?'pointed to by: '+who.join(', '):'no variable points here')+'</div>';
      O.appendChild(d);});
    N.innerHTML=s.note;
    T.innerHTML=st.out.map(function(t){return '<div class="tline">'+esc(t)+'</div>';}).join('')||'<div class="placeholder">nothing printed yet</div>';
  }
  document.getElementById('mStep').addEventListener('click',function(){if(pos<STEPS.length-1){pos++;draw();}});
  document.getElementById('mBack').addEventListener('click',function(){if(pos>=0){pos--;draw();}});
  document.getElementById('mReset').addEventListener('click',function(){pos=-1;draw();});
  draw();
  window.__STEPS=STEPS;
})();

/* ============ bug hunt ============ */
(function(){
  var BUG={
    5:[false,'Compiles… but notice: no <b>public</b>. Members are <b>private by default</b>, so this line is the <i>cause</i> of the error on line 21.'],

    20:[true,'<b>Bug:</b> missing <b>new</b>. Without it, C# thinks <code>Student(…)</code> is a method call and complains that Student is a type. Fix: <code>new Student("Ahmed", 22)</code>.'],
    21:[true,'<b>Bug:</b> <i>Student.Name is inaccessible due to its protection level.</i> Name is private (line 5 has no public). Fix: <code>public string Name = "";</code>'],
    22:[true,'<b>Bug:</b> <i>An object reference is required.</i> Age belongs to <b>each object</b>, not to the class: <i>which</i> student’s age? Fix: <code>s2.Age = 23;</code>']
  };

    d.addEventListener('click',function(){if(d.dataset.done)return;d.dataset.done='1';var t=document.createElement('span');
      if(info[0]){d.classList.add('found');found++;document.getElementById('bugScore').textContent='Found: '+found+' / 4'+(found===4?'  🎉 Object detective!':'');t.className='buglabel err';t.textContent='✗ bug';}
      else{d.classList.add('wrongpick');t.className='buglabel ok';t.textContent='✓ compiles';}
      d.querySelector('.src').appendChild(t);w.innerHTML=info[1];});

/* ============ quiz ============ */
(function(){
  var Q=[
    {q:'What is the best description of a <b>class</b>?',o:['One specific student','A blueprint that describes what objects of that kind have and do','A variable that holds text','A method that runs first'],a:1,w:'A class is the blueprint; objects are the real things built from it.'},
    {q:'Which line <b>instantiates</b> an object?',o:['<code>class Student { }</code>','<code>Student s1;</code>','<code>Student s1 = new Student();</code>','<code>s1.Name = "Maria";</code>'],a:2,w:'<code>new</code> builds the object. <code>Student s1;</code> only declares a variable that doesn’t point to any object yet.'},
    {q:'You create <code>s1</code> and <code>s2</code> with two <code>new</code>s, then run <code>s2.Age = 30;</code>. What happens to s1.Age?',o:['It becomes 30 too','Nothing: s1 is a separate object','It becomes 0','Compile error'],a:1,w:'Each new builds an independent object with its own data.'},
    {q:'How do you recognize a <b>constructor</b>?',o:['It starts with void','It has the same name as the class and no return type','It is always static','It must be called Init'],a:1,w:'Same name as the class, no return type (not even void). It runs automatically on <code>new</code>.'},
    {q:'A class has only <code>public Student(string name, int age)</code>. Which line compiles?',o:['<code>new Student()</code>','<code>new Student("Lin")</code>','<code>new Student("Lin", 20)</code>','<code>Student("Lin", 20)</code>'],a:2,w:'You must pass exactly what the constructor asks for, and you need the <code>new</code> keyword.'},
    {q:'What does <code>new Student { Name = "Ahmed", Age = 22 }</code> do?',o:['Defines a new class','Calls the constructor, then sets two properties','Calls a method named Student','Compares two students'],a:1,w:'That’s an object initializer: the same shape as <code>new Button { Content = "Save" }</code>.'},
    {q:'<code>Student b = a; b.Name = "X";</code> What is <code>a.Name</code> now?',o:['Unchanged','"X"','null','Compile error'],a:1,w:'<code>b = a</code> copies the reference. a and b point to the same object.'},
    {q:'<code>a</code> and <code>c</code> were created by two separate <code>new</code>s with identical data. What is <code>a == c</code>?',o:['True','False','It depends on the data','Compile error'],a:1,w:'For class objects, == asks "same object?". Two news = two objects.'},
    {q:'A field written as <code>string Name;</code> (no public) is…',o:['public by default','private by default: only code inside the class can use it','static by default','read-only'],a:1,w:'Members are private unless you say otherwise. That’s a very common cause of "inaccessible due to its protection level".'},
    {q:'Why give <code>BankAccount</code> a <b>private</b> balance with public Deposit/Withdraw methods?',o:['It makes the program faster','So all changes go through methods that enforce the rules (encapsulation)','Because decimals must be private','To save memory'],a:1,w:'Encapsulation: the object protects its own data and can never get into an impossible state.'},
    {q:'Your ListBox shows "MyStudioApp.Student" on every row. What’s missing?',o:['A constructor','A <code>ToString()</code> override in Student','<code>using System;</code>','A static field'],a:1,w:'ListBox (and WriteLine) call ToString(). Without an override you get the class name.'},
    {q:'In MainWindow.cs, which line is an instantiation of <b>your own</b> class?',o:['<code>Title = "Roster";</code>','<code>btnAdd.Click += BtnAdd_Click;</code>','<code>Student s = new Student(name, id, age);</code>','<code>lstStudents.ItemsSource = students;</code>'],a:2,w:'<code>new Student(…)</code> builds an object from your Student class. (Program.cs’s <code>new MainWindow()</code> is another one!)'}
  ];
  var host=document.getElementById('quizHost'),score=0,done=0;
  Q.forEach(function(x,i){
    var box=document.createElement('div');box.className='q';
    var h=document.createElement('h3');h.innerHTML=(i+1)+'. '+x.q;box.appendChild(h);
    var why=document.createElement('p');why.className='why';why.innerHTML=x.w;
    x.o.forEach(function(op,oi){var b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=op;
      b.addEventListener('click',function(){if(box.dataset.done)return;box.dataset.done='1';done++;
        box.querySelectorAll('.opt').forEach(function(y,yi){y.disabled=true;if(yi===x.a)y.classList.add('right');});
        if(oi===x.a)score++;else b.classList.add('wrong');why.classList.add('show');
        document.getElementById('quizScore').textContent='Score: '+score+' / '+Q.length+(done===Q.length?(score===Q.length?'  🏆 Perfect!':'  · review the explanations, then try the practice.'):'');});
      box.appendChild(b);});
    box.appendChild(why);host.appendChild(box);
  });
})();
