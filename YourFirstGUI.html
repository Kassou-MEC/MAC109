function cs_tryInt(t){t=String(t).trim();if(!/^[+-]?\d+$/.test(t))return 0;var v=Number(t);return (v>2147483647||v<-2147483648)?0:v;}
function cs_tryDbl(t){t=String(t).trim();if(!/^[+-]?(\d[\d,]*(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/.test(t))return 0;return Number(t.replace(/,/g,''));}
function fmtD(x){if(x===0)return '0';return String(x);}

(function(){
  "use strict";
  var KW=/^(using|class|static|void|int|double|string|bool|var|new|return|public|private|override|base|namespace|if|is|else|out|true|false|object)$/;
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function hl(line){
    var out='',i=0,n=line.length;
    while(i<n){
      var ch=line[i];
      if(ch==='/'&&line[i+1]==='/'){out+='<span class="c">'+esc(line.slice(i))+'</span>';break;}
      if(ch==='"'||(ch==='$'&&line[i+1]==='"')){var j=i+(ch==='$'?2:1);while(j<n&&line[j]!=='"'){if(line[j]==='\\')j++;j++;}j++;out+='<span class="s">'+esc(line.slice(i,j))+'</span>';i=j;continue;}
      if(/[A-Za-z_]/.test(ch)){
        var j2=i;while(j2<n&&/[A-Za-z0-9_]/.test(line[j2]))j2++;
        var w=line.slice(i,j2),rest=line.slice(j2);
        var cls=KW.test(w)?'k':/new\s+$/.test(line.slice(0,i))?'t':/^\s*[(<]/.test(rest)?'m':/^[A-Z]/.test(w)?'t':'p';
        out+='<span class="'+cls+'">'+esc(w)+'</span>';i=j2;continue;
      }
      if(/[0-9]/.test(ch)){var j3=i;while(j3<n&&/[0-9.]/.test(line[j3]))j3++;out+='<span class="n">'+line.slice(i,j3)+'</span>';i=j3;continue;}
      out+=esc(ch);i++;
    }
    return out;
  }

  /* ================= window preview renderer ================= */
  function renderWin(spec,host){
    var state={boxes:{},labels:{},n:0};
    var wrap=document.createElement('div');wrap.className='wv-wrap';
    var win=document.createElement('div');win.className='wv';win.style.width=spec.w+'px';
    var tb=document.createElement('div');tb.className='wv-title';
    tb.innerHTML='<span class="wv-ico">🪟</span><span class="wv-tt">'+esc(spec.title)+'</span><span class="wv-btns"><i>—</i><i>▢</i><i class="x">✕</i></span>';
    var body=document.createElement('div');body.className='wv-body';body.style.height=spec.h+'px';body.style.background=spec.bg;
    win.appendChild(tb);win.appendChild(body);
    function node(nd){
      var el;
      if(nd.t==='text'){el=document.createElement('div');el.className='wv-text';el.textContent=nd.text;el.style.fontSize=nd.size+'px';el.style.fontWeight=nd.weight;el.style.color=nd.color;el.style.margin=nd.margin+'px';if(nd.id)state.labels[nd.id]=el;}
      else if(nd.t==='button'){el=document.createElement('button');el.type='button';el.className='wv-btn';el.textContent=nd.text;
        el.addEventListener('click',function(){if(spec.on&&spec.on[nd.id]){spec.on[nd.id](api);}else{el.classList.add('deaf');setTimeout(function(){el.classList.remove('deaf');},450);}});}
      else if(nd.t==='textbox'){el=document.createElement('input');el.className='wv-box';el.placeholder=nd.ph;el.spellcheck=false;state.boxes[nd.id]=el;
        el.addEventListener('keydown',function(e){e.stopPropagation();});}
      else if(nd.t==='stack'){el=document.createElement('div');el.className='wv-stack'+(nd.horiz?' h':'');el.style.padding=nd.margin+'px';el.style.gap=nd.spacing+'px';nd.children.forEach(function(c){el.appendChild(node(c));});}
      return el;
    }
    if(spec.content)body.appendChild(node(spec.content));
    var api={get:function(id){return state.boxes[id]?state.boxes[id].value:'';},set:function(id,v){if(state.labels[id])state.labels[id].textContent=v;},
      setBox:function(id,v){if(state.boxes[id])state.boxes[id].value=v;},focus:function(id){if(state.boxes[id])try{state.boxes[id].focus({preventScroll:true});}catch(e){}},n:0};
    wrap.appendChild(win);host.appendChild(wrap);
    function fit(){var avail=host.clientWidth||spec.w;var sc=Math.min(1,(avail-4)/(spec.w+2));win.style.transform='scale('+sc+')';wrap.style.height=((spec.h+34)*sc+4)+'px';}
    fit();if(window.ResizeObserver){new ResizeObserver(fit).observe(host);}
    return {el:wrap,fit:fit};
  }

  /* ================= code viewer with hover notes ================= */
  function codeView(host,o){
    var lines=o.code.split('\n');
    var win=document.createElement('div');win.className='codewin';
    var bar=document.createElement('div');bar.className='bar';
    bar.innerHTML='<span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span><span class="fname">'+esc(o.file||'MainWindow.cs')+'</span>'+(o.tag?'<span class="tag">'+esc(o.tag)+'</span>':'')+'<span class="btns"></span>';
    var copy=document.createElement('button');copy.type='button';copy.textContent='Copy';bar.querySelector('.btns').appendChild(copy);
    win.appendChild(bar);var pre=document.createElement('pre');win.appendChild(pre);
    var panel=document.createElement('div');panel.className='explain-panel';
    var expl=document.createElement('div');expl.className='expl idle';
    expl.innerHTML='<div class="lbl"><span>Explanation</span><span class="pinbadge">📌 pinned: click again to unpin</span></div><div class="codeq"></div><div class="why">'+(o.idle||'Hover any line of the code to read what it does. Click a line to pin it.')+'</div>';
    panel.appendChild(expl);
    var codeq=expl.querySelector('.codeq'),why=expl.querySelector('.why'),lbl=expl.querySelector('.lbl span');
    if(o.extra)panel.appendChild(o.extra);
    var pinned=null,rows=[];
    function show(i){expl.classList.remove('idle');lbl.textContent='Line '+(i+1)+(o.newSet&&o.newSet[i]?' · NEW in this step':'');codeq.textContent=lines[i].trim()||'(blank line)';why.innerHTML=o.note(lines[i])||'';}
    function idle(){if(pinned!==null){show(pinned);return;}expl.classList.add('idle');lbl.textContent='Explanation';why.innerHTML=o.idle||'Hover any line of the code to read what it does. Click a line to pin it.';}
    lines.forEach(function(L,i){
      var row=document.createElement('span');row.className='cl explain'+(o.newSet&&o.newSet[i]?' isnew':'');row.tabIndex=0;row.setAttribute('role','button');
      row.setAttribute('aria-label','Line '+(i+1)+': '+(L.trim()||'blank'));
      row.innerHTML='<span class="ln">'+(i+1)+'</span><span class="src">'+(hl(L)||' ')+'</span>'+(o.newSet&&o.newSet[i]&&L.trim()?'<span class="newtag">NEW</span>':'');
      row.addEventListener('mouseenter',function(){if(pinned===null){rows.forEach(function(r){r.classList.remove('hot');});row.classList.add('hot');show(i);}});
      row.addEventListener('mouseleave',function(){if(pinned===null){row.classList.remove('hot');idle();}});
      row.addEventListener('focus',function(){if(pinned===null)show(i);});
      row.addEventListener('click',function(){
        if(pinned===i){pinned=null;row.classList.remove('pinned');expl.classList.remove('pinned');show(i);return;}
        rows.forEach(function(r){r.classList.remove('pinned','hot');});pinned=i;row.classList.add('pinned');expl.classList.add('pinned');show(i);
      });
      row.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();}});
      pre.appendChild(row);rows.push(row);
    });
    copy.addEventListener('click',function(){
      function ok(){copy.textContent='Copied ✓';setTimeout(function(){copy.textContent='Copy';},1600);}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(o.code).then(ok,ok);}
      else{var ta=document.createElement('textarea');ta.value=o.code;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);ok();}
    });
    host.innerHTML='';host.appendChild(win);host.appendChild(panel);
    if(o.scrollTo!=null&&rows[o.scrollTo]){var r=rows[o.scrollTo];setTimeout(function(){pre.scrollTop=Math.max(0,r.offsetTop-80);},0);}
    return {rows:rows};
  }
  function previewBox(spec){
    var box=document.createElement('div');box.className='prevbox';
    box.innerHTML='<div class="prevcap-top">▶ RUN → YOUR WINDOW</div>';
    var holder=document.createElement('div');holder.className='prevholder';box.appendChild(holder);
    var cap=document.createElement('div');cap.className='prevcap';cap.innerHTML=spec.cap||'';box.appendChild(cap);
    setTimeout(function(){renderWin(spec,holder);},0);
    return box;
  }

  /* ================= slides & nav ================= */
  var tpl=document.getElementById('slides'),stage=document.getElementById('stage'),strip=document.getElementById('tabstrip');
  var secs=tpl.content.querySelectorAll('section'),slides=[],tabs=[],visited={},buildIdx=-1;
  secs.forEach(function(sec,i){
    var s=sec.cloneNode(true);s.classList.add('slide');stage.appendChild(s);slides.push(s);
    if(sec.dataset.build)buildIdx=i;
    var t=document.createElement('button');t.className='tab';t.type='button';t.innerHTML='<span class="dot"></span>'+sec.dataset.tab;
    t.addEventListener('click',function(){go(i);});strip.appendChild(t);tabs.push(t);
  });
  var cur=0,prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
  function go(i,fromEnd){
    if(i<0||i>=slides.length)return;
    slides[cur].classList.remove('active');tabs[cur].classList.remove('active');
    if(visited[cur])tabs[cur].classList.add('done');visited[cur]=true;cur=i;
    slides[cur].classList.add('active');tabs[cur].classList.add('active');
    tabs[cur].scrollIntoView({inline:'nearest',block:'nearest'});slides[cur].scrollTop=0;
    if(cur===buildIdx&&fromEnd)showStep(STEPS.length-1);
    updNav();
    slides[cur].querySelectorAll('.wv-wrap').forEach(function(){});
    window.dispatchEvent(new Event('resize'));
  }
  function updNav(){
    prevBtn.disabled=(cur===0&&true);nextBtn.disabled=(cur===slides.length-1);
    document.getElementById('progressBar').style.width=(cur/(slides.length-1)*100)+'%';
    document.getElementById('where').textContent=(cur+1)+' / '+slides.length+' · '+secs[cur].dataset.tab+(cur===buildIdx?' · step '+(step+1)+' of '+STEPS.length:'');
  }
  function fwd(){if(cur===buildIdx&&step<STEPS.length-1){showStep(step+1);return;}go(cur+1);}
  function back(){if(cur===buildIdx&&step>0){showStep(step-1);return;}go(cur-1,true);}
  prevBtn.addEventListener('click',back);nextBtn.addEventListener('click',fwd);
  document.addEventListener('keydown',function(e){
    var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
    if(e.key==='ArrowRight')fwd();if(e.key==='ArrowLeft')back();
  });

  /* ================= anatomy ================= */
  var ANAT=[
    ['Window + Title','Title = "My First GUI";','The <b>Window</b> is the frame. The text in its title bar is the <b>Title</b> property. Everything inside the frame is the window’s <b>Content</b>.'],
    ['Content: a StackPanel','Content = new StackPanel { … };','The window’s <b>Content</b> holds exactly one thing: here a <b>StackPanel</b>, an invisible shelf that stacks its <b>Children</b> top to bottom, with <b>Spacing</b> between them and a <b>Margin</b> around them. The blue background is the window’s <b>Background</b> property.'],
    ['TextBlock (shows text)','var lblTitle = new TextBlock { Text = "…" };','A <b>TextBlock</b> displays text the user can read but not edit. Its looks are properties: <b>Text</b>, <b>FontSize</b>, <b>FontWeight</b>, <b>Foreground</b> (text color).'],
    ['TextBox (input)','TextBox txtName = new TextBox { Watermark = "…" };','A <b>TextBox</b> is where the user types: the GUI version of <b>Console.ReadLine()</b>. What they typed is in its <b>Text</b> property, and it’s always a <b>string</b>.'],
    ['A horizontal StackPanel','Orientation = Orientation.Horizontal,','Panels can live inside panels. This row is a second StackPanel with <b>Orientation.Horizontal</b>, so its two buttons sit side by side.'],
    ['Button (+ Click event)','var btnGreet = new Button { Content = "Say Hello" };','A <b>Button</b>’s caption is its <b>Content</b>. On its own it does nothing; the line <code>btnGreet.Click += BtnGreet_Click;</code> connects its <b>Click event</b> to your method.'],
    ['TextBlock used for output','lblResult.Text = "Hello, " + txtName.Text + "!";','The result label is a TextBlock whose <b>Text</b> is changed by the click method: the GUI version of <b>Console.WriteLine</b>.']
  ];
  var anatParts=stage.querySelectorAll('.hotpart');
  anatParts.forEach(function(p){
    p.addEventListener('click',function(e){e.stopPropagation();anatParts.forEach(function(x){x.classList.remove('sel');});
      stage.querySelectorAll('.hotpart[data-p="'+p.dataset.p+'"]').forEach(function(x){x.classList.add('sel');});
      var a=ANAT[+p.dataset.p];document.getElementById('anatLbl').textContent=a[0];var c=document.getElementById('anatCode');c.style.display='block';c.textContent=a[1];document.getElementById('anatText').innerHTML=a[2];});
  });

  /* ================= engine & bugfixed ================= */
  function mount(key,host,extra){
    var o={code:CODE[key],note:noteFor};
    if(key==='engine'){o.file='Program.cs';o.tag='the engine · copy once, never touch';}
    if(key==='bugfixed'){o.tag='fixed · compiles';o.extra=previewBox({title:'My Greeter',w:400,h:150,bg:'#ffffff',content:STACK([BTN('Go','go'),TB('Waiting...',{id:'o'})],{}),cap:'<b>Live:</b> click Go.',on:{go:function(s){s.set('o','Clicked!');}}});}
    codeView(host,o);
  }
  stage.querySelectorAll('.ex[data-ex]').forEach(function(h){mount(h.dataset.ex,h);});

  /* ================= build stepper ================= */
  var step=0;
  var chips=document.getElementById('bChips');
  STEPS.forEach(function(S,i){var c=document.createElement('button');c.type='button';c.className='chip';c.innerHTML='<b>'+(i+1)+'</b><span>'+esc(S.title.replace(/ ⚡| \(Week 2 skills!\)/,''))+'</span>';c.addEventListener('click',function(){showStep(i);});chips.appendChild(c);});
  function newLines(i){
    var cur=CODE[STEPS[i].key].split('\n');if(i===0)return null;
    var prev=CODE[STEPS[i-1].key].split('\n').map(function(l){return l.trim();});
    var bag={};prev.forEach(function(l){bag[l]=(bag[l]||0)+1;});
    var set={};cur.forEach(function(l,k){var t=l.trim();if(t==='')return;if(bag[t]>0){bag[t]--;}else set[k]=true;});
    return set;
  }
  function showStep(i){
    step=i;var S=STEPS[i];
    document.getElementById('bTitle').innerHTML='Step '+(i+1)+': '+esc(S.title);
    document.getElementById('bCount').textContent=(i+1)+' / '+STEPS.length;
    document.getElementById('bIdea').textContent='New idea: '+S.idea;
    document.getElementById('bGoal').innerHTML=S.goal;
    document.getElementById('bTodo').innerHTML=S.todo.map(function(t){return '<li>'+t+'</li>';}).join('');
    chips.querySelectorAll('.chip').forEach(function(c,k){c.classList.toggle('active',k===i);c.classList.toggle('past',k<i);});
    chips.children[i].scrollIntoView({inline:'nearest',block:'nearest'});
    var ns=newLines(i);var first=null;if(ns){for(var k in ns){first=+k;break;}}
    codeView(document.getElementById('bEx'),{code:CODE[S.key],note:noteFor,newSet:ns,tag:'complete file · step '+(i+1),extra:previewBox(S.win),scrollTo:first,
      idle:ns?'Lines marked <b>NEW</b> are what this step adds. Hover any line to read what it does.':'This is the whole file for step 1. Hover each line.'});
    document.getElementById('bPrev').disabled=(i===0);document.getElementById('bNext').disabled=(i===STEPS.length-1);
    if(cur===buildIdx)updNav();
  }
  document.getElementById('bPrev').addEventListener('click',function(){if(step>0)showStep(step-1);});
  document.getElementById('bNext').addEventListener('click',function(){if(step<STEPS.length-1)showStep(step+1);});
  showStep(0);

  /* ================= playground ================= */
  var BG=['White','AliceBlue','MintCream','Lavender','LightYellow','Honeydew','Beige','LightBlue'];
  var FG=['DarkSlateBlue','Navy','Black','Crimson','SeaGreen','Teal','DarkOrange','Indigo','Tomato'];
  var pgBg=document.getElementById('pgBg'),pgFg=document.getElementById('pgFg');
  BG.forEach(function(c){pgBg.add(new Option(c,c));});FG.forEach(function(c){pgFg.add(new Option(c,c));});pgBg.value='AliceBlue';
  function csq(s){return String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');}
  function pgCode(v){
    return ['using Avalonia;','using Avalonia.Controls;','using Avalonia.Media;','','namespace MyStudioApp;','','public class MainWindow : Window','{','    public MainWindow()','    {',
      '        Title = "'+csq(v.title)+'";','        Width = 420;','        Height = 300;','        Background = Brushes.'+v.bg+';','',
      '        var lblMessage = new TextBlock','        {','            Text = "'+csq(v.text)+'",','            FontSize = '+v.size+',','            FontWeight = FontWeight.'+v.weight+',','            Foreground = Brushes.'+v.fg,'        };','',
      '        var btnAction = new Button { Content = "'+csq(v.btn)+'" };','','        Content = new StackPanel','        {','            Margin = new Thickness('+v.margin+'),','            Spacing = 10,','            Children = { lblMessage, btnAction }','        };','    }','}'].join('\n');
  }
  var pgPrevCode=null;
  function pg(){
    var v={title:document.getElementById('pgTitle').value,bg:pgBg.value,text:document.getElementById('pgText').value,size:+document.getElementById('pgSize').value,
      weight:document.getElementById('pgWeight').value,fg:pgFg.value,margin:+document.getElementById('pgMargin').value,btn:document.getElementById('pgBtn').value};
    document.getElementById('pgSizeV').textContent=v.size;document.getElementById('pgMarginV').textContent=v.margin;
    var W={Normal:400,Bold:700,Light:300}[v.weight];
    var host=document.getElementById('pgPreview');host.innerHTML='';
    renderWin({title:v.title,w:420,h:300,bg:v.bg,content:STACK([TB(v.text,{size:v.size,weight:W,color:v.fg}),BTN(v.btn,'pgb')],{margin:v.margin,spacing:10})},host);
    var code=pgCode(v);var ns=null;
    if(pgPrevCode){var a=pgPrevCode.split('\n'),b=code.split('\n');ns={};b.forEach(function(l,k){if(a[k]!==l)ns[k]=true;});}
    pgPrevCode=code;CODE.playground=code;
    codeView(document.getElementById('pgEx'),{code:code,note:noteFor,newSet:ns,tag:'complete file · generated live',idle:'Lines marked <b>NEW</b> are the ones your last change rewrote.'});
  }
  ['pgTitle','pgText','pgBtn'].forEach(function(id){document.getElementById(id).addEventListener('input',pg);});
  ['pgBg','pgWeight','pgFg','pgSize','pgMargin'].forEach(function(id){document.getElementById(id).addEventListener('input',pg);document.getElementById(id).addEventListener('change',pg);});
  pg();

  /* ================= event flow ================= */
  var FLOW=['The user moves the mouse over <b>Say Hello</b> and clicks. Until this moment your program was simply <b>waiting</b>. No code of yours was running.',
    'The Button notices the click and raises its <b>Click event</b>: "Hey, I was clicked! Who wants to know?"',
    'In the constructor you wrote <code>btnGreet.Click += BtnGreet_Click;</code>, so your method is on the list. Avalonia calls <b>BtnGreet_Click</b> for you.',
    'Your method runs its lines: <b>read</b> <code>txtName.Text</code>, <b>glue</b> it into "Hello, …!", <b>write</b> it into <code>lblResult.Text</code>.',
    'Changing a property is all it takes: the label redraws itself with the new text. Then the program goes back to <b>waiting</b> for the next click.'];
  var fls=stage.querySelectorAll('#flow .fl'),ftimer=null;
  function flSel(i){fls.forEach(function(x,k){x.classList.toggle('hot',k===i);x.classList.toggle('past',k<i);});document.getElementById('flowText').innerHTML='<b>'+(i+1)+'.</b> '+FLOW[i];}
  fls.forEach(function(f){f.addEventListener('click',function(){clearInterval(ftimer);flSel(+f.dataset.i);});});
  document.getElementById('flowPlay').addEventListener('click',function(){clearInterval(ftimer);var i=0;flSel(0);ftimer=setInterval(function(){i++;if(i>=fls.length){clearInterval(ftimer);return;}flSel(i);},1900);});
  stage.querySelectorAll('.anat-line .al[data-t]').forEach(function(a){a.addEventListener('mouseenter',function(){stage.querySelectorAll('.anat-line .al').forEach(function(x){x.classList.remove('on');});a.classList.add('on');document.getElementById('alWhy').innerHTML=a.dataset.t;});});

  /* ================= bug hunt ================= */
  var BUG={9:[true,'<b>Bug:</b> text without quotes. C# thinks <b>My</b> and <b>Greeter</b> are variable names. Fix: <code>Title = "My Greeter";</code>'],
    10:[true,'<b>Bug:</b> Width is a <b>number</b> (double), but "400" in quotes is <b>text</b>. <i>Cannot implicitly convert type \'string\' to \'double\'</i>. Fix: <code>Width = 400;</code>'],
    13:[false,'Looks innocent, and it compiles. But because lblOut is declared <b>inside</b> the constructor, the click method can’t see it. The error shows up on line 21. Fix: make it a <b>field</b> above the constructor.'],
    19:[true,'<b>Bug:</b> <b>RoutedEventArgs</b> is unknown: the events toolbox isn’t open. Fix: click it ▸ <b>Ctrl+.</b> ▸ <code>using Avalonia.Interactivity;</code>'],
    21:[true,'<b>Bug:</b> <i>The name \'lblOut\' does not exist in the current context.</i> lblOut was a <b>var</b> inside the constructor, and it vanished when the constructor finished. Fix: declare it as a field: <code>TextBlock lblOut = new TextBlock { … };</code> above <code>public MainWindow()</code>.']};
  var bl=CODE.bug.split('\n'),bpre=document.getElementById('bugCode'),bex=document.getElementById('bugExpl'),found=0;
  var bq=bex.querySelector('.codeq'),bw=bex.querySelector('.why');
  bl.forEach(function(L,i){
    var info=BUG[i+1]||[false,'Correct: '+(noteFor(L)||'this line is fine.')];
    var d=document.createElement('span');d.className='cl explain bugline';d.tabIndex=0;
    d.innerHTML='<span class="ln">'+(i+1)+'</span><span class="src">'+(hl(L)||' ')+'</span>';
    d.addEventListener('mouseenter',function(){bex.classList.remove('idle');bq.style.display='block';bq.textContent=L.trim()||'(blank line)';bw.innerHTML=d.dataset.done?info[1]:'Line '+(i+1)+'. Broken or fine? <b>Click to decide.</b>';});
    d.addEventListener('click',function(){if(d.dataset.done)return;d.dataset.done='1';var tag=document.createElement('span');
      if(info[0]){d.classList.add('found');found++;document.getElementById('bugScore').textContent='Found: '+found+' / 4'+(found===4?'  🎉 Bug slayer!':'');tag.className='buglabel err';tag.textContent='✗ bug';}
      else{d.classList.add('wrongpick');tag.className='buglabel ok';tag.textContent='✓ compiles';}
      d.querySelector('.src').appendChild(tag);bw.innerHTML=info[1];});
    d.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();d.click();}});
    bpre.appendChild(d);
  });

  /* ================= practice ================= */
  var ph=document.getElementById('practiceHost');
  PRACTICE.forEach(function(P,i){
    var card=document.createElement('div');card.className='prac';
    card.innerHTML='<div class="prac-head"><span class="prac-n">'+(i+1)+'</span><div><h3>'+esc(P.title)+'</h3><p>'+P.task+'</p></div></div><div class="prac-body"><div class="prac-prev"></div></div>';
    var pv=card.querySelector('.prac-prev');pv.appendChild(previewBox(P.win));
    var det=document.createElement('details');det.className='sol';det.innerHTML='<summary><b>Solution</b>: complete MainWindow.cs with line-by-line explanations</summary><div class="ex"></div>';
    card.querySelector('.prac-body').appendChild(det);
    var built=false;det.addEventListener('toggle',function(){if(det.open&&!built){built=true;codeView(det.querySelector('.ex'),{code:CODE[P.key],note:noteFor,tag:'solution'});}});
    ph.appendChild(card);
  });

  /* ================= quiz ================= */
  var quiz=[
    {q:'In our projects, which file do you edit every week?',opts:['Program.cs','MainWindow.cs','MyStudioApp.csproj','the bin folder'],a:1,why:'MainWindow.cs is yours. Program.cs is the engine you paste once and never touch.'},
    {q:'What does <code>: Window</code> mean in <code>public class MainWindow : Window</code>?',opts:['MainWindow contains a Window','MainWindow <b>is a</b> Window and inherits everything a window can do','MainWindow creates a new window each second','It’s a comment'],a:1,why:'Inheritance: moving, resizing, closing and the title bar all come free from Window.'},
    {q:'When does the constructor <code>public MainWindow()</code> run?',opts:['Every time the user clicks','Once, when the window is created','Never, unless you call it','Every second'],a:1,why:'Program.cs runs <code>new MainWindow()</code> once; that runs your constructor, which sets everything up before the window appears.'},
    {q:'Which line is correct?',opts:['<code>Title = My App;</code>','<code>Width = "400";</code>','<code>Title = "My App";</code>','<code>Height = 300</code>'],a:2,why:'Title is text → quotes. Width/Height are numbers → no quotes. Every statement ends with a semicolon.'},
    {q:'<b>Brushes</b> has a red squiggle. What’s the fastest fix?',opts:['Delete the line','Restart the computer','Click it, press Ctrl+. and add <code>using Avalonia.Media;</code>','Rename it to Colors'],a:2,why:'"Type not found" almost always means a missing using. The Quick Fix menu (Ctrl+.) adds it for you.'},
    {q:'You write <code>Content = lblTitle;</code> and then <code>Content = btnGo;</code>. What does the window show?',opts:['Both, stacked','Only the button','Only the title','A compile error'],a:1,why:'Content holds ONE thing; the second assignment replaces the first. To show both, use a StackPanel with both in Children.'},
    {q:'What does <code>Orientation = Orientation.Horizontal</code> do to a StackPanel?',opts:['Rotates the text','Stacks its children left to right','Centers the window','Makes it scroll'],a:1,why:'StackPanels stack vertically by default; Horizontal puts children side by side, like our two buttons.'},
    {q:'A button appears but clicking it does nothing. The most likely cause?',opts:['The Title is missing','The <code>btn.Click += Handler;</code> line is missing','FontSize is too small','Program.cs is wrong'],a:1,why:'A button with no subscribed method is "deaf". The += line connects the click to your method.'},
    {q:'Why is <code>txtName</code> declared ABOVE the constructor (as a field)?',opts:['Fields load faster','So the click method can use it later, after the constructor has finished','TextBoxes must always be first','It’s required by Avalonia'],a:1,why:'Locals inside the constructor disappear when it ends. The click handler needs txtName on every click, so it must live as long as the window.'},
    {q:'<code>txtAge.Text</code> contains "19". Which line gives you the number 20?',opts:['<code>txtAge.Text + 1</code>','<code>int.TryParse(txtAge.Text, out int age);</code> then <code>age + 1</code>','<code>(int)txtAge.Text + 1</code>','<code>txtAge + 1</code>'],a:1,why:'A TextBox’s Text is always a string (like ReadLine). Convert it first. "19" + 1 would glue to "191", and you can’t cast a string.'}
  ];
  var qh=document.getElementById('quizHost'),score=0,answered=0;
  quiz.forEach(function(Q,qi){
    var box=document.createElement('div');box.className='q';
    var h=document.createElement('h3');h.innerHTML=(qi+1)+'. '+Q.q;box.appendChild(h);
    var why=document.createElement('p');why.className='why';why.innerHTML=Q.why;
    Q.opts.forEach(function(o,oi){var b=document.createElement('button');b.className='opt';b.type='button';b.innerHTML=o;
      b.addEventListener('click',function(){if(box.dataset.done)return;box.dataset.done='1';answered++;
        box.querySelectorAll('.opt').forEach(function(x,xi){x.disabled=true;if(xi===Q.a)x.classList.add('right');});
        if(oi===Q.a)score++;else b.classList.add('wrong');why.classList.add('show');
        document.getElementById('quizScore').textContent='Score: '+score+' / '+quiz.length+(answered===quiz.length?(score===quiz.length?'  🏆 Perfect!':'  · review the explanations, then build the practice windows.'):'');});
      box.appendChild(b);});
    box.appendChild(why);qh.appendChild(box);
  });

  /* ================= setup checkboxes ================= */
  stage.querySelectorAll('.sstep input[type=checkbox]').forEach(function(c){c.addEventListener('change',function(){c.closest('.sstep').classList.toggle('done',c.checked);});});

  slides[0].classList.add('active');tabs[0].classList.add('active');prevBtn.disabled=true;updNav();
})();
</script>
</body>
</html>
