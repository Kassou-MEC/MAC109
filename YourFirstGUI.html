<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAC 109 · Week 3: Your First GUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1220; --surface:#181c2e; --surface2:#222840; --border:#2f3654;
    --ink:#eef0f8; --ink2:#c3c9dd; --muted:#9098b4;
    --brand:#6d63ff; --brand2:#a45cff; --brand-soft:#2a2d55; --brand-ink:#c9c5ff;
    --good:#22c58b; --good-soft:#12352b; --bad:#f06a60; --bad-soft:#3d1f23; --warn:#f5b83d; --warn-soft:#352b12;
    --code-bg:#0a0d18; --code-bar:#151a2c; --code-border:#2a3150; --code-text:#e6e9f2; --code-ln:#5b627a;
    --kw:#7aa2f7; --type:#2ac3de; --str:#e0af68; --com:#7f8aa8; --met:#c0caf5; --num:#ff9e64; --hl:#2c3350; --pin:#3b4a7a;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace;
    --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:var(--sans)}
  b{font-weight:700}

  /* ---------- app frame ---------- */
  #app{display:flex;flex-direction:column;height:100vh}
  #top{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:10px 22px;flex:0 0 auto}
  #top .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  #top .ttl{font-weight:700;font-size:15px}
  #top .ttl small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
  #top .right{margin-left:auto;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:14px}
  #progressWrap{width:140px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
  #progressBar{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}

  #tabstrip{background:var(--surface);display:flex;overflow-x:auto;flex:0 0 auto;border-bottom:1px solid var(--border);padding:0 14px;scrollbar-width:thin;gap:2px}
  .tab{background:transparent;color:var(--ink2);border:none;border-bottom:3px solid transparent;padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
  .tab:hover{color:var(--brand-ink)}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}
  .tab.active .dot{background:var(--brand)}
  .tab.done .dot{background:var(--good)}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:6px}

  #stage{flex:1 1 auto;overflow:hidden;position:relative}
  .slide{position:absolute;inset:0;overflow-y:auto;padding:34px max(40px,calc((100% - 1180px)/2)) 110px;display:none;animation:slidein .3s ease}
  .slide.active{display:block}
  .cl .src{white-space:pre;flex:1 1 auto}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.slide{animation:none}*{transition:none!important}}

  #bottom{background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 22px;flex:0 0 auto}
  #bottom button{background:var(--brand);color:#fff;border:none;padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600}
  #bottom button.ghost{background:var(--surface2);color:var(--ink)}
  #bottom button:hover{filter:brightness(1.07)}
  #bottom button:disabled{opacity:.35;cursor:default;filter:none}
  #bottom .where{color:var(--muted);font-size:13px;margin-left:6px}
  #bottom .grow{flex:1}
  #bottom .hint{color:var(--muted);font-size:12.5px}
  @media(max-width:700px){#bottom .hint,#top .right,#top .ttl small,.codewin .bar .tag,.codewin .bar .dots{display:none}#top .ttl{font-size:13.5px}#top{padding:8px 14px}#bottom{padding:8px 14px}.cl .ln{width:34px;padding-right:10px}.codewin pre{font-size:12.5px}}

  /* ---------- typography & cards ---------- */
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:10px;font-weight:600}
  h1{font-size:clamp(30px,4.2vw,46px);font-weight:800;line-height:1.12;margin-bottom:14px;letter-spacing:-.02em}
  h2{font-size:clamp(24px,3vw,32px);font-weight:800;margin-bottom:6px;letter-spacing:-.015em}
  h3{font-size:17px;font-weight:700}
  .sub{color:var(--ink2);max-width:76ch;font-size:16.5px;margin-bottom:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr}}
  @media(max-width:860px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.slide{padding:22px 16px 110px}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .card p{color:var(--ink2);font-size:15px;margin-top:8px}
  .pill{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--brand-soft);color:var(--brand-ink);border-radius:20px;padding:3px 11px;margin-bottom:10px;font-weight:600}
  .pill.g{background:var(--good-soft);color:#7ff0c3}.pill.w{background:var(--warn-soft);color:#fcd67a}.pill.r{background:var(--bad-soft);color:#ffb3ac}
  code.inline{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:.88em;color:var(--brand-ink)}
  .note{background:var(--warn-soft);border:1px solid #5c4a1a;border-radius:12px;padding:12px 16px;color:#fbe3a6;font-size:14px;margin-top:16px}
  .tip{background:var(--good-soft);border:1px solid #235e4a;border-radius:12px;padding:12px 16px;color:#bff5dd;font-size:14px;margin-top:16px}
  .rule{display:flex;gap:14px;align-items:flex-start}
  .rule .num{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--mono)}
  .objlist li{list-style:none;padding:7px 0 7px 30px;position:relative;font-size:15.5px}
  .objlist li::before{content:"▸";position:absolute;left:8px;color:var(--brand);font-weight:700}
  .checklist li{list-style:none;padding:9px 0 9px 32px;position:relative;font-size:15px;border-bottom:1px dashed var(--border)}
  .checklist li::before{content:"✓";position:absolute;left:4px;color:var(--good);font-weight:800}
  .kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:12.5px}

  /* ---------- hover-explain code examples ---------- */
  .ex{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;align-items:start;margin:16px 0 26px}
  @media(max-width:900px){.ex{grid-template-columns:1fr}}
  .codewin{background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius);overflow:hidden;box-shadow:0 14px 34px rgba(27,31,46,.18)}
  .codewin .bar{background:var(--code-bar);padding:9px 14px;font-family:var(--mono);font-size:12px;color:#aab1c8;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--code-border)}
  .codewin .bar .dots i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}
  .codewin .bar .fname{font-weight:700;color:#e6e9f2}
  .codewin .bar .tag{font-size:10.5px;background:#2f3650;color:#c0caf5;border-radius:20px;padding:2px 9px;font-family:var(--sans);font-weight:600}
  .codewin .bar .btns{margin-left:auto;display:flex;gap:6px}
  .codewin .bar button{background:#2f3650;border:1px solid #3d4661;color:#e6e9f2;border-radius:7px;padding:3px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
  .codewin .bar button:hover{background:#3b4463}
  .codewin .bar button.run{background:var(--good);border-color:var(--good);color:#fff}
  .codewin pre{padding:10px 0 12px;font-family:var(--mono);font-size:14px;line-height:1.7;overflow-x:auto;color:var(--code-text)}
  .cl{display:flex;padding:0 14px 0 0;white-space:pre;border-left:3px solid transparent;cursor:default}
  .cl .ln{width:44px;color:var(--code-ln);text-align:right;padding-right:16px;flex:0 0 auto;user-select:none}
  .cl.explain{cursor:pointer}
  .cl.explain:hover,.cl.explain.hot{background:var(--hl);border-left-color:var(--brand)}
  .cl.explain.pinned{background:var(--pin);border-left-color:#ffd166}
  .cl.explain:focus-visible{outline:none;background:var(--hl);border-left-color:var(--brand)}
  .k{color:var(--kw)}.t{color:var(--type)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.m{color:var(--met)}.n{color:var(--num)}.p{color:var(--code-text)}

  .explain-panel{position:sticky;top:6px}
  .expl{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--brand);border-radius:var(--radius);padding:16px 18px;min-height:150px;box-shadow:var(--shadow);transition:border-color .2s}
  .expl.pinned{border-left-color:#e0a800}
  .expl .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .expl .lbl .pinbadge{display:none;background:var(--warn-soft);color:#fcd67a;border-radius:20px;padding:1px 8px;letter-spacing:0;text-transform:none;font-family:var(--sans);font-weight:600}
  .expl.pinned .lbl .pinbadge{display:inline-block}
  .expl .codeq{font-family:var(--mono);font-size:13px;color:var(--brand-ink);background:var(--brand-soft);border-radius:8px;padding:6px 10px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
  .expl .why{font-size:15.5px;color:var(--ink);line-height:1.65}
  .expl .why b{color:var(--brand-ink)}
  .expl .why code{font-family:var(--mono);font-size:12.8px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--brand-ink)}
  .expl.idle .codeq{display:none}
  .expl.idle .why{color:var(--muted)}
  .term{background:#0e1017;border:1px solid #2a2f44;border-radius:var(--radius);padding:12px 16px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.8;color:#d8dcea;margin-top:12px;min-height:82px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
  .term .thead{font-size:10.5px;letter-spacing:.12em;color:#6b7390;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
  .term .tline{white-space:pre-wrap}
  .term .tline.typing{animation:pop .25s ease}
  .term .placeholder{color:#5f6785;font-style:italic}
  .term .prompt{color:#6b7390}
  @keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .exnote{font-size:14px;color:var(--ink2);margin:-12px 0 20px 4px}

  /* ---------- flip cards ---------- */
  .flip{perspective:900px;cursor:pointer;min-height:170px}
  .flip .inner{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
  .flip.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--border);padding:20px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
  .face.front{background:var(--surface)}
  .face.front .big{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--brand-ink)}
  .face.front small{color:var(--muted);margin-top:8px;font-size:12.5px}
  .face.back{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;transform:rotateY(180deg);border:none}
  .face.back p{font-size:14px;line-height:1.55}

  /* ---------- pipeline ---------- */
  .pipe{display:flex;align-items:stretch;flex-wrap:wrap;margin:18px 0 14px;gap:0}
  .pnode{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:center;flex:1;min-width:120px;cursor:pointer;box-shadow:var(--shadow)}
  .pnode b{display:block;font-size:14px}
  .pnode span{color:var(--muted);font-size:12px}
  .pnode:hover,.pnode.hot{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .parrow{display:flex;align-items:center;color:var(--brand);font-size:22px;padding:0 8px}

  /* ---------- bug hunt ---------- */
  .cl.bugline{cursor:pointer}
  .cl.bugline:hover{background:var(--hl)}
  .cl.bugline.found{background:#3a1f22;border-left-color:var(--bad)}
  .cl.bugline.wrongpick{background:#1e3a2c;border-left-color:var(--good)}
  .buglabel{margin-left:14px;font-family:var(--sans);font-size:12px;border-radius:5px;padding:1px 8px;white-space:normal}
  .buglabel.err{background:var(--bad);color:#fff}
  .buglabel.ok{background:var(--good);color:#fff}

  /* ---------- quiz ---------- */
  .q{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .q h3{margin-bottom:12px;font-size:16px}
  .q .opt{display:block;width:100%;text-align:left;background:var(--surface2);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:14.5px;font-family:var(--sans)}
  .q .opt code{font-family:var(--mono);font-size:13px}
  .q .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .q .opt.right{border-color:var(--good);background:var(--good-soft);color:#bff5dd;font-weight:600}
  .q .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#ffc9c4}
  .q .why{margin-top:10px;font-size:13.5px;color:var(--ink2);display:none}
  .q .why.show{display:block}
  #quizScore{font-family:var(--mono);color:var(--brand-ink);font-size:15px;margin-top:6px;font-weight:600}

  /* ---------- bridge table ---------- */
  .bridge{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:14px}
  .bridge th{background:var(--surface2);text-align:left;padding:11px 14px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .bridge td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top}
  .bridge td code{font-family:var(--mono);font-size:12.8px;background:var(--surface2);border-radius:6px;padding:2px 7px;color:var(--brand-ink);white-space:nowrap}
  .bridge td.arrow{color:var(--brand);font-weight:800;text-align:center;width:40px}
  .cheat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:1000px){.cheat{grid-template-columns:1fr 1fr}}
  @media(max-width:700px){.cheat{grid-template-columns:1fr}}
  .cheat .card{padding:14px 16px}
  .cheat .card h3{font-size:14px;margin-bottom:6px}
  .cheat .card code{display:block;font-family:var(--mono);font-size:12.5px;color:var(--brand-ink);background:var(--brand-soft);border-radius:8px;padding:8px 10px;white-space:pre-wrap;margin-top:6px}
  .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
  @media(max-width:900px){.hero{grid-template-columns:1fr}}

  .grad{background:linear-gradient(90deg,#8b83ff,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent}
  code.inline.big-inline{font-size:.8em;padding:2px 8px}
  .hero{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:start}
  @media(max-width:900px){.hero{grid-template-columns:1fr}}
  .score{font-family:var(--mono);color:var(--brand-ink);font-weight:600}
  /* IPO */
  .ipo{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:8px 0 16px}
  .ipo-box{flex:1;min-width:200px;border-radius:16px;padding:18px;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .ipo-box:hover,.ipo-box.hot{transform:translateY(-3px)}
  .ipo-box .ico{font-size:30px;margin-bottom:4px}
  .ipo-box b{display:block;font-size:18px;letter-spacing:.08em}
  .ipo-box span{display:block;color:var(--ink2);font-size:13.5px;margin:2px 0 8px}
  .ipo-box code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border-radius:8px;padding:4px 8px;color:var(--code-text);display:inline-block}
  .ipo-box.in{border-top:4px solid #2ac3de}.ipo-box.in.hot{box-shadow:0 0 0 3px rgba(42,195,222,.35)}
  .ipo-box.pr{border-top:4px solid #f5b83d}.ipo-box.pr.hot{box-shadow:0 0 0 3px rgba(245,184,61,.35)}
  .ipo-box.out{border-top:4px solid #22c58b}.ipo-box.out.hot{box-shadow:0 0 0 3px rgba(34,197,139,.35)}
  .ipo-arrow{display:flex;align-items:center;font-size:28px;color:var(--brand);padding:0 12px}
  @media(max-width:860px){.ipo-arrow{width:100%;justify-content:center;transform:rotate(90deg);padding:4px 0}}
  /* ladder */
  .ladder{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:4px 0 18px}
  .rung{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-family:var(--mono);font-weight:700;color:var(--brand-ink);text-align:center;box-shadow:var(--shadow)}
  .rung:nth-child(1){font-size:13px}.rung:nth-child(3){font-size:15px}.rung:nth-child(5){font-size:17px}.rung:nth-child(7){font-size:19px}
  .ladnote{flex-basis:100%;color:var(--muted);font-size:13px;margin-top:4px}.rung:nth-child(9){font-size:19px}
  .rung small{display:block;font-family:var(--sans);font-weight:500;color:var(--muted);font-size:11px}
  .rarrow{color:var(--good);font-weight:800;font-size:20px}
  /* mini tables & code blocks */
  table.mini{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  table.mini td{padding:6px 8px;border-top:1px solid var(--border);color:var(--ink2)}
  table.mini td:first-child{white-space:nowrap}
  table.mini code,code.block,.bridge td code{font-family:var(--mono);font-size:12.8px;background:var(--surface2);border-radius:6px;padding:2px 7px;color:var(--brand-ink)}
  code.block{display:block;white-space:pre;padding:8px 10px;margin-top:8px;overflow-x:auto}
  .q h3 code,.q .opt code,.expl .why code,.fwhy code{font-family:var(--mono);font-size:.88em;background:var(--surface2);border-radius:5px;padding:0 5px;color:var(--brand-ink)}
  /* terminal (live) */
  .term .tbody{min-height:40px}
  .term .tsample{margin-top:10px;padding-top:8px;border-top:1px dashed #2a2f44;font-family:var(--sans);font-size:12px;color:#8a92ad}
  .term .tsample code{font-family:var(--mono);color:#e0af68;background:#1a1e2e;border-radius:5px;padding:1px 6px}
  .term .tsample span{color:#6b7390}
  .tin{background:transparent;border:none;border-bottom:1px dashed #6d63ff;color:#7ee7ff;font-family:var(--mono);font-size:13.5px;outline:none;min-width:120px;width:45%;padding:0 2px;caret-color:#7ee7ff}
  .tin::placeholder{color:#4d5575;font-style:italic}
  .techo{color:#7ee7ff;font-weight:600}
  .terr{color:#ff8a80;font-weight:600;white-space:pre-wrap}
  .tdone{color:#5f6785;font-style:italic;font-family:var(--sans);font-size:12px;margin-top:4px}
  .tdone.bad{color:#ff8a80;font-style:normal}
  .term .tline{white-space:pre-wrap;tab-size:8;min-height:1.8em}
  /* window mockup */
  .wm-cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:6px}
  .wm{background:#f3f4f8;border:1px solid #b8bdcf;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.35);overflow:hidden;max-width:300px}

<!-- Start -->
<section data-tab="Start">
  <p class="eyebrow">Week 3 · Lecture</p>
  <h1>Your first GUI:<br>from an <span class="grad">empty window</span> to a working app</h1>
  <div class="hero">
    <div>
      <p class="sub">For two weeks your programs lived in a black terminal. Today they get a <b>window</b>: a title bar, colors, text, buttons, and a box to type in. We'll build it <b>one small piece at a time</b>. Every step adds a single idea, and you press ▶ after each one, so you always see exactly what your code just did.</p>
      <p class="pill">By the end of today you can</p>
      <ul class="objlist">
        <li>Create a C# GUI project in VS Code <b>from nothing</b>, using clicks only</li>
        <li>Explain the two files of every app: <b>Program.cs</b> (engine) and <b>MainWindow.cs</b> (yours)</li>
        <li>Set window <b>properties</b>: Title, Width, Height, Background</li>
        <li>Create <b>controls</b> with <code class="inline">new</code>: TextBlock, Button, TextBox</li>
        <li>Arrange them with a <b>StackPanel</b> (vertical and horizontal)</li>
        <li>Make a button work with an <b>event</b>: <code class="inline">Click += …</code></li>
        <li>Read numbers from a TextBox with Week 2's <b>TryParse</b></li>
      </ul>
    </div>
    <div>
      <div class="card">
        <span class="pill g">The 12-step build (Build It tab)</span>
        <ol class="steplist">
          <li><b>Empty window</b></li><li><b>+ Title</b></li><li>+ Size &amp; position</li><li>+ Background color</li>
          <li>+ Text inside</li><li>+ Styled text</li><li>+ StackPanel (2 texts)</li><li>+ Button</li>
          <li>+ TextBox &amp; result label</li><li>+ First event ⚡</li><li>+ Clear button, side by side</li><li>+ Numbers (TryParse)</li>
        </ol>
      </div>
      <div class="tip">🧭 <b>Golden rule for today:</b> change a little → <b>Ctrl+S</b> → <b>F5</b> → look. If something breaks, you know it was the line you just added.</div>
    </div>
  </div>
</section>

<!-- Vocabulary -->
<section data-tab="GUI Words">
  <p class="eyebrow">01 · The vocabulary of every GUI</p>
  <h2>Six words, and you can talk about <span class="grad">any window on Earth</span></h2>
  <p class="sub">A <b>G</b>raphical <b>U</b>ser <b>I</b>nterface is a program you use with windows, buttons and boxes instead of typed commands. Click any part of the window below to learn its name and the line of C# that creates it.</p>
  <div class="anat">
    <div class="anat-win">
      <div class="aw-title hotpart" data-p="0"><span>My First GUI</span><span class="aw-btns">— ▢ ✕</span></div>
      <div class="aw-body hotpart" data-p="1">
        <div class="aw-h1 hotpart" data-p="2">Hello, GUI world!</div>
        <div class="aw-sub hotpart" data-p="2">My first window, built one line at a time.</div>
        <div class="aw-box hotpart" data-p="3">Maria</div>
        <div class="aw-row hotpart" data-p="4"><span class="aw-btn hotpart" data-p="5">Say Hello</span><span class="aw-btn">Clear</span></div>
        <div class="aw-res hotpart" data-p="6">Hello, Maria!</div>
      </div>
    </div>
    <div class="expl" id="anatInfo"><div class="lbl" id="anatLbl">Click a part of the window ←</div><div class="codeq" id="anatCode" style="display:none"></div><div class="why" id="anatText">Every visible thing in a window is an <b>object</b> made from a class, and everything about how it looks is a <b>property</b>.</div></div>
  </div>
  <div class="grid3" style="margin-top:20px">
    <div class="card"><span class="pill">Window</span><p>The frame: title bar, size, background. Ours is <b>MainWindow</b>, a class that <b>is a</b> Window.</p></div>
    <div class="card"><span class="pill">Control</span><p>A visible building block you create with <code class="inline">new</code>: <b>TextBlock</b> (shows text), <b>Button</b> (clickable), <b>TextBox</b> (typing).</p></div>
    <div class="card"><span class="pill">Property</span><p>A setting of an object: <code class="inline">Title</code>, <code class="inline">Width</code>, <code class="inline">Text</code>, <code class="inline">FontSize</code>. Set it with <code class="inline">Name = value;</code></p></div>
    <div class="card"><span class="pill">Content</span><p>What the window shows inside. It holds exactly <b>one</b> thing, usually a panel.</p></div>
    <div class="card"><span class="pill">Layout panel</span><p>A container that arranges many controls. <b>StackPanel</b> stacks its <b>Children</b> top-to-bottom (or left-to-right).</p></div>
    <div class="card"><span class="pill">Event</span><p>Something that <i>happens</i>, like a <b>Click</b>. You connect a method to it with <code class="inline">+=</code>; that method is the <b>event handler</b>.</p></div>
  </div>
  <table class="bridge" style="margin-top:18px">
    <thead><tr><th>Console (Weeks 1–2)</th><th></th><th>GUI (today)</th></tr></thead>

<!-- Events -->
<section data-tab="Events">
  <p class="eyebrow">06 · How a click becomes a change on screen</p>
  <h2>Events: your code <span class="grad">waits</span>, then reacts</h2>
  <p class="sub">A console program runs top to bottom and ends. A GUI program sets everything up in the constructor and then <b>waits</b>. When the user clicks, the button raises its <b>Click event</b>, and every method subscribed with <code class="inline">+=</code> runs. Press ▶ Play to watch it happen.</p>
  <div class="flow" id="flow">
    <div class="fl" data-i="0"><div class="fl-ico">🖱️</div><b>User clicks</b><span>"Say Hello"</span></div><div class="fa">→</div>
    <div class="fl" data-i="1"><div class="fl-ico">🔔</div><b>Click event fires</b><span>btnGreet.Click</span></div><div class="fa">→</div>
    <div class="fl" data-i="2"><div class="fl-ico">🔌</div><b>+= calls your method</b><span>BtnGreet_Click</span></div><div class="fa">→</div>
    <div class="fl" data-i="3"><div class="fl-ico">📖</div><b>Read → glue → write</b><span>lblResult.Text = …</span></div><div class="fa">→</div>
    <div class="fl" data-i="4"><div class="fl-ico">✨</div><b>Screen updates</b><span>"Hello, Maria!"</span></div>
  </div>
  <div class="flowctl"><button type="button" class="run" id="flowPlay">▶ Play</button></div>
  <div class="expl" id="flowInfo"><div class="lbl">Step by step</div><div class="why" id="flowText">Press ▶ Play, or click any box.</div></div>
  <h3 style="margin:24px 0 10px">Anatomy of the wiring line</h3>
  <div class="anat-line"><span class="al a1" data-t="The object: the button you created with new Button.">btnGreet</span><span class="al">.</span><span class="al a2" data-t="The event: Click. Buttons also have other events, but Click is the one you'll use 95% of the time.">Click</span> <span class="al a3" data-t="+= means subscribe: add this method to the list that runs on every click. (= alone is not allowed for events.)">+=</span> <span class="al a4" data-t="The method to call later. No parentheses! BtnGreet_Click() would call it right now, once, which is not what we want.">BtnGreet_Click</span><span class="al">;</span></div>
  <p class="anat-why" id="alWhy">Hover each part of the line above.</p>
  <div class="grid2" style="margin-top:18px">
    <div class="card"><span class="pill w">Why are txtName and lblResult ABOVE the constructor?</span><p>Two different moments need them: the <b>constructor</b> (to put them on the shelf at startup) and the <b>click method</b> (to read and write them later, on every click). A variable declared <i>inside</i> the constructor disappears when the constructor finishes. Declared at class level, as a <b>field</b>, it lives as long as the window does.</p></div>
    <div class="card"><span class="pill g">Rule of thumb</span><p><b>If a click method needs it, make it a field.</b> Controls that nobody talks to after setup (lblTitle, the buttons) can stay as <code class="inline">var</code> inside the constructor. The Fix-It tab shows the exact error you get when you forget this.</p></div>
  </div>
</section>

Margin = new Thickness(20),\n            Spacing = 8,\n            Children = { lblTitle, lblSubtitle, btnGreet }\n        };\n    }\n}", "s09": "using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    TextBox txtName = new TextBox { Watermark = \"Type your name...\" };\n    TextBlock lblResult = new TextBlock { Text = \"Your greeting will appear here.\", FontSize = 18, Foreground = Brushes.SeaGreen };\n\n    public MainWindow()\n    {\n        Title = \"My First GUI\";\n        Width = 420;\n        Height = 300;\n        WindowStartupLocation = WindowStartupLocation.CenterScreen;\n        Background = Brushes.AliceBlue;\n\n        var lblTitle = new TextBlock\n        {\n            Text = \"Hello, GUI world!\",\n            FontSize = 26,\n            FontWeight = FontWeight.Bold,\n            Foreground = Brushes.DarkSlateBlue\n        };\n\n        var lblSubtitle = new TextBlock\n        {\n            Text = \"My first window, built one line at a time.\",\n            FontSize = 14,\n            Foreground = Brushes.SlateGray\n        };\n\n        var btnGreet = new Button { Content = \"Say Hello\" };\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(20),\n            Spacing = 8,\n            Children = { lblTitle, lblSubtitle, txtName, btnGreet, lblResult }\n        };\n    }\n}", "s10": "using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Interactivity;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    TextBox txtName = new TextBox { Watermark = \"Type your name...\" };\n    TextBlock lblResult = new TextBlock { Text = \"Your greeting will appear here.\", FontSize = 18, Foreground = Brushes.SeaGreen };\n\n    public MainWindow()\n    {\n        Title = \"My First GUI\";\n        Width = 420;\n        Height = 300;\n        WindowStartupLocation = WindowStartupLocation.CenterScreen;\n        Background = Brushes.AliceBlue;\n\n        var lblTitle = new TextBlock\n        {\n            Text = \"Hello, GUI world!\",\n            FontSize = 26,\n            FontWeight = FontWeight.Bold,\n            Foreground = Brushes.DarkSlateBlue\n        };\n\n        var lblSubtitle = new TextBlock\n        {\n            Text = \"My first window, built one line at a time.\",\n            FontSize = 14,\n            Foreground = Brushes.SlateGray\n        };\n\n        var btnGreet = new Button { Content = \"Say Hello\" };\n        btnGreet.Click += BtnGreet_Click;\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(20),\n            Spacing = 8,\n            Children = { lblTitle, lblSubtitle, txtName, btnGreet, lblResult }\n        };\n    }\n\n    void BtnGreet_Click(object? sender, RoutedEventArgs e)\n    {\n        lblResult.Text = \"Hello, \" + txtName.Text + \"!\";\n    }\n}", "s11": "using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Interactivity;\nusing Avalonia.Layout;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    TextBox txtName = new TextBox { Watermark = \"Type your name...\" };\n    TextBlock lblResult = new TextBlock { Text = \"Your greeting will appear here.\", FontSize = 18, Foreground = Brushes.SeaGreen };\n\n    public MainWindow()\n    {\n        Title = \"My First GUI\";\n        Width = 420;\n        Height = 300;\n        WindowStartupLocation = WindowStartupLocation.CenterScreen;\n        Background = Brushes.AliceBlue;\n\n        var lblTitle = new TextBlock\n        {\n            Text = \"Hello, GUI world!\",\n            FontSize = 26,\n            FontWeight = FontWeight.Bold,\n            Foreground = Brushes.DarkSlateBlue\n        };\n\n        var lblSubtitle = new TextBlock\n        {\n            Text = \"My first window, built one line at a time.\",\n            FontSize = 14,\n            Foreground = Brushes.SlateGray\n        };\n\n        var btnGreet = new Button { Content = \"Say Hello\" };\n        btnGreet.Click += BtnGreet_Click;\n\n        var btnClear = new Button { Content = \"Clear\" };\n        btnClear.Click += BtnClear_Click;\n\n        var buttonRow = new StackPanel\n        {\n            Orientation = Orientation.Horizontal,\n            Spacing = 10,\n            Children = { btnGreet, btnClear }\n        };\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(20),\n            Spacing = 8,\n            Children = { lblTitle, lblSubtitle, txtName, buttonRow, lblResult }\n        };\n    }\n\n    void BtnGreet_Click(object? sender, RoutedEventArgs e)\n    {\n        lblResult.Text = \"Hello, \" + txtName.Text + \"!\";\n    }\n\n    void BtnClear_Click(object? sender, RoutedEventArgs e)\n    {\n        txtName.Text = \"\";\n        lblResult.Text = \"Your greeting will appear here.\";\n        txtName.Focus();\n    }\n}", "s12": "using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Interactivity;\nusing Avalonia.Layout;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    TextBox txtName = new TextBox { Watermark = \"Type your name...\" };\n    TextBox txtAge = new TextBox { Watermark = \"Type your age...\" };\n    TextBlock lblResult = new TextBlock { Text = \"Your greeting will appear here.\", FontSize = 18, Foreground = Brushes.SeaGreen };\n\n    public MainWindow()\n    {\n        Title = \"My First GUI\";\n        Width = 420;\n        Height = 340;\n        WindowStartupLocation = WindowStartupLocation.CenterScreen;\n        Background = Brushes.AliceBlue;\n\n        var lblTitle = new TextBlock\n        {\n            Text = \"Hello, GUI world!\",\n            FontSize = 26,\n            FontWeight = FontWeight.Bold,\n            Foreground = Brushes.DarkSlateBlue\n        };\n\n        var lblSubtitle = new TextBlock\n        {\n            Text = \"My first window, built one line at a time.\",\n            FontSize = 14,\n            Foreground = Brushes.SlateGray\n        };\n\n        var btnGreet = new Button { Content = \"Say Hello\" };\n        btnGreet.Click += BtnGreet_Click;\n\n        var btnClear = new Button { Content = \"Clear\" };\n        btnClear.Click += BtnClear_Click;\n\n        var buttonRow = new StackPanel\n        {\n            Orientation = Orientation.Horizontal,\n            Spacing = 10,\n            Children = { btnGreet, btnClear }\n        };\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(20),\n            Spacing = 8,\n            Children = { lblTitle, lblSubtitle, txtName, txtAge, buttonRow, lblResult }\n        };\n    }\n\n    void BtnGreet_Click(object? sender, RoutedEventArgs e)\n    {\n        int.TryParse(txtAge.Text, out int age);\n        lblResult.Text = $\"Hello, {txtName.Text}! Next year you will be {age + 1}.\";\n    }\n\n    void BtnClear_Click(object? sender, RoutedEventArgs e)\n    {\n        txtName.Text = \"\";\n        txtAge.Text = \"\";\n        lblResult.Text = \"Your greeting will appear here.\";\n        txtName.Focus();\n    }\n}", "p_card": "using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    public MainWindow()\n    {\n        Title = \"My Business Card\";\n        Width = 380;\n        Height = 220;\n        WindowStartupLocation = WindowStartupLocation.CenterScreen;\n        Background = Brushes.Beige;\n\n        var lblName = new TextBlock\n        {\n            Text = \"Maria Lopez\",\n            FontSize = 28,\n            FontWeight = FontWeight.Bold,\n            Foreground = Brushes.Navy\n        };\n\n        var lblJob = new TextBlock\n        {\n            Text = \"Software Developer in training\",\n            FontSize = 16,\n            Foreground = Brushes.DimGray\n        };\n\n        var lblEmail = new TextBlock\n        {\n            Text = \"maria.lopez@example.com\",\n            FontSize = 14,\n            Foreground = Brushes.SteelBlue\n        };\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(24),\n            Spacing = 6,\n            Children = { lblName, lblJob, lblEmail }\n        };\n    }\n}", "p_counter": "using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Interactivity;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    int count = 0;\n    TextBlock lblCount = new TextBlock { Text = \"Clicks: 0\", FontSize = 32, FontWeight = FontWeight.Bold };\n\n    public MainWindow()\n    {\n        Title = \"Click Counter\";\n        Width = 300;\n        Height = 200;\n        WindowStartupLocation = WindowStartupLocation.CenterScreen;\n\n        var btnClick = new Button { Content = \"Click me!\" };\n        btnClick.Click += BtnClick_Click;\n\n        var btnReset = new Button { Content = \"Reset\" };\n        btnReset.Click += BtnReset_Click;\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(24),\n            Spacing = 12,\n            Children = { lblCount, btnClick, btnReset }\n        };\n    }\n\n    void BtnClick_Click(object? sender, RoutedEventArgs e)\n    {\n        count = count + 1;\n        lblCount.Text = $\"Clicks: {count}\";\n    }\n\n    void BtnReset_Click(object? sender, RoutedEventArgs e)\n    {\n        count = 0;\n        lblCount.Text = \"Clicks: 0\";\n    }\n}", "p_temp": "using Avalonia;\nusing Avalonia.Controls;\nusing Avalonia.Interactivity;\nusing Avalonia.Media;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    TextBox txtFahrenheit = new TextBox { Watermark = \"Temperature in F\" };\n    TextBlock lblCelsius = new TextBlock { Text = \"\", FontSize = 20, Foreground = Brushes.Teal };\n\n    public MainWindow()\n    {\n        Title = \"Temperature Converter\";\n        Width = 340;\n        Height = 230;\n        WindowStartupLocation = WindowStartupLocation.CenterScreen;\n\n        var lblTitle = new TextBlock { Text = \"Fahrenheit to Celsius\", FontSize = 20, FontWeight = FontWeight.Bold };\n\n        var btnConvert = new Button { Content = \"Convert\" };\n        btnConvert.Click += BtnConvert_Click;\n\n        Content = new StackPanel\n        {\n            Margin = new Thickness(20),\n            Spacing = 10,\n            Children = { lblTitle, txtFahrenheit, btnConvert, lblCelsius }\n        };\n    }\n\n    void BtnConvert_Click(object? sender, RoutedEventArgs e)\n    {\n        double.TryParse(txtFahrenheit.Text, out double fahrenheit);\n        double celsius = (fahrenheit - 32) * 5 / 9;\n        lblCelsius.Text = $\"{fahrenheit} F = {celsius:F1} C\";\n    }\n}", "bug": "using Avalonia.Controls;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    public MainWindow()\n    {\n        Title = My Greeter;\n        Width = \"400\";\n\n        var btnGo = new Button { Content = \"Go\" };\n        var lblOut = new TextBlock { Text = \"Waiting...\" };\n        btnGo.Click += BtnGo_Click;\n\n        Content = new StackPanel { Children = { btnGo, lblOut } };\n    }\n\n    void BtnGo_Click(object? sender, RoutedEventArgs e)\n    {\n        lblOut.Text = \"Clicked!\";\n    }\n}", "bugfixed": "using Avalonia.Controls;\nusing Avalonia.Interactivity;\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n    TextBlock lblOut = new TextBlock { Text = \"Waiting...\" };\n\n    public MainWindow()\n    {\n        Title = \"My Greeter\";\n        Width = 400;\n\n        var btnGo = new Button { Content = \"Go\" };\n        btnGo.Click += BtnGo_Click;\n\n        Content = new StackPanel { Children = { btnGo, lblOut } };\n    }\n\n    void BtnGo_Click(object? sender, RoutedEventArgs e)\n    {\n        lblOut.Text = \"Clicked!\";\n    }\n}", "engine": "using System;\nusing Avalonia;\nusing Avalonia.Controls.ApplicationLifetimes;\nusing Avalonia.Themes.Fluent;\n\nnamespace MyStudioApp;\n\n// PART 1: The launcher. Starts Avalonia.\nclass Program\n{\n    [STAThread]\n    public static void Main(string[] args)\n    {\n        AppBuilder.Configure<App>()\n                  .UsePlatformDetect()\n                  .StartWithClassicDesktopLifetime(args);\n    }\n}\n\n// PART 2: The app. Loads the modern theme, opens your window.\npublic class App : Application\n{\n    public override void OnFrameworkInitializationCompleted()\n    {\n        Styles.Add(new FluentTheme());\n        if (ApplicationLifetime is IClassicDesktopStyleApplicationLifetime desktop)\n        {\n            desktop.MainWindow = new MainWindow();   // <- opens YOUR file\n        }\n        base.OnFrameworkInitializationCompleted();\n    }\n}"};
/* ================= line explanations (shared by every step) ================= */
var EXACT={
  'using Avalonia.Controls;':'<b>Toolbox #1: the controls.</b> Gives this file access to <b>Window</b>, <b>TextBlock</b>, <b>Button</b>, <b>TextBox</b>, <b>StackPanel</b>. Same idea as <code>using System;</code> for Console.',
  'using Avalonia.Media;':'<b>Toolbox for looks:</b> colors (<b>Brushes</b>) and font styles (<b>FontWeight</b>). If you forget it, <code>Brushes</code> gets a red squiggle. Click it and press <b>Ctrl+.</b> to add this line automatically.',
  'using Avalonia;':'<b>Toolbox for the basics</b>, including <b>Thickness</b> (used for Margin). Missing? Red squiggle on Thickness, then <b>Ctrl+.</b>',
  'using Avalonia.Interactivity;':'<b>Toolbox for events:</b> it holds <b>RoutedEventArgs</b>, the second parameter of every click handler.',
  'using Avalonia.Layout;':'<b>Toolbox for layout:</b> <b>Orientation</b> (Horizontal/Vertical) and alignment settings live here.',
  'using System;':'The standard toolbox (needed for <b>[STAThread]</b>).',
  'using Avalonia.Controls.ApplicationLifetimes;':'Engine part: describes how a desktop app starts and stops.',
  'using Avalonia.Themes.Fluent;':'Engine part: the modern <b>Fluent</b> look (Windows 11 style) for every control.',
  'namespace MyStudioApp;':'<b>Your project’s name tag.</b> Every file in the project starts with the same namespace, so MainWindow.cs and Program.cs can find each other.',
  'public class MainWindow : Window':'<b>Your window class.</b> Read <b>: Window</b> as "<b>is a</b> Window": MainWindow <b>inherits</b> everything a window already knows how to do (title bar, move, resize, close) without you writing any of it.',
  'public MainWindow()':'<b>The constructor.</b> Same name as the class, no return type. It runs <b>once</b>, at the moment the window is created. Think of it as the window’s <b>Main</b>: every setting you write inside its braces is applied before the window appears.',
  '// Empty on purpose: the window uses all its default settings.':'A comment. The constructor is empty, so the window keeps every default: default title, default size, white and empty inside.',
  'WindowStartupLocation = WindowStartupLocation.CenterScreen;':'Opens the window in the <b>middle of the screen</b> instead of wherever the OS likes. The value is an <b>enum</b>, a fixed list of choices (Manual, CenterScreen, CenterOwner). Type <code>WindowStartupLocation.</code> and IntelliSense shows them all.',
  'Content = new TextBlock { Text = "Hello, GUI world!" };':'<b>Two ideas in one line.</b> (1) <b>new TextBlock { … }</b> creates a text object and sets its Text property. (2) <b>Content =</b> puts that object <b>inside</b> the window. A window’s Content holds exactly <b>one</b> thing. That’s important in step 7.',
  'Content = new TextBlock':'Same as step 5: create a TextBlock and make it the window’s Content. The <b>{</b> on the next line starts an <b>object initializer</b> spread over several lines, one property per line. Much easier to read.',
  'FontWeight = FontWeight.Bold,':'<b>Bold</b> text. FontWeight is an enum: try <code>FontWeight.Light</code> or <code>FontWeight.Black</code>. Notice the <b>comma</b>: inside an initializer, properties are separated by commas, not semicolons.',
  'Content = new StackPanel':'<b>The shelf.</b> A window’s Content holds only ONE thing, so we give it a <b>StackPanel</b>: one object that holds many children and stacks them <b>top to bottom</b>.',
  'var buttonRow = new StackPanel':'<b>A second shelf</b>, this one just for the two buttons. Panels can go inside panels: the whole window is one big vertical StackPanel, and this horizontal one sits inside it.',
  'Orientation = Orientation.Horizontal,':'Makes this StackPanel stack its children <b>left to right</b> instead of top to bottom. Needs <code>using Avalonia.Layout;</code>.',
  'txtName.Focus();':'Puts the typing cursor back into the name box, so the user can type the next name right away. Small touch, professional feel.',
  'int.TryParse(txtAge.Text, out int age);':'<b>Week 2 skills, inside a GUI!</b> txtAge.Text is a <b>string</b> (exactly like Console.ReadLine). TryParse turns it into the int <b>age</b>, safely: if the box has letters or is empty, age becomes <b>0</b> and nothing crashes. (Checking the true/false result needs <b>if</b>, coming soon.)',
  'lblResult.Text = "Hello, " + txtName.Text + "!";':'<b>The rhythm of every GUI: read → glue → write.</b> <b>Read</b> what the user typed (txtName.Text), <b>glue</b> it into a sentence with +, <b>write</b> the result into the label’s Text property. The window updates instantly.',
  'lblResult.Text = $"Hello, {txtName.Text}! Next year you will be {age + 1}.";':'A <b>$-string</b> (Week 2) builds the message: the name from one TextBox, math on the number from the other. Output goes to the label instead of Console.WriteLine.',
  'lblResult.Text = "Your greeting will appear here.";':'Puts the label back to its starting message.',
  'int count = 0;':'<b>A field that remembers.</b> Declared at class level, so its value <b>survives between clicks</b>. A variable inside the handler would restart at 0 every time.',
  'count = count + 1;':'Add one to the remembered count (Week 1: read the right side, store into the left).',
  'count = 0;':'Reset the remembered number.',
  'lblCount.Text = $"Clicks: {count}";':'Show the new count on the label. The label needs text, so the $-string turns the number into a string.',
  'lblCount.Text = "Clicks: 0";':'Show zero again.',
  'double.TryParse(txtFahrenheit.Text, out double fahrenheit);':'Read the TextBox (a string) and convert it safely to a double. Letters or an empty box give 0.',
  'double celsius = (fahrenheit - 32) * 5 / 9;':'The same formula as Week 2’s console converter. The <b>Process</b> step never changes between console and GUI.',
  'lblCelsius.Text = $"{fahrenheit} F = {celsius:F1} C";':'Output to the label, formatted with <b>:F1</b> (one decimal), exactly like Week 2.',
  'Content = new StackPanel { Children = { btnGo, lblOut } };':'A one-line shelf with two children.',
  'lblOut.Text = "Clicked!";':'Writes into the label, which only works because lblOut is a <b>field</b> now (see the Fix-It tab).',
  'class Program':'<b>Part 1, the launcher.</b> The same <b>class Program</b> + <b>Main</b> you know from console apps: .NET still starts here.',
  '[STAThread]':'A tag that desktop GUI apps need on Main (it sets up the thread the window runs on). Copy it, don’t worry about it.',
  'public static void Main(string[] args)':'The starting point, as always. <b>string[] args</b> holds command-line extras. We never use them.',
  'AppBuilder.Configure<App>()':'"Build an Avalonia app using the <b>App</b> class below"…',
  '.UsePlatformDetect()':'…"detect whether we’re on Windows, macOS or Linux and use the right drawing system"…',
  '.StartWithClassicDesktopLifetime(args);':'…"start it as a normal desktop app that stays open until the last window closes." Three lines, one long statement: note the single <b>;</b> at the very end.',
  'public class App : Application':'<b>Part 2, the app.</b> App <b>is an</b> Application (inheritance again).',
  'public override void OnFrameworkInitializationCompleted()':'A method Avalonia calls automatically once it’s ready. We use it to load the theme and open our window.',
  'Styles.Add(new FluentTheme());':'Loads the modern Fluent theme. Without it, controls would be almost invisible.',
  'if (ApplicationLifetime is IClassicDesktopStyleApplicationLifetime desktop)':'"If this is a normal desktop app…" (It always is, for us.)',
  'desktop.MainWindow = new MainWindow();   // <- opens YOUR file':'<b>The handshake.</b> The engine creates <b>your</b> MainWindow with <b>new</b> (which runs your constructor) and shows it. This is the only line in Program.cs worth remembering.',
  'base.OnFrameworkInitializationCompleted();':'Lets Avalonia finish its own startup work.',
  '// PART 1: The launcher. Starts Avalonia.':'A comment labeling the first half of the engine.',
  '// PART 2: The app. Loads the modern theme, opens your window.':'A comment labeling the second half.'
};
var RULES=[
  [/^Title = "(.*)";$/,function(m){return '<b>Your first property!</b> <b>Title</b> is the text in the window’s title bar. It’s a <b>string</b>, so the value wears quotes. Read it as: "this window’s Title gets “'+m[1]+'”". No dot in front, because we’re <i>inside</i> the window: it means <i>my own</i> Title.';}],
  [/^Width = (\d+);$/,function(m){return '<b>Width</b> in pixels: '+m[1]+'. It’s a <b>number</b>, so no quotes. <code>Width = "'+m[1]+'";</code> would be an error: text doesn’t fit in a number property.';}],
  [/^Height = (\d+);$/,function(m){return '<b>Height</b> in pixels: '+m[1]+'. Change it, press F5, see the difference. Cause and effect.';}],
  [/^Background = Brushes\.(\w+);$/,function(m){return '<b>Background</b> paints the window. <b>Brushes.'+m[1]+'</b> is one of ~140 named colors. Type <code>Brushes.</code> and pause: IntelliSense lists them all. Needs <code>using Avalonia.Media;</code> (squiggle? <b>Ctrl+.</b>).';}],
  [/^Text = "(.*)",?$/,function(m){return 'The <b>Text</b> property: what this TextBlock displays: “'+m[1]+'”. Ends with a comma because more properties follow inside the { }.';}],
  [/^FontSize = (\d+),?$/,function(m){return '<b>FontSize</b> '+m[1]+' (the default is 14). A number: no quotes.';}],
  [/^Foreground = Brushes\.(\w+),?$/,function(m){return '<b>Foreground</b> is the <b>text color</b> (Background is the area behind it). Here: '+m[1]+'.'+(/,$/.test(m[0])?'':' No comma: it’s the last property in this initializer.');}],
  [/^Margin = new Thickness\((\d+)\),?$/,function(m){return '<b>Margin</b> = empty space <i>around</i> the control, '+m[1]+' pixels on all four sides. A <b>Thickness</b> is a small object (left, top, right, bottom), so it’s created with <b>new</b>. Needs <code>using Avalonia;</code>.';}],
  [/^Spacing = (\d+),?$/,function(m){return '<b>Spacing</b>: '+m[1]+' pixels of gap <i>between</i> the children on this shelf.';}],
  [/^Children = \{ (.*) \}$/,function(m){return '<b>Children</b> lists what goes on the shelf, <b>in order</b>: '+m[1].split(', ').map(function(x){return '<b>'+x+'</b>';}).join(' → ')+'. Change the order here and the window changes to match. Each name must be a variable you created above.';}],
  [/^var (lbl\w+) = new TextBlock$/,function(m){return 'Create a TextBlock and give it a <b>name</b>: <b>'+m[1]+'</b>. <b>var</b> lets C# figure out the type (TextBlock). Naming habit for the whole semester: <b>lbl</b>… for labels, <b>btn</b>… for buttons, <b>txt</b>… for text boxes.';}],
  [/^var (lbl\w+) = new TextBlock \{ (.*) \};$/,function(m){return 'A whole TextBlock in one line: create it, name it <b>'+m[1]+'</b>, set its properties. Short initializers fit on one line. Long ones read better spread out.';}],
  [/^var (btn\w+) = new Button \{ Content = "(.*)" \};$/,function(m){return '<b>A button is just another object.</b> Create it with <b>new Button</b>, name it <b>'+m[1]+'</b>, and set its <b>Content</b> (the caption) to “'+m[2]+'”. By itself it does nothing when clicked. It needs an <b>event</b>.';}],
  [/^(btn\w+)\.Click \+= (\w+);$/,function(m){return '<b>The wire.</b> "When <b>'+m[1]+'</b> is clicked, run the method <b>'+m[2]+'</b>." <b>+=</b> means <i>subscribe</i>: add this method to the list of things to run on every click. No parentheses after the method name: we’re not calling it now, we’re telling the button which method to call <i>later</i>.';}],
  [/^TextBox (txt\w+) = new TextBox \{ Watermark = "(.*)" \};$/,function(m){return '<b>A TextBox: input from the user.</b> It’s a <b>field</b> (declared above the constructor, not inside it) because the click method needs to read it later. <b>Watermark</b> is the grey hint “'+m[2]+'” that disappears when the user types.';}],
  [/^TextBlock (lbl\w+) = new TextBlock \{(.*)\};$/,function(m){return '<b>A label for output</b>, declared as a <b>field</b>: it lives as long as the window, so a click method can write into it later. Its properties are set right here in one initializer.';}],
  [/^void (Btn\w+_Click)\(object\? sender, RoutedEventArgs e\)$/,function(m){return '<b>The event handler</b>: an ordinary method (Week 1) that runs on every click. <b>void</b> = returns nothing. The two parameters are required by Click: <b>sender</b> = which control was clicked, <b>e</b> = details about the click. (The <b>?</b> just says sender could be empty; it keeps VS Code free of warnings.) Name pattern: <b>ControlName_Event</b>.';}],
  [/^(txt\w+)\.Text = "";$/,function(m){return 'Empty the <b>'+m[1]+'</b> box by setting its Text to an empty string.';}]
];
function noteFor(line){
  var t=line.trim();
  if(t==='')return 'A blank line: breathing room for human eyes. The compiler ignores it.';
  if(t==='{')return 'Opens a block (or an object initializer). Every { needs its }.';
  if(t==='}')return 'Closes a block.';
  if(t==='};')return 'Closes the object initializer. The <b>;</b> ends the whole statement that began with <b>new</b>.';
  if(EXACT[t])return EXACT[t];
  for(var i=0;i<RULES.length;i++){var m=t.match(RULES[i][0]);if(m)return RULES[i][1](m);}
  return null;
}
