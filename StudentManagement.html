<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>MAC 109 · Week 4: Building Student Management, one piece at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1220;--surface:#181c2e;--surface2:#222840;--border:#2f3654;
  --ink:#eef0f8;--ink2:#c3c9dd;--muted:#9098b4;
  --brand:#6d63ff;--brand2:#a45cff;--brand-soft:#2a2d55;--brand-ink:#c9c5ff;
  --good:#22c58b;--good-soft:#12352b;--bad:#f06a60;--bad-soft:#3d1f23;--warn:#f5b83d;--warn-soft:#352b12;
  --code-bg:#0a0d18;--code-bar:#151a2c;--code-border:#2a3150;--code-text:#e6e9f2;--code-ln:#5b627a;
  --kw:#7aa2f7;--type:#2ac3de;--str:#e0af68;--com:#7f8aa8;--num:#ff9e64;--hl:#2c3350;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace;
  --radius:14px;--shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
body{padding-bottom:80px}
code{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:.9em;color:var(--brand-ink)}
b,strong{color:var(--ink)}
header{position:sticky;top:0;z-index:50;background:rgba(15,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 24px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:14px;color:#fff;flex:none}
.ttl b{display:block;font-size:17px}.ttl span{color:var(--muted);font-size:13px}
.right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.prog{width:160px;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}
nav.tabs{display:flex;gap:2px;padding:0 16px;overflow-x:auto}
.tab{background:none;border:0;color:var(--ink2);font:600 13px var(--sans);padding:10px 11px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:10.5px;font-family:var(--mono);color:var(--muted)}
.tab.active{color:var(--brand-ink);border-bottom-color:var(--brand)}.tab.active i{background:var(--brand);color:#fff}
.tab.done i{background:var(--good-soft);color:var(--good)}
.tab:hover{color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:30px 32px;min-height:calc(100vh - 200px)}
.slide{display:none;animation:fade .25s ease}.slide.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:10px}
h1{font-size:clamp(30px,4.4vw,52px);line-height:1.08;margin:0 0 18px;letter-spacing:-.02em;font-weight:800}
h2{font-size:clamp(22px,2.8vw,34px);line-height:1.15;margin:0 0 10px;letter-spacing:-.015em;font-weight:800}
h3{font-size:17px;margin:0 0 8px;font-weight:700}
.grad{background:linear-gradient(90deg,var(--brand-ink),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;color:var(--ink2);max-width:76ch;margin:0 0 18px}
.lead.big{font-size:21px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.g{border-color:#1f5a44;background:#101f1b}.card.w{border-color:#5a4a1f;background:#1f1a10}.card.b{border-color:#5a2a2a;background:#1f1010}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand-ink);font-family:var(--mono);font-size:12px;padding:5px 12px;border-radius:99px;margin:0 0 10px}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.objlist{list-style:none;padding:0;margin:0}
.objlist li{padding:6px 0 6px 26px;position:relative;font-size:16px;color:var(--ink2)}
.objlist li::before{content:'▸';position:absolute;left:4px;color:var(--brand)}
.note{background:var(--surface2);border-left:4px solid var(--brand);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;color:var(--ink2);font-size:15px}
.note.good{border-color:var(--good)}.note.bad{border-color:var(--bad)}.note.warn{border-color:var(--warn)}
.kbd{display:inline-block;font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--border);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:var(--ink)}
.step{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}
@media(max-width:1000px){.step{grid-template-columns:1fr}}
.idea{background:linear-gradient(135deg,#1b1f3a,#171a2c);border:1px solid var(--brand);border-radius:12px;padding:14px 18px;margin:0 0 14px}
.idea .w{font-family:var(--mono);color:var(--brand-ink);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.idea .d{font-size:16px;color:var(--ink2);margin-top:4px}
.where{display:flex;align-items:center;gap:10px;margin:14px 0 6px;font-size:13px;color:var(--muted)}
.where b{background:var(--warn-soft);color:var(--warn);font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:6px;letter-spacing:.06em}
.codewin{background:var(--code-bg);border:1px solid var(--code-border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--code-bar);border-bottom:1px solid var(--code-border);font-size:13px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.fname{font-family:var(--mono);color:var(--ink);font-weight:600}
.tag{background:var(--brand-soft);color:var(--brand-ink);font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:6px}
.copy{margin-left:auto;background:var(--surface2);border:1px solid var(--border);color:var(--ink);font:600 12px var(--sans);padding:5px 12px;border-radius:7px;cursor:pointer}
.copy:hover{border-color:var(--brand)}
.src{margin:0;padding:10px 0;overflow:auto;font-family:var(--mono);font-size:13.2px;line-height:1.62;max-height:560px}
.ln{display:flex;white-space:pre;padding:0 16px 0 0;border-left:3px solid transparent}
.ln .n{width:40px;flex:none;text-align:right;padding-right:12px;color:var(--code-ln);user-select:none}
.ln.has{cursor:help}.ln.has:hover{background:var(--hl);border-left-color:var(--brand)}
.ln.new{background:rgba(34,197,139,.09);border-left-color:var(--good)}
.ln.ctx{opacity:.5}
.k{color:var(--kw)}.t{color:var(--type)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.nu{color:var(--num)}.p{color:var(--code-text)}
.explain{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:12px;padding:12px 16px;min-height:76px;margin-bottom:12px}
.explain .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.explain .q{font-family:var(--mono);font-size:12.5px;color:var(--brand-ink);margin-bottom:5px;white-space:pre-wrap}
.explain p{margin:0;color:var(--ink2);font-size:14.5px}
.prevcap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
.cap{font-size:14.5px;color:var(--ink2);margin-top:10px}
.legend{font-size:12.5px;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lg-new{background:var(--good-soft);color:var(--good);font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px}
.lg-ctx{background:var(--surface2);color:var(--muted);font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px}
details.full{margin-top:14px;border:1px dashed var(--border);border-radius:12px}
details.full summary{cursor:pointer;padding:10px 14px;color:var(--brand-ink);font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:10px}
details.full summary::before{content:'▸';color:var(--muted)}details.full[open] summary::before{content:'▾'}
details.full .inner{padding:0 10px 10px}
.wv{background:#f4f5f9;color:#1a1d2b;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);border:1px solid #d7dae6;width:100%;margin:0 auto;font-family:var(--sans)}
.wv .tb{background:#e8eaf2;border-bottom:1px solid #d0d3df;padding:7px 12px;display:flex;align-items:center;gap:10px;font-size:13px}
.wv .tb .ctl{margin-left:auto;color:#6b7086}
.wv .body{padding:18px;min-height:120px}
.wv .h{font-size:19px;font-weight:700;color:#1a1d2b;margin:0 0 6px}
.wv .lab{font-size:13px;color:#1a1d2b;margin:6px 0 2px}
.wv .in{display:block;width:100%;border:1px solid #c5c9d6;background:#fff;border-radius:5px;padding:6px 9px;font:13px var(--sans);margin:4px 0;color:#1a1d2b}
.wv .in.ph{color:#9aa0b4}
.wv .btn{display:inline-block;background:#e6e8f0;border:1px solid #c5c9d6;border-radius:5px;padding:5px 14px;font:600 13px var(--sans);margin:4px 6px 4px 0;color:#1a1d2b}
.wv .st{font-size:13px;min-height:18px;margin:6px 0}
.wv .ok{color:#2e7d32}.wv .err{color:#c62828}
.wv .lb{background:#fff;border:1px solid #c5c9d6;border-radius:5px;min-height:100px;font-size:13px;margin-top:4px}
.wv .lb div{padding:4px 9px;border-bottom:1px solid #eef0f5}
.wv .lb div.sel{background:#dcdcff}
.wv .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.wv .empty{color:#9aa0b4;font-size:12px;text-align:center;padding:30px 0}
.wv .hi{outline:3px solid #22c58b;outline-offset:3px;border-radius:4px;box-shadow:0 0 0 6px rgba(34,197,139,.15)}
.wv .hi-box{outline:3px dashed #22c58b;outline-offset:6px;border-radius:4px}
.tree{font-family:var(--mono);font-size:13px;background:var(--code-bg);border:1px solid var(--code-border);border-radius:10px;padding:12px 16px;color:var(--ink2)}
.tree .hi{color:var(--good);font-weight:600}.tree .dim{color:var(--muted)}.tree .ind{padding-left:22px}
.cheat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.cheat{grid-template-columns:1fr 1fr}}
.cheat .card{padding:14px}
.cheat pre{margin:8px 0 0;font-family:var(--mono);font-size:12px;color:var(--code-text);background:var(--code-bg);border:1px solid var(--code-border);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,18,32,.95);border-top:1px solid var(--border);backdrop-filter:blur(10px);z-index:50}
.fbar{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.fbtn{background:var(--surface);border:1px solid var(--border);color:var(--ink);padding:9px 18px;border-radius:9px;cursor:pointer;font:600 14px var(--sans)}
.fbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.fbtn:disabled{opacity:.4;cursor:default}
.fbar .hint{margin-left:auto}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="logo">C#</div>
    <div class="ttl"><b>MAC 109 · Week 4: Building Student Management, one piece at a time</b><span>LaGuardia Community College · MEC Department · Prof. K. Kassou · VS Code + Avalonia</span></div>
    <div class="right"><span>Each tab: the whole file, new lines in green → the window grows</span><div class="prog"><i id="progBar"></i></div></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<footer><div class="fbar"><button class="fbtn" id="backBtn">◀ Back</button><button class="fbtn primary" id="nextBtn">Next ▶</button><span id="posTxt"></span><span class="hint">← → keys move between tabs</span></div></footer>

<script>
/* ---------- helpers ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const attr = s => esc(s).replace(/"/g,'&quot;');
const KW = /\b(using|namespace|public|private|readonly|class|void|var|new|if|else|return|out|true|false|null|int|string|bool|double|get|set|object|foreach|in|this|static|override|base|is)\b/g;
function hl(line){
  let s = esc(line); const ci = s.indexOf('//'); let comment='';
  if (ci>=0){ comment = `<span class="c">${s.slice(ci)}</span>`; s = s.slice(0,ci); }
  const parts = s.split(/(\$?&quot;.*?&quot;|\$?"[^"]*")/g);
  s = parts.map((p,i)=> i%2 ? `<span class="s">${p}</span>` : p.replace(KW,'<span class="k">$1</span>').replace(/\b([A-Z][A-Za-z0-9_]*)\b/g,'<span class="t">$1</span>').replace(/\b(\d+)\b/g,'<span class="nu">$1</span>')).join('');
  return s + comment;
}
// Lines starting with '~' are context (dimmed, already in the file). Others are NEW unless opts.plain.
function codeWin(fname, code, notes={}, tag='', opts={}){
  const raw = code.split('\n');
  const body = raw.map((t0,i)=>{
    const ctx = t0.startsWith('~'); const t = ctx ? t0.slice(1) : t0;
    const key = Object.keys(notes).find(k=>t.includes(k));
    const isNew = opts.newIdx ? opts.newIdx.has(i) : (!ctx && !opts.plain && t.trim()!=='');
    return `<div class="ln ${key?'has':''} ${isNew?'new':''} ${ctx?'ctx':''}" data-x="${key?attr(notes[key]):''}" data-t="${attr(t.trim())}"><span class="n">${opts.plain?i+1:''}</span><span class="p">${hl(t)}</span></div>`;
  }).join('');
  const clean = raw.filter(t=>!t.startsWith('~')).join('\n');
  return `<div class="codewin" data-code="${attr(opts.plain?code:clean)}"><div class="bar"><div class="dots"><i></i><i></i><i></i></div><span class="fname">${fname}</span>${tag?`<span class="tag">${tag}</span>`:''}<button class="copy">Copy</button></div><pre class="src">${body}</pre></div>`;
}
function win(title, body, w=420){ return `<div class="wv" style="max-width:${w}px"><div class="tb">🪟 ${title}<span class="ctl">— ☐ ✕</span></div><div class="body">${body}</div></div>`; }
function explainBox(idle){ return `<div class="explain"><div class="lbl">Explanation</div><div class="q"></div><p>${idle}</p></div>`; }

/* ---------- the app, assembled from a state so the final file is exact ---------- */
const FLD = {
  txtName:'    private readonly TextBox txtName = new() { Watermark = "Name" };',
  txtId:  '    private readonly TextBox txtId = new() { Watermark = "ID" };',
  txtAge: '    private readonly TextBox txtAge = new() { Watermark = "Age" };',
  lst:    '    private readonly ListBox lstStudents = new();',
  status: '    private readonly TextBlock lblStatus = new() { Text = "Ready" };',
  count:  '    private readonly TextBlock lblCount = new() { Text = "0 students" };',
  list:   '    private readonly List<Student> students = new();',
  rows:   '    private readonly ObservableCollection<string> rows = new();',
};
const FORMLINES = {
  heading:'        form.Children.Add(new TextBlock { Text = "Student form", FontSize = 22 });',
  lName:'        form.Children.Add(new TextBlock { Text = "Name" });', txtName:'        form.Children.Add(txtName);',
  lId:'        form.Children.Add(new TextBlock { Text = "ID" });', txtId:'        form.Children.Add(txtId);',
  lAge:'        form.Children.Add(new TextBlock { Text = "Age" });', txtAge:'        form.Children.Add(txtAge);',
  btnAdd:'        form.Children.Add(btnAdd);', btnClear:'        form.Children.Add(btnClear);', status:'        form.Children.Add(lblStatus);',
};
const SIG = n => `    private void ${n}(object? sender, Avalonia.Interactivity.RoutedEventArgs e)`;
function compose(st){
  const u = ['using System;', st.gen?'using System.Collections.Generic;':null, st.obs?'using System.Collections.ObjectModel;':null, 'using Avalonia;','using Avalonia.Controls;','using Avalonia.Layout;', st.media?'using Avalonia.Media;':null].filter(Boolean);
  const fields = ['txtName','txtId','txtAge','lst','status','count','list','rows'].filter(k=>st.fields.includes(k)).map(k=>FLD[k]);
  let c = `    public MainWindow()\n    {\n        Title = "Student Management";\n${st.items?'        lstStudents.ItemsSource = rows;\n':''}        Width = 850;\n        Height = 520;\n`;
  const btns = []; if (st.btns.includes('add')) btns.push('        var btnAdd = new Button { Content = "Add" };'); if (st.btns.includes('clear')) btns.push('        var btnClear = new Button { Content = "Clear" };'); if (st.btns.includes('del')) btns.push('        var btnDelete = new Button { Content = "Delete selected" };');
  if (btns.length) c += '\n' + btns.join('\n') + '\n';
  const w = []; if (st.wire.includes('add')) w.push('        btnAdd.Click += Add_Click;'); if (st.wire.includes('clear')) w.push('        btnClear.Click += Clear_Click;'); if (st.wire.includes('del')) w.push('        btnDelete.Click += Delete_Click;');
  if (w.length) c += '\n' + w.join('\n') + '\n';
  if (st.form.length===0){ c += '    }\n'; return u.join('\n') + '\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n' + c + '}'; }
  c += '\n        var form = new StackPanel { Spacing = 10 };\n' + ['heading','lName','txtName','lId','txtId','lAge','txtAge','btnAdd','btnClear','status'].filter(k=>st.form.includes(k)).map(k=>FORMLINES[k]).join('\n') + '\n';
  if (st.list>=1){
    c += '\n        var listPanel = new DockPanel { LastChildFill = true };\n        var heading = new StackPanel { Spacing = 8 };\n        heading.Children.Add(new TextBlock { Text = "Saved students", FontSize = 22 });\n';
    if (st.list>=2) c += '        heading.Children.Add(lblCount);\n        heading.Children.Add(btnDelete);\n';
    c += '        DockPanel.SetDock(heading, Dock.Top);\n        listPanel.Children.Add(heading);\n';
    if (st.list>=3) c += '        listPanel.Children.Add(lstStudents);\n';
    c += '\n        var grid = new Grid\n        {\n            ColumnDefinitions = new ColumnDefinitions("1*,1*"),\n            ColumnSpacing = 24,\n            Margin = new Thickness(24)\n        };\n        Grid.SetColumn(form, 0);\n        Grid.SetColumn(listPanel, 1);\n        grid.Children.Add(form);\n        grid.Children.Add(listPanel);\n        Content = grid;\n';
  } else c += '        Content = form;\n';
  c += '    }\n';
  const methods = [st.add, st.clear, st.del, st.clearForm, st.showStatus].filter(Boolean);
  return u.join('\n') + '\n\nnamespace MyStudioApp;\n\npublic class MainWindow : Window\n{\n' + fields.join('\n') + '\n\n' + c + (methods.length? '\n' + methods.join('\n') : '') + '}';
}
const ADD = {
  v1:`${SIG('Add_Click')}
    {
        lblStatus.Text = "Add clicked for " + txtName.Text;
    }
`,
  v2:`${SIG('Add_Click')}
    {
        int.TryParse(txtAge.Text, out int age);
        Student student = new Student { Name = txtName.Text, Id = txtId.Text, Age = age };
        lblStatus.Text = $"Added {student.Name} | {student.Id} | {student.Age}";
    }
`,
  v3:`${SIG('Add_Click')}
    {
        int.TryParse(txtAge.Text, out int age);
        Student student = new Student { Name = txtName.Text, Id = txtId.Text, Age = age };
        students.Add(student);
        lblCount.Text = $"{students.Count} students";
        lblStatus.Text = $"Added {student.Name} | {student.Id} | {student.Age}";
    }
`,
  v4:`${SIG('Add_Click')}
    {
        int.TryParse(txtAge.Text, out int age);
        Student student = new Student { Name = txtName.Text, Id = txtId.Text, Age = age };
        students.Add(student);
        rows.Add($"{student.Name} | {student.Id} | {student.Age}");
        lblCount.Text = $"{students.Count} students";
        lblStatus.Text = "Student added.";
    }
`,
  v5:`${SIG('Add_Click')}
    {
        string name = txtName.Text?.Trim() ?? "";
        string id = txtId.Text?.Trim() ?? "";

        if (name.Length == 0 || id.Length == 0)
        {
            lblStatus.Text = "Enter a name and an ID.";
            return;
        }

        int.TryParse(txtAge.Text, out int age);
        Student student = new Student { Name = name, Id = id, Age = age };
        students.Add(student);
        rows.Add($"{student.Name} | {student.Id} | {student.Age}");
        lblCount.Text = $"{students.Count} students";
        lblStatus.Text = "Student added.";
    }
`,
  v6:`${SIG('Add_Click')}
    {
        string name = txtName.Text?.Trim() ?? "";

/* ---------- preview ---------- */
function preview(o){
  const H = k => (o.hi||[]).includes(k) ? ' hi' : '';
  const v = o.vals||['','',''];
  const inp=(ph,val,k)=>val?`<input class="in${H(k)}" value="${val}">`:`<div class="in ph${H(k)}">${ph}</div>`;
  let form = '';
  if (o.form){
    form += `<div class="h${H('heading')}">Student form</div>`;
    if (o.form.includes('name')) form += `<div class="lab${H('name')}">Name</div>${inp('Name',v[0],'name')}`;
    if (o.form.includes('id')) form += `<div class="lab${H('id')}">ID</div>${inp('ID',v[1],'id')}`;
    if (o.form.includes('age')) form += `<div class="lab${H('age')}">Age</div>${inp('Age',v[2],'age')}`;
    if (o.form.includes('btns')) form += `<span class="btn${H('add')}">Add</span><span class="btn${H('clear')}">Clear</span>`;
    if (o.form.includes('status')) form += `<div class="st ${o.cls||''}${H('status')}">${o.status??'Ready'}</div>`;
  }
  let list = '';
  if (o.list){
    list += `<div class="h${H('ltitle')}">Saved students</div>`;
    if (o.list>=2) list += `<div class="lab${H('count')}">${o.count??'0 students'}</div><span class="btn${H('del')}">Delete selected</span>`;
    if (o.list>=3) list += `<div class="lb${H('lb')}">${(o.rows||[]).map((r,i)=>`<div class="${i===o.sel?'sel':''}">${r}</div>`).join('')}</div>`;
  }
  if (!o.form && !o.list) return win('Student Management', `<div class="empty">empty, 850 × 520</div>`, 420);
  if (!o.list) return win('Student Management', form, 420);
  return win('Student Management', `<div class="cols"><div>${form}</div><div${H('right')?' class="hi-box"':''}>${list}</div></div>`, 560);
}

/* ---------- tabs ---------- */
const T = [];
function tab(o){ T.push(o); }
function diffNew(prevCode, curCode){
  const prev = prevCode ? prevCode.split('\n') : [];
  const counts = {}; prev.forEach(l=>{ counts[l]=(counts[l]||0)+1; });
  const idx = new Set();
  curCode.split('\n').forEach((l,i)=>{ if (l.trim()==='') return; if (counts[l]>0) counts[l]--; else idx.add(i); });
  return idx;
}
let prevComposed = '';
function stepHtml(o, idx){
  let main = '';
  if (o.state || o.rawCode){
    const code = o.rawCode || compose(o.state);
    const newIdx = diffNew(prevComposed, code);
    prevComposed = code;
    main = codeWin('MainWindow.cs', code, o.notes||{}, `complete file at tab ${idx} · ${code.split('\n').length} lines · paste over yours · F5`, {plain:true, newIdx});
  } else if (o.blocks){
    main = o.blocks.map(b=>codeWin(b.file||'MainWindow.cs', b.code, o.notes||{}, b.tag||'complete file · paste · F5', {plain:true, newIdx: b.allNew ? new Set(b.code.split('\n').map((l,i)=>l.trim()?i:-1).filter(i=>i>=0)) : new Set()})).join('');
  }
  const extra = o.extraCode ? `<div style="margin-top:12px">${codeWin(o.extraCode.file, o.extraCode.code, o.notes||{}, o.extraCode.tag||'', {plain:true, newIdx:new Set(o.extraCode.code.split('\n').map((l,i)=>l.trim()?i:-1).filter(i=>i>=0))})}</div>` : '';
  return `<div class="eyebrow">Tab ${idx} · ${o.eyebrow||''}</div><h2>${o.title}</h2><p class="lead">${o.lead}</p>
  <div class="step"><div>
    ${o.idea?`<div class="idea"><div class="w">New idea: ${o.idea[0]}</div><div class="d">${o.idea[1]}</div></div>`:''}
    <div class="legend"><span class="lg-new">+ NEW</span> lines added or changed in this tab · everything else is from earlier tabs · hover any line · <b>Copy</b> gives the complete file</div>
    ${main}${extra}
  </div><div>${explainBox(o.idle||'Hover any line of the file.')}<div class="prevcap">▶ F5 → the window now</div>${o.win}${o.cap?`<div class="cap">${o.cap}</div>`:''}</div></div>`;
}

/* ---------- render ---------- */
const main = document.getElementById('main');
main.innerHTML = T.map((t,i)=>`<section class="slide" data-i="${i}">${t.html || stepHtml(t,i)}</section>`).join('');
document.getElementById('tabs').innerHTML = T.map((t,i)=>`<button class="tab" data-i="${i}"><i>${i}</i>${t.short}</button>`).join('');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(+b.dataset.i));
let cur = 0;
function go(i){
  cur = Math.max(0,Math.min(T.length-1,i));
  document.querySelectorAll('.slide').forEach((s,j)=>s.classList.toggle('active',j===cur));
  document.querySelectorAll('.tab').forEach((b,j)=>{ b.classList.toggle('active',j===cur); b.classList.toggle('done',j<cur); });
  document.getElementById('progBar').style.width=((cur+1)/T.length*100)+'%';
  document.getElementById('posTxt').textContent=`${cur+1} / ${T.length} · ${T[cur].short}`;
  document.getElementById('backBtn').disabled=cur===0; document.getElementById('nextBtn').disabled=cur===T.length-1;
  const act=document.querySelector('.tab.active'); if(act) act.scrollIntoView({inline:'center',block:'nearest'});
  window.scrollTo({top:0});
  const src=document.querySelector('.slide.active .src'); const first=src&&src.querySelector('.ln.new');
  if (src) src.scrollTop = first ? Math.max(0, first.offsetTop - src.clientHeight/3) : 0;
}
document.getElementById('backBtn').onclick=()=>go(cur-1); document.getElementById('nextBtn').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{ if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return; if(e.key==='ArrowRight')go(cur+1); if(e.key==='ArrowLeft')go(cur-1); });
document.querySelectorAll('.codewin').forEach(w=>{
  const slide = w.closest('.slide'); const box = slide.querySelector('.explain');
  w.querySelector('.copy').onclick=()=>navigator.clipboard.writeText(w.dataset.code).then(()=>{const b=w.querySelector('.copy'); b.textContent='Copied ✓'; setTimeout(()=>b.textContent='Copy',1400);});
  if (!box) return;
  const q = box.querySelector('.q'), p = box.querySelector('p'), idle = p.textContent;
  w.querySelectorAll('.ln.has').forEach(ln=>ln.onmouseenter=()=>{ q.textContent=ln.dataset.t; p.textContent=ln.dataset.x; });
  w.querySelector('.src').onmouseleave=()=>{ q.textContent=''; p.textContent=idle; };
});
window.__final = compose(ST18);
go(0);
