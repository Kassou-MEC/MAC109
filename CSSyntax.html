<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="dark">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAC 109 · Week 1 — C# Syntax: Your Tools for Building GUIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1220; --surface:#181c2e; --surface2:#222840; --border:#2f3654;
    --ink:#eef0f8; --ink2:#c3c9dd; --muted:#9098b4;
    --brand:#6d63ff; --brand2:#a45cff; --brand-soft:#2a2d55; --brand-ink:#c9c5ff;
    --good:#22c58b; --good-soft:#12352b; --bad:#f06a60; --bad-soft:#3d1f23; --warn:#f5b83d; --warn-soft:#352b12;
    --code-bg:#0a0d18; --code-bar:#151a2c; --code-border:#2a3150; --code-text:#e6e9f2; --code-ln:#5b627a;
    --kw:#7aa2f7; --type:#2ac3de; --str:#e0af68; --com:#7f8aa8; --met:#c0caf5; --num:#ff9e64; --hl:#2c3350; --pin:#3b4a7a;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace;
    --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:var(--sans)}
  b{font-weight:700}

  /* ---------- app frame ---------- */
  #app{display:flex;flex-direction:column;height:100vh}
  #top{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:10px 22px;flex:0 0 auto}
  #top .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  #top .ttl{font-weight:700;font-size:15px}
  #top .ttl small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
  #top .right{margin-left:auto;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:14px}
  #progressWrap{width:140px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
  #progressBar{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}

  #tabstrip{background:var(--surface);display:flex;overflow-x:auto;flex:0 0 auto;border-bottom:1px solid var(--border);padding:0 14px;scrollbar-width:thin;gap:2px}
  .tab{background:transparent;color:var(--ink2);border:none;border-bottom:3px solid transparent;padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
  .tab:hover{color:var(--brand-ink)}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}
  .tab.active .dot{background:var(--brand)}
  .tab.done .dot{background:var(--good)}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:6px}

  #stage{flex:1 1 auto;overflow:hidden;position:relative}
  .slide{position:absolute;inset:0;overflow-y:auto;padding:34px max(40px,calc((100% - 1180px)/2)) 110px;display:none;animation:slidein .3s ease}
  .slide.active{display:block}
  .cl .src{white-space:pre;flex:1 1 auto}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.slide{animation:none}*{transition:none!important}}

  #bottom{background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 22px;flex:0 0 auto}
  #bottom button{background:var(--brand);color:#fff;border:none;padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600}
  #bottom button.ghost{background:var(--surface2);color:var(--ink)}
  #bottom button:hover{filter:brightness(1.07)}
  #bottom button:disabled{opacity:.35;cursor:default;filter:none}
  #bottom .where{color:var(--muted);font-size:13px;margin-left:6px}
  #bottom .grow{flex:1}
  #bottom .hint{color:var(--muted);font-size:12.5px}
  @media(max-width:700px){#bottom .hint,#top .right,#top .ttl small,.codewin .bar .tag,.codewin .bar .dots{display:none}#top .ttl{font-size:13.5px}#top{padding:8px 14px}#bottom{padding:8px 14px}.cl .ln{width:34px;padding-right:10px}.codewin pre{font-size:12.5px}}

  /* ---------- typography & cards ---------- */
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:10px;font-weight:600}
  h1{font-size:clamp(30px,4.2vw,46px);font-weight:800;line-height:1.12;margin-bottom:14px;letter-spacing:-.02em}
  h2{font-size:clamp(24px,3vw,32px);font-weight:800;margin-bottom:6px;letter-spacing:-.015em}
  h3{font-size:17px;font-weight:700}
  .sub{color:var(--ink2);max-width:76ch;font-size:16.5px;margin-bottom:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr}}
  @media(max-width:860px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.slide{padding:22px 16px 110px}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .card p{color:var(--ink2);font-size:15px;margin-top:8px}
  .pill{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--brand-soft);color:var(--brand-ink);border-radius:20px;padding:3px 11px;margin-bottom:10px;font-weight:600}
  .pill.g{background:var(--good-soft);color:#7ff0c3}.pill.w{background:var(--warn-soft);color:#fcd67a}.pill.r{background:var(--bad-soft);color:#ffb3ac}
  code.inline{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:.88em;color:var(--brand-ink)}
  .note{background:var(--warn-soft);border:1px solid #5c4a1a;border-radius:12px;padding:12px 16px;color:#fbe3a6;font-size:14px;margin-top:16px}
  .tip{background:var(--good-soft);border:1px solid #235e4a;border-radius:12px;padding:12px 16px;color:#bff5dd;font-size:14px;margin-top:16px}
  .rule{display:flex;gap:14px;align-items:flex-start}
  .rule .num{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--mono)}
  .objlist li{list-style:none;padding:7px 0 7px 30px;position:relative;font-size:15.5px}
  .objlist li::before{content:"▸";position:absolute;left:8px;color:var(--brand);font-weight:700}
  .checklist li{list-style:none;padding:9px 0 9px 32px;position:relative;font-size:15px;border-bottom:1px dashed var(--border)}
  .checklist li::before{content:"✓";position:absolute;left:4px;color:var(--good);font-weight:800}
  .kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:12.5px}

  /* ---------- hover-explain code examples ---------- */
  .ex{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;align-items:start;margin:16px 0 26px}
  @media(max-width:900px){.ex{grid-template-columns:1fr}}
  .codewin{background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius);overflow:hidden;box-shadow:0 14px 34px rgba(27,31,46,.18)}
  .codewin .bar{background:var(--code-bar);padding:9px 14px;font-family:var(--mono);font-size:12px;color:#aab1c8;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--code-border)}
  .codewin .bar .dots i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}
  .codewin .bar .fname{font-weight:700;color:#e6e9f2}
  .codewin .bar .tag{font-size:10.5px;background:#2f3650;color:#c0caf5;border-radius:20px;padding:2px 9px;font-family:var(--sans);font-weight:600}
  .codewin .bar .btns{margin-left:auto;display:flex;gap:6px}
  .codewin .bar button{background:#2f3650;border:1px solid #3d4661;color:#e6e9f2;border-radius:7px;padding:3px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
  .codewin .bar button:hover{background:#3b4463}
  .codewin .bar button.run{background:var(--good);border-color:var(--good);color:#fff}
  .codewin pre{padding:10px 0 12px;font-family:var(--mono);font-size:14px;line-height:1.7;overflow-x:auto;color:var(--code-text)}
  .cl{display:flex;padding:0 14px 0 0;white-space:pre;border-left:3px solid transparent;cursor:default}
  .cl .ln{width:44px;color:var(--code-ln);text-align:right;padding-right:16px;flex:0 0 auto;user-select:none}
  .cl.explain{cursor:pointer}
  .cl.explain:hover,.cl.explain.hot{background:var(--hl);border-left-color:var(--brand)}
  .cl.explain.pinned{background:var(--pin);border-left-color:#ffd166}
  .cl.explain:focus-visible{outline:none;background:var(--hl);border-left-color:var(--brand)}
  .k{color:var(--kw)}.t{color:var(--type)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.m{color:var(--met)}.n{color:var(--num)}.p{color:var(--code-text)}

  .explain-panel{position:sticky;top:6px}
  .expl{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--brand);border-radius:var(--radius);padding:16px 18px;min-height:150px;box-shadow:var(--shadow);transition:border-color .2s}
  .expl.pinned{border-left-color:#e0a800}
  .expl .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .expl .lbl .pinbadge{display:none;background:var(--warn-soft);color:#fcd67a;border-radius:20px;padding:1px 8px;letter-spacing:0;text-transform:none;font-family:var(--sans);font-weight:600}
  .expl.pinned .lbl .pinbadge{display:inline-block}
  .expl .codeq{font-family:var(--mono);font-size:13px;color:var(--brand-ink);background:var(--brand-soft);border-radius:8px;padding:6px 10px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
  .expl .why{font-size:15.5px;color:var(--ink);line-height:1.65}
  .expl .why b{color:var(--brand-ink)}
  .expl .why code{font-family:var(--mono);font-size:12.8px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--brand-ink)}
  .expl.idle .codeq{display:none}
  .expl.idle .why{color:var(--muted)}
  .term{background:#0e1017;border:1px solid #2a2f44;border-radius:var(--radius);padding:12px 16px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.8;color:#d8dcea;margin-top:12px;min-height:82px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
  .term .thead{font-size:10.5px;letter-spacing:.12em;color:#6b7390;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
  .term .tline{white-space:pre-wrap}
  .term .tline.typing{animation:pop .25s ease}
  .term .placeholder{color:#5f6785;font-style:italic}
  .term .prompt{color:#6b7390}
  @keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .exnote{font-size:14px;color:var(--ink2);margin:-12px 0 20px 4px}

  /* ---------- flip cards ---------- */
  .flip{perspective:900px;cursor:pointer;min-height:170px}
  .flip .inner{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
  .flip.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--border);padding:20px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
  .face.front{background:var(--surface)}
  .face.front .big{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--brand-ink)}
  .face.front small{color:var(--muted);margin-top:8px;font-size:12.5px}
  .face.back{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;transform:rotateY(180deg);border:none}
  .face.back p{font-size:14px;line-height:1.55}

  /* ---------- pipeline ---------- */
  .pipe{display:flex;align-items:stretch;flex-wrap:wrap;margin:18px 0 14px;gap:0}
  .pnode{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:center;flex:1;min-width:120px;cursor:pointer;box-shadow:var(--shadow)}
  .pnode b{display:block;font-size:14px}
  .pnode span{color:var(--muted);font-size:12px}
  .pnode:hover,.pnode.hot{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .parrow{display:flex;align-items:center;color:var(--brand);font-size:22px;padding:0 8px}

  /* ---------- bug hunt ---------- */
  .cl.bugline{cursor:pointer}
  .cl.bugline:hover{background:var(--hl)}
  .cl.bugline.found{background:#3a1f22;border-left-color:var(--bad)}
  .cl.bugline.wrongpick{background:#1e3a2c;border-left-color:var(--good)}
  .buglabel{margin-left:14px;font-family:var(--sans);font-size:12px;border-radius:5px;padding:1px 8px;white-space:normal}
  .buglabel.err{background:var(--bad);color:#fff}
  .buglabel.ok{background:var(--good);color:#fff}

  /* ---------- quiz ---------- */
  .q{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .q h3{margin-bottom:12px;font-size:16px}
  .q .opt{display:block;width:100%;text-align:left;background:var(--surface2);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:14.5px;font-family:var(--sans)}
  .q .opt code{font-family:var(--mono);font-size:13px}
  .q .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .q .opt.right{border-color:var(--good);background:var(--good-soft);color:#bff5dd;font-weight:600}
  .q .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#ffc9c4}
  .q .why{margin-top:10px;font-size:13.5px;color:var(--ink2);display:none}
  .q .why.show{display:block}
  #quizScore{font-family:var(--mono);color:var(--brand-ink);font-size:15px;margin-top:6px;font-weight:600}

  /* ---------- bridge table ---------- */
  .bridge{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:14px}
  .bridge th{background:var(--surface2);text-align:left;padding:11px 14px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .bridge td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top}
  .bridge td code{font-family:var(--mono);font-size:12.8px;background:var(--surface2);border-radius:6px;padding:2px 7px;color:var(--brand-ink);white-space:nowrap}
  .bridge td.arrow{color:var(--brand);font-weight:800;text-align:center;width:40px}
  .cheat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:1000px){.cheat{grid-template-columns:1fr 1fr}}
  @media(max-width:700px){.cheat{grid-template-columns:1fr}}
  .cheat .card{padding:14px 16px}
  .cheat .card h3{font-size:14px;margin-bottom:6px}
  .cheat .card code{display:block;font-family:var(--mono);font-size:12.5px;color:var(--brand-ink);background:var(--brand-soft);border-radius:8px;padding:8px 10px;white-space:pre-wrap;margin-top:6px}
  .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
  @media(max-width:900px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="logo">C#</div>
    <div class="ttl">MAC 109 · Week 1 — C# Syntax: your tools for building GUIs<small>LaGuardia Community College · MEC Department · Prof. K. Kassou</small></div>
    <div class="right"><span>Hover any code line to read it</span><div id="progressWrap" aria-hidden="true"><div id="progressBar"></div></div></div>
  </div>
  <nav id="tabstrip" aria-label="Sections"></nav>
  <main id="stage"></main>
  <div id="bottom">
    <button id="prevBtn" class="ghost" aria-label="Previous section">◀ Back</button>
    <button id="nextBtn" aria-label="Next section">Next ▶</button>
    <span class="where" id="where"></span>
    <div class="grow"></div>
    <span class="hint">← → keys move between sections · click a code line to pin its explanation</span>
  </div>
</div>

<template id="slides">

<!-- 1 ▸ Start -->
<section data-tab="Start">
  <p class="eyebrow">Week 1 · Lecture</p>
  <h1>C# Syntax — the tools you'll use<br>to build every window this semester</h1>
  <div class="hero">
    <div>
      <p class="sub">In MAC 109 you build real desktop apps, and <b>everything</b> — the buttons, the text boxes, the logic — is written in one language: <b>C#</b>. Before we draw a single window, you need to <em>read</em> C# fluently. Today is that day: small, complete programs, each one explained line by line.</p>
      <p class="pill">By the end of today you can</p>
      <ul class="objlist">
        <li>Recognize the <b>fixed skeleton</b> of every C# program and know which lines are yours</li>
        <li>Write <b>statements</b>, <b>variables</b>, <b>strings</b>, and <b>math</b> that compile the first time</li>
        <li>Choose the right <b>data type</b> (int, double, decimal, char, string, bool…) and <b>convert</b> between types — text from a TextBox into a number and back</li>
        <li>Define and call <b>methods</b> — the shape of every button-click handler</li>
        <li>Create <b>objects</b> with <code class="inline">new</code>, set their <b>properties</b>, call their methods — the exact shape of every GUI control</li>
        <li>Spot the 4 classic syntax errors before the compiler does</li>
      </ul>
      <div class="tip">🖱️ <b>How this page works:</b> every code box is a <b>complete program</b>. Move your mouse over any line and its explanation appears on the right. Click a line to pin it. Press <b>▶ Run</b> to see what the program prints, and <b>Copy</b> to paste it into VS Code or any online C# compiler.</div>
    </div>
    <div>
      <div class="card">
        <span class="pill g">Why syntax first?</span>
        <h3>Next week you'll write this — and understand every word</h3>
        <p>A window in our course is just C# objects: <code class="inline">new Button { Content = "Say Hello" }</code>. That line uses <b>new</b>, an <b>object</b>, a <b>property</b>, and a <b>string</b> — four things you learn today. Learn the shapes now; next week we only swap the words.</p>
      </div>
      <div class="card" style="margin-top:14px">
        <span class="pill">Your 3 tools</span>
        <p><b>C#</b> — the language you write.<br><b>.NET</b> — the engine + library that runs it.<br><b>VS Code</b> (+ C# Dev Kit) — the workshop where you type and press Run.<br><span style="color:var(--muted)">Next week adds a 4th: <b>Avalonia</b>, the box of GUI parts.</span></p>
      </div>
    </div>
  </div>
</section>

<!-- 2 ▸ Big picture -->
<section data-tab="Big Picture">
  <p class="eyebrow">01 · The big picture — 5 minutes</p>
  <h2>What happens when you press ▶ Run</h2>
  <p class="sub">Flip each card, then click each stage of the pipeline. You don't need to memorize the internals — you need to know <b>why the compiler complains</b> when a semicolon is missing.</p>
  <div class="grid3">
    <div class="flip" tabindex="0" role="button" aria-label="Flip card: C#"><div class="inner">
      <div class="face front"><span class="big">C#</span><small>"C-Sharp" — the language ▸ click to flip</small></div>
      <div class="face back"><p><b>C#</b> is a modern, object-oriented language created by Microsoft. It is the vocabulary and grammar we use to give the computer instructions — for desktop apps, games (Unity), web, and mobile.</p></div>
    </div></div>
    <div class="flip" tabindex="0" role="button" aria-label="Flip card: .NET"><div class="inner">
      <div class="face front"><span class="big">.NET</span><small>"dot-net" — the platform ▸ click to flip</small></div>
      <div class="face back"><p><b>.NET</b> is the world your C# lives in: a huge library of ready-made code (<code>Console</code>, <code>Math</code>, windows, files…) plus the engine that runs your program on Windows, macOS, and Linux.</p></div>
    </div></div>
    <div class="flip" tabindex="0" role="button" aria-label="Flip card: Compiler"><div class="inner">
      <div class="face front"><span class="big">Compiler</span><small>the strict proofreader ▸ click to flip</small></div>
      <div class="face back"><p>The <b>compiler</b> reads your <em>whole</em> program before anything runs. One missing semicolon, one wrong capital letter, and it stops and tells you the exact file and line. Strict — but it never lets a typo reach your users.</p></div>
    </div></div>
  </div>
  <div class="pipe" id="pipeline">
    <div class="pnode" data-i="0"><b>Your C# code</b><span>Program.cs</span></div><div class="parrow">→</div>
    <div class="pnode" data-i="1"><b>Compiler</b><span>checks + translates</span></div><div class="parrow">→</div>

<!-- 3 ▸ The skeleton -->
<section data-tab="The Skeleton">
  <p class="eyebrow">02 · Every C# program wears the same suit</p>
  <h2>The skeleton: 9 lines, 1 is yours</h2>
  <p class="sub">Every program you write this semester starts from this exact shape. Lines 1–6 and 8–9 are the <b>suit</b> — always the same. Line 7 is the only line that is truly yours. <b>Hover each line</b> and read it; nothing here should feel like magic when you leave.</p>
  <div class="ex" data-ex="skeleton"></div>
  <div class="grid4">
    <div class="card"><span class="pill">using</span><h3>Borrow a toolbox</h3><p><code class="inline">using System;</code> = "this file uses the System toolbox" — where <code class="inline">Console</code> lives.</p></div>
    <div class="card"><span class="pill">class</span><h3>The labeled box</h3><p>All C# code lives inside a <code class="inline">class</code>. For now: a box with a name. Real meaning: the Objects tab.</p></div>
    <div class="card"><span class="pill">Main</span><h3>The starting line</h3><p>The computer looks for <code class="inline">Main</code> and runs its lines top to bottom. No Main, no program.</p></div>
    <div class="card"><span class="pill">{ }</span><h3>Containers</h3><p>Every <code class="inline">{</code> must meet its <code class="inline">}</code>. Click next to a brace in VS Code and it highlights its partner.</p></div>
  </div>
</section>

<!-- 4 ▸ Statements & output -->
<section data-tab="Output">
  <p class="eyebrow">03 · Statements, order &amp; comments</p>
  <h2>A program is a recipe: one statement at a time, top to bottom</h2>
  <p class="sub">A <b>statement</b> is one complete instruction ending in <code class="inline">;</code>. The computer never improvises: it runs line 1, then line 2, then line 3. <code class="inline">Console.WriteLine</code> prints and moves to a new line; <code class="inline">Console.Write</code> prints and stays. Anything after <code class="inline">//</code> is a note for humans.</p>
  <div class="ex" data-ex="output"></div>
  <p class="exnote"><b>Anatomy to memorize:</b> <code class="inline">Console</code> = the screen · <code class="inline">.</code> = "look inside" · <code class="inline">WriteLine</code> = the action · <code class="inline">( … )</code> = what to print · <code class="inline">" "</code> = it's text · <code class="inline">;</code> = end of sentence.</p>
  <div class="tip">🧪 <b>Try it:</b> copy the program, swap two WriteLine lines, run again. Then change one <code class="inline">WriteLine</code> to <code class="inline">Write</code>. Predict the output <em>before</em> you press Run.</div>
</section>

<!-- 5 ▸ Variables -->
<section data-tab="Variables">
  <p class="eyebrow">04 · Variables — labeled boxes</p>
  <h2>Variables: labeled boxes that hold a value</h2>
  <p class="sub">A variable has a <b>type</b> (what kind of thing fits inside), a <b>name</b> (you choose it), and a <b>value</b>. Declare it once — <code class="inline">int age = 19;</code> — then use the name anywhere. The four types you'll use most — the next tab covers all of them in depth:</p>
  <div class="grid4" style="margin-bottom:6px">
    <div class="card"><span class="pill">string</span><h3>Text</h3><p>Anything in quotes: <code class="inline">"Maria"</code>, <code class="inline">"Say Hello"</code>. Every label and button caption in your GUI is a string.</p></div>
    <div class="card"><span class="pill">int</span><h3>Whole number</h3><p><code class="inline">19</code>, <code class="inline">-3</code>, <code class="inline">2026</code>. Counting things, ages, scores.</p></div>
    <div class="card"><span class="pill">double</span><h3>Decimal number</h3><p><code class="inline">3.75</code>, <code class="inline">9.99</code>. Prices, GPA, measurements.</p></div>
    <div class="card"><span class="pill">bool</span><h3>true / false</h3><p>A yes-or-no switch: <code class="inline">true</code> or <code class="inline">false</code>. "Is the box checked?"</p></div>
  </div>
  <div class="ex" data-ex="variables"></div>
  <div class="note">📛 <b>Naming rules:</b> letters, digits, underscore; no spaces; cannot start with a digit; <b>case matters</b> (<code class="inline">age</code> and <code class="inline">Age</code> are different). Convention: <code class="inline">camelCase</code> for variables (<code class="inline">firstName</code>, <code class="inline">totalPrice</code>). Next week in the lab: <code class="inline">btnSave</code>, <code class="inline">txtName</code>, <code class="inline">lblResult</code>.</div>
</section>

<!-- ▸ Data types -->
<section data-tab="Data Types">
  <p class="eyebrow">05 · Data types in depth</p>
  <h2>Data types: every value in C# has a type, and the type decides everything</h2>
  <p class="sub">A value’s <b>type</b> decides three things: <b>what it can hold</b>, <b>how much memory</b> it uses, and <b>what you can do with it</b> (you can multiply two ints, but not two strings). C# is <b>strongly typed</b>: once a variable has a type, it keeps it forever, and the compiler checks every assignment before the program runs.</p>
  <table class="bridge" style="margin-bottom:18px">
    <thead><tr><th>Type</th><th>Holds</th><th>Size</th><th>Range / precision</th><th>Write it like</th><th>Use it for</th></tr></thead>
    <tbody>
      <tr><td><code>byte</code></td><td>whole number, no negatives</td><td>1 byte</td><td>0 to 255</td><td><code>255</code></td><td>colors, small counters</td></tr>
      <tr><td><code>int</code> ★</td><td>whole number</td><td>4 bytes</td><td>about ±2.1 billion</td><td><code>32</code></td><td>counts, ages, scores — <b>the default</b></td></tr>
      <tr><td><code>long</code></td><td>big whole number</td><td>8 bytes</td><td>about ±9.2 quintillion</td><td><code>8100000000L</code></td><td>populations, file sizes</td></tr>
      <tr><td><code>float</code></td><td>decimal number</td><td>4 bytes</td><td>~7 digits</td><td><code>72.5f</code></td><td>graphics, games</td></tr>
      <tr><td><code>double</code> ★</td><td>decimal number</td><td>8 bytes</td><td>~15–16 digits</td><td><code>3.75</code></td><td>measurements, GPA — <b>the default</b></td></tr>
      <tr><td><code>decimal</code></td><td>exact decimal</td><td>16 bytes</td><td>28–29 exact digits</td><td><code>19.99m</code></td><td><b>money</b></td></tr>
      <tr><td><code>char</code></td><td>ONE character</td><td>2 bytes</td><td>any single letter/symbol</td><td><code>'A'</code></td><td>grades, initials</td></tr>
      <tr><td><code>string</code> ★</td><td>text (0 or more chars)</td><td>varies</td><td>as long as you need</td><td><code>"MAC 109"</code></td><td>names, every GUI label</td></tr>
      <tr><td><code>bool</code> ★</td><td>true or false</td><td>1 byte</td><td>2 values</td><td><code>true</code></td><td>yes/no, checkboxes, decisions</td></tr>
    </tbody>
  </table>
  <p class="sub" style="margin-bottom:6px">★ = the four you’ll use 90% of the time. Hover the program below — it declares one of each and prints them.</p>
  <div class="ex" data-ex="types"></div>
  <div class="grid3">
    <div class="card"><span class="pill">Suffixes</span><h3>Tell C# the literal’s type</h3><p><code class="inline">3.75</code> is a double by default; <code class="inline">72.5f</code> is a float; <code class="inline">19.99m</code> is a decimal; <code class="inline">8100000000L</code> is a long. Forget the <code class="inline">f</code> or <code class="inline">m</code> and the compiler refuses.</p></div>
    <div class="card"><span class="pill">Quotes matter</span><h3><code class="inline">'A'</code> vs <code class="inline">"A"</code> vs <code class="inline">A</code></h3><p>Single quotes = a <b>char</b>. Double quotes = a <b>string</b>. No quotes = the name of a <b>variable</b>. Three different things that look almost the same.</p></div>
    <div class="card"><span class="pill w">Default values</span><h3>What a fresh variable holds</h3><p>Numbers start at <code class="inline">0</code>, bool at <code class="inline">false</code>, char at <code class="inline">'\0'</code>, string at <code class="inline">null</code> (nothing). That’s why our Student class wrote <code class="inline">= ""</code> for Name.</p></div>
  </div>

  <h3 style="margin:30px 0 4px;font-size:21px">Converting between types — the skill every GUI needs</h3>
  <p class="sub" style="margin-bottom:6px">Whatever a user types in a TextBox arrives as a <b>string</b> — even "25". To do math you must <b>convert</b> it; to show a result on a label you convert back. Four tools:</p>
  <div class="grid4" style="margin-bottom:4px">
    <div class="card"><span class="pill g">Implicit</span><h3>Automatic</h3><p>Small → big, nothing lost: <code class="inline">double d = 7;</code></p></div>
    <div class="card"><span class="pill w">Cast</span><h3><code class="inline">(int)</code></h3><p>Big → small, may lose data. Chops decimals: <code class="inline">(int)3.99</code> → <code class="inline">3</code></p></div>
    <div class="card"><span class="pill">Parse</span><h3>Text → number</h3><p><code class="inline">int.Parse("25")</code> · <code class="inline">double.Parse("4.5")</code></p></div>
    <div class="card"><span class="pill">ToString</span><h3>Anything → text</h3><p><code class="inline">age.ToString()</code> — or <code class="inline">Convert.ToString(age)</code></p></div>
  </div>
  <div class="ex" data-ex="convert"></div>
  <div class="note">⚠ <b>Coming next week:</b> <code class="inline">int.Parse("hello")</code> crashes — the text isn’t a number. In the GUI we’ll meet its safe sibling <code class="inline">int.TryParse</code>, which answers with a <b>bool</b>: "did it work?"</div>
</section>

<!-- 6 ▸ Strings -->
<section data-tab="Strings">
  <p class="eyebrow">06 · Working with text</p>
  <h2>Strings: gluing, filling in blanks, and asking questions</h2>
  <p class="sub">Your GUI will constantly build text: <i>"Hello, Maria!"</i>, <i>"Total: $12.50"</i>. Two ways to build it — <code class="inline">+</code> glues pieces together; <code class="inline">$"…{name}…"</code> fills in blanks. And a string is an object: it can answer questions like <code class="inline">.Length</code> and do things like <code class="inline">.ToUpper()</code>.</p>
  <div class="ex" data-ex="strings"></div>
  <div class="grid2">
    <div class="card"><span class="pill w">⚠ The plot twist</span><h3><code class="inline">+</code> has two personalities</h3><p>With two <b>numbers</b>, <code class="inline">+</code> adds: <code class="inline">7 + 3</code> → <code class="inline">10</code>. With any <b>text</b> involved, <code class="inline">+</code> glues: <code class="inline">"" + 7 + 3</code> → <code class="inline">"73"</code>. This is the #1 surprise in Week 2 when we read numbers typed into a TextBox.</p></div>
    <div class="card"><span class="pill g">✓ Prefer $-strings</span><h3>Cleaner, fewer bugs</h3><p><code class="inline">$"Hello, {first}!"</code> reads like the sentence it prints. Inside <code class="inline">{ }</code> you can put any variable — even math: <code class="inline">$"Total: {price * 3}"</code>.</p></div>
  </div>
</section>

<!-- 7 ▸ Math -->
<section data-tab="Math">
  <p class="eyebrow">07 · Arithmetic</p>
  <h2>Math: five operators and one famous trap</h2>
  <p class="sub"><code class="inline">+ − * /</code> do what you expect — with one trap: when <b>both</b> sides are <code class="inline">int</code>, division <b>drops the remainder</b>. <code class="inline">%</code> gives you that remainder. Add one decimal (<code class="inline">2.0</code>) and division becomes exact.</p>
  <div class="ex" data-ex="math"></div>
  <div class="grid3">
    <div class="card"><span class="pill">Order of operations</span><p>Same as school math: <code class="inline">* / %</code> before <code class="inline">+ −</code>, left to right. Use parentheses to be explicit: <code class="inline">(a + b) / 2</code>.</p></div>
    <div class="card"><span class="pill">Shortcuts you'll see</span><p><code class="inline">count = count + 1;</code> can be written <code class="inline">count += 1;</code> or <code class="inline">count++;</code>. All three mean "add one".</p></div>
    <div class="card"><span class="pill">Math toolbox</span><p><code class="inline">Math.Round(3.456, 2)</code> → 3.46 · <code class="inline">Math.Max(4, 9)</code> → 9 · <code class="inline">Math.Sqrt(16)</code> → 4. Same dot pattern as <code class="inline">Console.WriteLine</code>.</p></div>
  </div>
</section>

<!-- 8 ▸ Methods -->
<section data-tab="Methods">
  <p class="eyebrow">08 · Methods — named blocks of code</p>
  <h2>Methods: write it once, call it by name</h2>
  <p class="sub">A <b>method</b> is a named block of statements. You <b>define</b> it once (outside Main, inside the class) and <b>call</b> it as many times as you like. Methods can take <b>parameters</b> (values sent in) and <b>return</b> a value (sent back). <code class="inline">Main</code> itself is a method — the one .NET calls for you. Next week, every button click calls a method you wrote.</p>
  <div class="ex" data-ex="methods"></div>
  <div class="grid3">
    <div class="card"><span class="pill">Shape of a definition</span><code class="inline" style="display:block;padding:8px 10px;white-space:pre">static  void  Greet(string name)
  ↑       ↑      ↑        ↑
 suit  returns  name  parameter
       nothing</code><p>Read <code class="inline">void</code> as "gives nothing back"; <code class="inline">int</code> in its place means "gives back an int".</p></div>
    <div class="card"><span class="pill">Define vs. call</span><p>Defining a method does <b>nothing</b> by itself — it's a recipe on a shelf. The line <code class="inline">Greet("Maria");</code> is what actually runs it. Two calls, two runs.</p></div>
    <div class="card"><span class="pill">Why it matters for GUIs</span><p>A button-click handler is just a method: <code class="inline">void BtnSave_Click(...) { … }</code>. The difference: <b>you</b> don't call it — the window calls it when the user clicks. Same shape, different caller.</p></div>
  </div>
</section>

<!-- 9 ▸ Objects -->
<section data-tab="Objects">
  <p class="eyebrow">09 · Objects, properties &amp; new — the heart of GUI code</p>
  <h2>Objects: a class is a blueprint, <code class="inline">new</code> builds one</h2>
  <p class="sub">A <b>class</b> describes a kind of thing — its <b>properties</b> (data it holds) and its <b>methods</b> (things it can do). <code class="inline">new</code> builds one real <b>object</b> from that blueprint. You then talk to the object with a dot: <code class="inline">s1.Name = "Maria";</code> sets a property; <code class="inline">s1.Introduce();</code> calls a method. <b>This is exactly how a Button, a TextBox, and a Window work.</b></p>
  <div class="ex" data-ex="objects"></div>
  <div class="grid3">
    <div class="card"><span class="pill">Blueprint → object</span><p><code class="inline">class Student</code> is the blueprint (one). <code class="inline">new Student()</code> is a real student (as many as you want). Each object keeps its <b>own</b> values: s1 is Maria, s2 is Ahmed.</p></div>
    <div class="card"><span class="pill">Object initializer</span><p><code class="inline">new Student { Name = "Ahmed", Age = 21 }</code> builds <b>and</b> sets properties in one statement. Memorize this shape — you'll write <code class="inline">new Button { Content = "Save" }</code> a hundred times.</p></div>
    <div class="card"><span class="pill">Reading with the dot</span><p><code class="inline">s2.Age</code> reads the value; <code class="inline">s2.Age = 22;</code> changes it. Next week: <code class="inline">txtName.Text</code> reads what the user typed; <code class="inline">lblResult.Text = "Hi!";</code> shows an answer on screen.</p></div>
  </div>
</section>

<!-- 10 ▸ Syntax rules + bug hunt -->
<section data-tab="Bug Hunt">
  <p class="eyebrow">10 · The four rules of C# grammar</p>
  <h2>Nearly every error you'll make this month breaks one of these</h2>
  <div class="grid4" style="margin-bottom:22px">
    <div class="card rule"><div class="num">1</div><div><h3>Statements end with <code class="inline">;</code></h3><p>The semicolon is C#'s period. Forget it and the compiler says <b>; expected</b> and points at the line.</p></div></div>
    <div class="card rule"><div class="num">2</div><div><h3>Case matters</h3><p><code class="inline">Console</code> exists; <code class="inline">console</code> does not. <code class="inline">Main</code> starts the program; <code class="inline">main</code> never runs.</p></div></div>
    <div class="card rule"><div class="num">3</div><div><h3>Text wears quotes</h3><p><code class="inline">WriteLine(Hello)</code> asks for a variable named Hello — which doesn't exist. Words for humans go inside <code class="inline">" "</code>.</p></div></div>
    <div class="card rule"><div class="num">4</div><div><h3>Every <code class="inline">{</code> needs a <code class="inline">}</code></h3><p>The class wears a pair, Main wears a pair. Lose one and the errors cascade — fix the first error first.</p></div></div>
  </div>
  <h3 style="margin-bottom:6px">🐞 Bug hunt — find the 4 errors</h3>
  <p class="sub" style="margin-bottom:10px">A complete program that will <b>not</b> compile. Hover to read each line; <b>click</b> the ones you think are broken. <span id="bugScore" style="font-family:var(--mono);color:var(--brand-ink);font-weight:600">Found: 0 / 4</span></p>

<section data-tab="→ GUI Next">
  <p class="eyebrow">12 · The bridge — where today's syntax goes next week</p>
  <h2>Same shapes, new words: from console to window</h2>
  <p class="sub">Nothing new is needed to read GUI code — only the <b>names</b> change. A window is a class; a button is an object built with <code class="inline">new</code>; its caption is a property; a click runs a method. Below: today's line on the left, next week's line on the right.</p>
  <table class="bridge">
    <thead><tr><th>Today (console)</th><th></th><th>Next week (GUI window)</th><th>Same idea</th></tr></thead>

      <tr><td><code>Student s1 = new Student();</code></td><td class="arrow">→</td><td><code>Button btnSave = new Button();</code></td><td><b>new</b> builds an object from a class</td></tr>
      <tr><td><code>new Student { Name = "Ahmed", Age = 21 }</code></td><td class="arrow">→</td><td><code>new Button { Content = "Save", Width = 120 }</code></td><td>object initializer sets properties</td></tr>

      <tr><td><code>string full = first + " " + last;</code></td><td class="arrow">→</td><td><code>string msg = "Hello, " + txtName.Text;</code></td><td>read a property, glue text</td></tr>
      <tr><td><code>static void Greet(string name) { … }</code></td><td class="arrow">→</td><td><code>void BtnSave_Click(object sender, RoutedEventArgs e) { … }</code></td><td>a method with parameters</td></tr>
      <tr><td><code>Greet("Maria");</code> — <i>you</i> call it</td><td class="arrow">→</td><td><code>btnSave.Click += BtnSave_Click;</code> — the <i>window</i> calls it</td><td>who runs the method</td></tr>

  /* ---------- syntax highlighter (tokenizes raw text, escapes safely) ---------- */
  var KW=/^(using|class|static|void|int|double|string|bool|var|new|return|public|private|true|false|if|else|char|decimal|float|long)$/;
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function hl(line){
    var out='',i=0,n=line.length;
    while(i<n){
      var ch=line[i];
      if(ch==='/'&&line[i+1]==='/'){out+='<span class="c">'+esc(line.slice(i))+'</span>';break;}
      if(ch==='"'||(ch==='$'&&line[i+1]==='"')){
        var j=i+(ch==='$'?2:1);
        while(j<n&&line[j]!=='"'){if(line[j]==='\\')j++;j++;}
        j++;
        out+='<span class="s">'+esc(line.slice(i,j))+'</span>';i=j;continue;
      }
      if(/[A-Za-z_]/.test(ch)){
        var j2=i;while(j2<n&&/[A-Za-z0-9_]/.test(line[j2]))j2++;
        var w=line.slice(i,j2);
        var after=line.slice(j2).match(/^\s*\(/);
        var before=line.slice(0,i).match(/new\s+$/);
        var cls;
        if(KW.test(w))cls='k';
        else if(before)cls='t';
        else if(after)cls='m';
        else if(/^[A-Z]/.test(w))cls='t';
        else cls='p';
        out+='<span class="'+cls+'">'+esc(w)+'</span>';i=j2;continue;
      }
      if(/[0-9]/.test(ch)){
        var j3=i;while(j3<n&&/[0-9.]/.test(line[j3]))j3++;
        out+='<span class="n">'+line.slice(i,j3)+'</span>';i=j3;continue;
      }
      out+=esc(ch);i++;
    }
    return out;
  }

    win.appendChild(bar);

    var expl=document.createElement('div');expl.className='expl idle';
    expl.innerHTML='<div class="lbl"><span>Explanation</span><span class="pinbadge">📌 pinned — click again to unpin</span></div><div class="codeq"></div><div class="why">Hover any line of the code to read what it does. Click a line to pin it.</div>';

      var w=ex.window;var rows='';
      w.rows.forEach(function(r){
        if(r[0]==='textbox')rows+='<div style="background:#fff;border:1px solid #9aa0b4;border-radius:4px;padding:6px 8px;color:#8a90a5;font-size:12.5px">'+esc(r[1])+'</div>';

        if(r[0]==='label')rows+='<div style="color:#1b1f2e;font-size:12.5px">'+esc(r[1])+'</div>';
      });
      term.className='';term.style.marginTop='12px';
      term.innerHTML='<div style="font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:6px">▶ RUN → A WINDOW (after typing Maria and clicking)</div><div style="background:#f3f4f8;border:1px solid #b8bdcf;border-radius:8px;box-shadow:0 10px 26px rgba(27,31,46,.18);overflow:hidden;max-width:300px"><div style="background:linear-gradient(#fefefe,#e9eaf0);border-bottom:1px solid #c9cddc;padding:5px 10px;font-size:12px;color:#1b1f2e;display:flex;justify-content:space-between"><span>'+esc(w.title)+'</span><span style="color:#777;letter-spacing:2px;font-family:var(--mono)">— ▢ ✕</span></div><div style="padding:14px;display:flex;flex-direction:column;gap:10px">'+rows+'</div></div>';
      panel.appendChild(term);
    }

    var pinned=null,rows=[];
    function show(i){
      expl.classList.remove('idle');
      lbl.textContent='Line '+(i+1);
      var txt=lines[i].trim();
      codeq.textContent=txt||'(blank line)';codeq.style.display='block';
      why.innerHTML=ex.notes[i]||'';
    }
    function idle(){
      if(pinned!==null){show(pinned);return;}
      expl.classList.add('idle');lbl.textContent='Explanation';codeq.style.display='none';
      why.innerHTML='Hover any line of the code to read what it does. Click a line to pin it.';
    }
    lines.forEach(function(L,i){
      var row=document.createElement('span');row.className='cl explain';row.tabIndex=0;
      row.setAttribute('role','button');row.setAttribute('aria-label','Line '+(i+1)+': '+(L.trim()||'blank'));
      row.innerHTML='<span class="ln">'+(i+1)+'</span><span class="src">'+(hl(L)||' ')+'</span>';
      row.addEventListener('mouseenter',function(){if(pinned===null){rows.forEach(function(r){r.classList.remove('hot');});row.classList.add('hot');show(i);}});
      row.addEventListener('mouseleave',function(){if(pinned===null){row.classList.remove('hot');idle();}});
      row.addEventListener('focus',function(){if(pinned===null){show(i);}});
      row.addEventListener('click',function(){
        if(pinned===i){pinned=null;row.classList.remove('pinned');expl.classList.remove('pinned');show(i);return;}
        rows.forEach(function(r){r.classList.remove('pinned','hot');});
        pinned=i;row.classList.add('pinned');expl.classList.add('pinned');show(i);
      });
      row.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();}});
      pre.appendChild(row);rows.push(row);
    });

    copy.addEventListener('click',function(){
      function ok(){copy.textContent='Copied ✓';setTimeout(function(){copy.textContent='Copy';},1600);}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ex.code).then(ok,ok);}
      else{var ta=document.createElement('textarea');ta.value=ex.code;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);ok();}
    });
    if(run){
      run.addEventListener('click',function(){
        term.innerHTML='<div class="thead"><span>▶ RUN → OUTPUT</span><span class="prompt">terminal</span></div>';
        run.disabled=true;
        ex.out.forEach(function(o,k){
          setTimeout(function(){

            if(k===ex.out.length-1){run.disabled=false;run.textContent='↻ Run again';}
          },180*(k+1));
        });
      });
    }
    host.appendChild(win);host.appendChild(panel);
  }

  var tpl=document.getElementById('slides');
  var stage=document.getElementById('stage');
  var strip=document.getElementById('tabstrip');
  var secs=tpl.content.querySelectorAll('section');
  var slides=[],tabs=[],visited={};
  secs.forEach(function(sec,i){
    var s=sec.cloneNode(true);
    s.classList.add('slide');
    stage.appendChild(s);
    slides.push(s);
    var t=document.createElement('button');
    t.className='tab';t.type='button';
    t.innerHTML='<span class="dot"></span>'+sec.dataset.tab;
    t.addEventListener('click',function(){go(i);});
    strip.appendChild(t);
    tabs.push(t);
  });
  stage.querySelectorAll('.ex[data-ex]').forEach(function(h){buildExample(h,EX[h.dataset.ex]);});

  var cur=0;
  var prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
  function go(i){
    if(i<0||i>=slides.length)return;
    slides[cur].classList.remove('active');
    tabs[cur].classList.remove('active');
    if(visited[cur])tabs[cur].classList.add('done');
    visited[cur]=true;
    cur=i;
    slides[cur].classList.add('active');
    tabs[cur].classList.add('active');
    tabs[cur].scrollIntoView({inline:'nearest',block:'nearest'});
    slides[cur].scrollTop=0;
    prevBtn.disabled=(cur===0);
    nextBtn.disabled=(cur===slides.length-1);
    document.getElementById('progressBar').style.width=((cur)/(slides.length-1)*100)+'%';
    document.getElementById('where').textContent=(cur+1)+' / '+slides.length+' · '+secs[cur].dataset.tab;
  }
  prevBtn.addEventListener('click',function(){go(cur-1);});
  nextBtn.addEventListener('click',function(){go(cur+1);});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.key==='ArrowRight')go(cur+1);
    if(e.key==='ArrowLeft')go(cur-1);
  });

    {q:'<code>string typed = "25";</code> — which line prints <code>26</code>?',
     opts:['<code>Console.WriteLine(typed + 1);</code>','<code>Console.WriteLine((int)typed + 1);</code>','<code>Console.WriteLine(int.Parse(typed) + 1);</code>','<code>Console.WriteLine(typed.ToString() + 1);</code>'],
     a:2,why:'int.Parse turns the text "25" into the number 25, so + adds. typed + 1 glues to "251"; a (int) cast cannot convert a string at all — that is a compile error.'},
    {q:'What does <code>int x = (int)9.99;</code> store in x?',
     opts:['<code>10</code>','<code>9</code>','<code>9.99</code>','A compile error'],
     a:1,why:'A cast to int chops off the decimal part — it truncates, it does not round. Use Math.Round when you want 10.'},
    {q:'<code>int a = 7; int b = 3;</code> — what does <code>Console.WriteLine("" + a + b);</code> print?',
     opts:['<code>10</code>','<code>73</code>','<code>7 3</code>','A compile error'],
     a:1,why:'The first piece is text (empty quotes), so + switches to GLUE mode: "" + 7 → "7", then "7" + 3 → "73". Without the quotes, a + b would be 10.'},
    {q:'What does <code>Console.WriteLine(7 / 2);</code> print?',
     opts:['<code>3.5</code>','<code>3</code>','<code>4</code>','<code>1</code>'],
     a:1,why:'int ÷ int gives an int — the remainder is dropped. 7 / 2.0 would give 3.5; 7 % 2 would give the remainder, 1.'},
    {q:'What does <code>new Student { Name = "Ahmed", Age = 21 }</code> do?',
     opts:['Defines a new class called Student','Builds one Student object and sets two of its properties','Calls a method named Student with two arguments','Prints Ahmed and 21'],
     a:1,why:'new builds an object from the Student blueprint; the { … } is an object initializer that sets properties. Next week: new Button { Content = "Save" } — same shape.'},
    {q:'<code>static int Add(int a, int b) { return a + b; }</code> — which line uses it correctly?',
     opts:['<code>Add(2, 3);</code> and expecting something to print','<code>int s = Add(2, 3);</code>','<code>int s = Add;</code>','<code>Add(2 + 3);</code>'],
     a:1,why:'Add takes two ints and returns an int, so the call needs two arguments and the result should be stored (or printed). Calling it alone does nothing visible — it returns 5 to no one.'}
  ];
  var host=document.getElementById('quizHost');var score=0,answered=0;
  quiz.forEach(function(Q,qi){
    var box=document.createElement('div');box.className='q';
    var h=document.createElement('h3');h.innerHTML=(qi+1)+'. '+Q.q;box.appendChild(h);
    var why=document.createElement('p');why.className='why';why.innerHTML=Q.why;
    Q.opts.forEach(function(o,oi){
      var b=document.createElement('button');b.className='opt';b.type='button';b.innerHTML=o;
      b.addEventListener('click',function(){
        if(box.dataset.done)return;box.dataset.done='1';answered++;
        box.querySelectorAll('.opt').forEach(function(x,xi){x.disabled=true;if(xi===Q.a)x.classList.add('right');});
        if(oi===Q.a){score++;}else{b.classList.add('wrong');}
        why.classList.add('show');
        document.getElementById('quizScore').textContent='Score: '+score+' / '+quiz.length+(answered===quiz.length?(score===quiz.length?'  🏆 Perfect!':'  — review the explanations above, then move on.'):'');
      });
      box.appendChild(b);
    });
    box.appendChild(why);host.appendChild(box);
  });

  /* ---------- boot ---------- */
  slides[0].classList.add('active');
  tabs[0].classList.add('active');
  prevBtn.disabled=true;
  document.getElementById('where').textContent='1 / '+slides.length+' · '+secs[0].dataset.tab;
})();
</script>
