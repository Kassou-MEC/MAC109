<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAC 109 · Week 1 — Introduction, IDE Setup &amp; UI as C# Objects</title>
<style>
  :root{
    --chrome:#1e1e1e; --panel:#252526; --card:#2d2d30; --border:#3e3e42;
    --tab:#2d2d30; --tab-active:#1e1e1e; --statusbar:#007acc;
    --text:#d4d4d4; --muted:#9d9d9d; --white:#f3f3f3;
    --kw:#569cd6; --type:#4ec9b0; --str:#ce9178; --comment:#6a9955;
    --method:#dcdcaa; --num:#b5cea8; --accent:#c586c0;
    --good:#4ec9b0; --bad:#f48771; --warn:#dcdcaa;
    --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'Cascadia Code','Consolas','Menlo',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#141414;color:var(--text);font-family:var(--sans);font-size:16px;overflow:hidden}
  button{font-family:var(--sans)}

  /* ---------- IDE frame ---------- */
  #ide{display:flex;flex-direction:column;height:100vh}
  #titlebar{background:var(--chrome);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:6px 14px;font-size:13px;color:var(--muted);flex:0 0 auto}
  #titlebar .logo{width:18px;height:18px;background:linear-gradient(135deg,#8a2be2,#68217a);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:0 0 auto}
  #titlebar .menu span{margin-right:14px;cursor:default}
  #titlebar .file{margin-left:auto;font-family:var(--mono);color:#7a7a7a}
  #tabstrip{background:var(--panel);display:flex;overflow-x:auto;flex:0 0 auto;border-bottom:1px solid var(--border);scrollbar-width:thin}
  .tab{background:var(--tab);color:var(--muted);border-right:1px solid var(--border);padding:7px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;border-top:2px solid transparent}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:#555}
  .tab.active{background:var(--tab-active);color:var(--white);border-top-color:var(--statusbar)}
  .tab.active .dot{background:var(--statusbar)}
  .tab.done .dot{background:var(--good)}
  .tab:focus-visible{outline:2px solid var(--statusbar);outline-offset:-2px}

  #stage{flex:1 1 auto;overflow:hidden;position:relative;background:var(--tab-active)}
  .slide{position:absolute;inset:0;overflow-y:auto;padding:34px 46px 90px;display:none;animation:slidein .35s ease}
  .slide.active{display:block}
  @keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.slide{animation:none}*{transition:none!important}}

  #statusbarEl{background:var(--statusbar);color:#fff;font-size:12.5px;display:flex;align-items:center;gap:18px;padding:5px 14px;flex:0 0 auto}
  #statusbarEl .grow{flex:1}
  #statusbarEl button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:2px 14px;border-radius:3px;cursor:pointer;font-size:12.5px}
  #statusbarEl button:hover{background:rgba(255,255,255,.15)}
  #statusbarEl button:disabled{opacity:.4;cursor:default}
  #progressWrap{width:160px;height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
  #progressBar{height:100%;background:#fff;width:0;transition:width .3s}

  /* ---------- shared content ---------- */
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--statusbar);margin-bottom:10px}
  h1{font-size:clamp(30px,4.5vw,46px);font-weight:600;color:var(--white);line-height:1.15;margin-bottom:14px}
  h2{font-size:clamp(24px,3vw,32px);font-weight:600;color:var(--white);margin-bottom:6px}
  h3{font-size:18px;color:var(--white);font-weight:600}
  .sub{color:var(--muted);max-width:70ch;font-size:16.5px;line-height:1.55;margin-bottom:24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.slide{padding:24px 20px 90px}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px}
  .card p{color:var(--muted);line-height:1.55;font-size:14.5px;margin-top:8px}
  .pill{display:inline-block;font-family:var(--mono);font-size:11.5px;background:#0e639c;color:#fff;border-radius:20px;padding:3px 11px;margin-bottom:10px}
  .kbd{font-family:var(--mono);background:#3c3c3c;border:1px solid #555;border-bottom-width:2px;border-radius:4px;padding:1px 7px;font-size:12.5px;color:var(--white)}
  code.inline{font-family:var(--mono);background:#3c3c3c;padding:1px 6px;border-radius:4px;font-size:.9em;color:var(--warn)}

  /* code blocks */
  .codewin{background:#1a1a1a;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .codewin .bar{background:var(--card);padding:7px 13px;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center;border-bottom:1px solid var(--border)}
  .codewin .bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .codewin pre{padding:14px 0;font-family:var(--mono);font-size:14px;line-height:1.65;overflow-x:auto}
  .cl{display:flex;padding:0 16px;white-space:pre}
  .cl .ln{width:34px;color:#5a5a5a;text-align:right;padding-right:16px;flex:0 0 auto;user-select:none}
  .k{color:var(--kw)}.t{color:var(--type)}.s{color:var(--str)}.c{color:var(--comment)}.m{color:var(--method)}.n{color:var(--num)}.p{color:#d4d4d4}

  /* clickable code explainer */
  .cl.explain{cursor:pointer;border-left:3px solid transparent}
  .cl.explain:hover{background:#2a2d2e}
  .cl.explain.sel{background:#264f78;border-left-color:var(--statusbar)}
  #lineInfo{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--statusbar);border-radius:8px;padding:16px 18px;min-height:120px}
  #lineInfo h3{font-family:var(--mono);font-size:14px;color:var(--warn);margin-bottom:8px}
  #lineInfo p{color:var(--text);line-height:1.6;font-size:14.5px}

  /* flip cards */
  .flip{perspective:900px;cursor:pointer;min-height:190px}
  .flip .inner{position:relative;width:100%;height:100%;min-height:190px;transition:transform .5s;transform-style:preserve-3d}
  .flip.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;border:1px solid var(--border);padding:20px;display:flex;flex-direction:column;justify-content:center}
  .face.front{background:var(--card)}
  .face.front .big{font-family:var(--mono);font-size:26px;color:var(--white)}
  .face.front small{color:var(--statusbar);margin-top:10px;font-size:12.5px}
  .face.back{background:#0e2a3f;transform:rotateY(180deg)}
  .face.back p{color:var(--text);font-size:14px;line-height:1.55}

  /* pipeline */
  .pipe{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:22px 0}
  .pnode{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;text-align:center;flex:1;min-width:130px}
  .pnode b{color:var(--white);display:block;font-size:14.5px}
  .pnode span{color:var(--muted);font-size:12px}
  .parrow{display:flex;align-items:center;color:var(--statusbar);font-size:22px;padding:0 8px}
  .pnode.hot{border-color:var(--statusbar);box-shadow:0 0 0 1px var(--statusbar)}

  /* IDE tour */
  #tourMock{background:#1a1a1a;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:11px;user-select:none}
  #tourMock .tm-title{background:#3c3c3c;color:#ccc;padding:4px 10px;font-size:10.5px}
  #tourGrid{display:grid;grid-template-columns:52px 1fr 210px;grid-template-rows:26px 1fr 110px;height:390px}
  .tm{border:1px solid #333;display:flex;align-items:flex-start;justify-content:flex-start;padding:6px;position:relative;color:#8f8f8f;cursor:pointer;transition:background .15s}
  .tm:hover{background:#26292c}
  .tm.sel{background:#264f78;color:#fff}
  .tm .hotspot{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--statusbar);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,122,204,.6)}50%{box-shadow:0 0 0 7px rgba(0,122,204,0)}}
  #tm-menu{grid-column:1/4}
  #tm-toolbox{grid-row:2/4}
  #tm-editor{}
  #tm-solution{grid-row:2/3}
  #tm-output{grid-column:2/3}
  #tm-props{grid-row:3/4;grid-column:3/4}
  #tourInfo{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--statusbar);border-radius:8px;padding:16px 18px;margin-top:14px;min-height:96px}
  #tourInfo h3{margin-bottom:6px}
  #tourInfo p{color:var(--text);font-size:14.5px;line-height:1.55}

  /* spot the bug */
  .bugline{cursor:pointer;border-left:3px solid transparent}
  .bugline:hover{background:#2a2d2e}
  .bugline.found{background:#3c1e1e;border-left-color:var(--bad)}
  .bugline.wrongpick{background:#203a20;border-left-color:var(--good)}
  .buglabel{margin-left:14px;font-family:var(--sans);font-size:12px;border-radius:4px;padding:1px 8px}
  .buglabel.err{background:var(--bad);color:#1a1a1a}
  .buglabel.ok{background:var(--good);color:#1a1a1a}

  /* quiz */
  .q{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:16px}
  .q h3{margin-bottom:12px;font-size:16px}
  .q .opt{display:block;width:100%;text-align:left;background:#1a1a1a;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:14.5px}
  .q .opt:hover:not(:disabled){border-color:var(--statusbar)}
  .q .opt.right{border-color:var(--good);background:#12312b;color:#c8f5ea}
  .q .opt.wrong{border-color:var(--bad);background:#3c1e1e;color:#ffd9d0}
  .q .why{margin-top:10px;font-size:13.5px;color:var(--muted);display:none;line-height:1.55}
  .q .why.show{display:block}
  #quizScore{font-family:var(--mono);color:var(--warn);font-size:15px;margin-top:6px}

  /* ---------- GUI builder ---------- */
  #builder{display:grid;grid-template-columns:170px 1fr 250px;gap:14px;align-items:start}
  @media(max-width:1000px){#builder{grid-template-columns:1fr}}
  .bpanel{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .bpanel .bhead{background:#333;color:var(--white);font-size:12.5px;padding:7px 12px;font-weight:600;letter-spacing:.02em}
  .toolitem{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid #333;color:var(--text)}
  .toolitem:hover{background:#37373d}
  .toolitem .ico{font-family:var(--mono);font-size:11px;background:#0e639c;color:#fff;border-radius:4px;padding:2px 6px}
  #formHost{background:#3f3f46;padding:22px;display:flex;justify-content:center}
  #designForm{width:340px;height:260px;background:#f0f0f0;border:1px solid #999;border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.45);position:relative;overflow:hidden}
  #designForm .wtitle{background:linear-gradient(#fefefe,#e8e8e8);border-bottom:1px solid #ccc;color:#222;font-size:12px;padding:5px 10px;display:flex;justify-content:space-between;font-family:var(--sans)}
  #designForm .wtitle .btns{color:#666;font-family:var(--mono);letter-spacing:2px}
  #canvas{position:absolute;inset:26px 0 0 0}
  .ctl{position:absolute;cursor:grab;user-select:none;font-family:var(--sans)}
  .ctl:active{cursor:grabbing}
  .ctl.selctl{outline:2px dashed var(--statusbar);outline-offset:2px}
  .ctl.Button{background:linear-gradient(#fdfdfd,#e1e1e1);border:1px solid #adadad;border-radius:3px;color:#222;font-size:12.5px;padding:5px 14px}
  .ctl.TextBlock{color:#222;font-size:12.5px;padding:2px 4px}
  .ctl.TextBox{background:#fff;border:1px solid #7a7a7a;color:#444;font-size:12.5px;padding:4px 8px;min-width:110px}
  #props .prow{padding:9px 12px;border-bottom:1px solid #333;font-size:13px}
  #props label{display:block;color:var(--muted);font-size:11.5px;margin-bottom:4px;font-family:var(--mono)}
  #props input{width:100%;background:#1a1a1a;border:1px solid var(--border);color:var(--white);border-radius:4px;padding:6px 8px;font-size:13px;font-family:var(--mono)}
  #props input:focus{outline:1px solid var(--statusbar)}
  #props .hint{color:var(--muted);font-size:12.5px;padding:12px;line-height:1.5}
  .brun{display:flex;gap:10px;margin:14px 0}
  .brun button{border:none;border-radius:5px;padding:8px 18px;font-size:13.5px;cursor:pointer;font-weight:600}
  #runBtn{background:#2ea043;color:#fff}
  #runBtn:hover{background:#3fb950}
  #resetBtn{background:#3c3c3c;color:var(--white)}
  #genCodeWin pre{max-height:300px}

  /* run modal */
  #runOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  #runOverlay.show{display:flex}
  #runForm{width:360px;background:#f0f0f0;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.6);overflow:hidden}
  #runForm .wtitle{background:linear-gradient(#fefefe,#e8e8e8);border-bottom:1px solid #ccc;color:#222;font-size:12px;padding:6px 10px;display:flex;justify-content:space-between}
  #runForm .close{cursor:pointer;font-family:var(--mono);color:#333}
  #runCanvas{position:relative;height:270px}
  #msgbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60}
  #msgbox.show{display:flex}
  #msgbox .mb{background:#f0f0f0;border-radius:6px;min-width:250px;box-shadow:0 16px 44px rgba(0,0,0,.55);overflow:hidden}
  #msgbox .mb .wtitle{background:linear-gradient(#fefefe,#e8e8e8);border-bottom:1px solid #ccc;color:#222;font-size:12px;padding:6px 10px}
  #msgbox .mb .body{padding:20px 22px;color:#222;font-size:13.5px}
  #msgbox .mb .foot{padding:0 14px 14px;text-align:right}
  #msgbox .mb button{background:linear-gradient(#fdfdfd,#e1e1e1);border:1px solid #adadad;border-radius:3px;padding:4px 22px;font-size:12.5px;cursor:pointer}

  .checklist li{list-style:none;padding:9px 0 9px 32px;position:relative;color:var(--text);font-size:15px;border-bottom:1px dashed #333;line-height:1.5}
  .checklist li::before{content:"✓";position:absolute;left:4px;color:var(--good);font-weight:700}
  .objlist li{list-style:none;padding:8px 0 8px 30px;position:relative;color:var(--text);font-size:15.5px;line-height:1.5}
  .objlist li::before{content:"▸";position:absolute;left:6px;color:var(--statusbar)}
  .hero-code{margin-top:34px;max-width:560px}
  .startrow{display:flex;gap:40px;flex-wrap:wrap;margin-top:8px}
  .note{background:#332b00;border:1px solid #6b5900;border-radius:8px;padding:12px 16px;color:#e6d590;font-size:13.5px;line-height:1.5;margin-top:16px}
</style>
</head>

<template id="slides">

<!-- 1 ▸ Title -->
<section data-tab="Start" data-file="Start Page">
  <p class="eyebrow">LaGuardia Community College · MEC Department · MAC 109 — Software Studio</p>
  <h1>Introduction, IDE Setup<br>&amp; UI as C# Objects</h1>
  <p class="sub">Week 1 — This course is a <b>software development studio</b>: you start building a real, cross-platform desktop app <em>today</em> and grow it every week into your final project. One language — C# — for everything: the logic AND the interface. And the same app runs on Windows, macOS, and Linux, whatever computer you own.</p>
  <div class="startrow">
    <div>
      <p class="pill">Today you will</p>
      <ul class="objlist">
        <li>Define <b>C#</b>, <b>.NET</b>, <b>IDE</b>, and <b>Avalonia</b> in your own words</li>
        <li>Explain compilation — what happens when you press ▶ Run</li>
        <li>Navigate <b>Visual Studio Code</b> with confidence</li>
        <li>Read every line of a real GUI window — <b>written in pure C#</b></li>
        <li>Clone the starter project and build your <b>GUI shell</b> — Milestone 1 starts today</li>
        <li>Choose the <b>domain app</b> you'll build all semester</li>
      </ul>
    </div>
    <div class="codewin hero-code">
      <div class="bar"><i style="background:#f57"></i><i style="background:#fb5"></i><i style="background:#5c5"></i> MainWindow.cs</div>
      <pre>
<span class="cl"><span class="ln">1</span><span class="k">var</span><span class="p"> lbl = </span><span class="k">new</span> <span class="t">TextBlock</span><span class="p"> { </span><span class="m">Text</span><span class="p"> = </span><span class="s">"Welcome to MAC 109!"</span><span class="p"> };</span></span></pre>
    </div>
  </div>
  <p class="note">💡 <b>How to use this deck:</b> click the tabs above (like VS Code editor tabs), use the ← → arrow keys, or the Back / Next buttons in the blue status bar. Anything with a pulsing dot or a card is interactive — click it.</p>
</section>

<!-- 2 ▸ Definitions -->
<section data-tab="Definitions" data-file="Definitions.cs">
  <p class="eyebrow">01 · Clear definitions</p>
  <h2>Three words you'll use all semester</h2>
  <p class="sub">Click each card to flip it. Try to guess the definition <em>before</em> you flip — that's how memory works.</p>
  <div class="grid3">
    <div class="flip" tabindex="0" role="button" aria-label="Flip definition card: C#">
      <div class="inner">
        <div class="face front"><span class="big">C#</span><small>"C-Sharp" — the language ▸ click to flip</small></div>
        <div class="face back"><p><b>C#</b> is a modern, <b>object-oriented programming language</b> created by Microsoft. It's the set of rules and vocabulary we use to write instructions a computer can follow. It powers desktop apps, websites, games (Unity!), and mobile apps.</p></div>
      </div>
    </div>
    <div class="flip" tabindex="0" role="button" aria-label="Flip definition card: .NET">
      <div class="inner">
        <div class="face front"><span class="big">.NET</span><small>"dot-net" — the platform ▸ click to flip</small></div>
        <div class="face back"><p><b>.NET</b> is the <b>platform</b> your C# code runs on: a huge library of ready-made code (printing, math, files, windows…) plus the engine that executes your program. C# is the language; .NET is the world it lives in.</p></div>
      </div>
    </div>
    <div class="flip" tabindex="0" role="button" aria-label="Flip definition card: IDE">
      <div class="inner">
        <div class="face front"><span class="big">IDE</span><small>Integrated Development Environment ▸ click</small></div>
        <div class="face back"><p>An <b>IDE</b> is an all-in-one workshop for programmers: a smart editor, a compiler, a debugger, and version control in one app. Ours is <b>Visual Studio Code</b> plus one extension (C# Dev Kit) — free, and identical on Windows, macOS, and Linux.</p></div>
      </div>
    </div>
  </div>
  <div class="grid2" style="margin-top:18px">
    <div class="card"><span class="pill">The 4th word · Avalonia UI</span><h3>The box of GUI parts</h3><p><b>Avalonia</b> is a library of ready-made window components — <code class="inline">Window</code>, <code class="inline">Button</code>, <code class="inline">TextBox</code> — that you create and arrange <b>entirely in C# code</b>, and that draw <b>pixel-identically on every operating system</b>. So: C# is the language, .NET is the platform, VS Code is the workshop, Avalonia is the box of GUI parts.</p></div>
    <div class="card"><span class="pill">Why this stack?</span><h3>Free, professional, and yours</h3><p>Every tool is free and runs on <b>your</b> computer — Windows, Mac, or Linux, no exceptions. The same stack is used in production by teams at JetBrains and Unity, and your C# transfers straight to MAC 280 (Unity games) and MAC 286 (data structures).</p></div>
  </div>
</section>

<!-- 3 ▸ Compilation -->
<section data-tab="Compilation" data-file="HowItRuns.cs">
  <p class="eyebrow">02 · How your code actually runs</p>
  <h2>Compilation: from your words to the CPU</h2>
  <p class="sub">A computer's processor only understands <b>machine code</b> — pure numbers. Something must translate your C#. Click each stage of the pipeline to see what happens there.</p>

<section data-tab="Syntax" data-file="SyntaxRules.cs">
  <p class="eyebrow">06 · Syntax fundamentals</p>
  <h2>The four rules of C# grammar</h2>
  <div class="grid2" style="margin-bottom:20px">
    <div class="card"><span class="pill">Rule 1</span><h3>Statements end with <code class="inline">;</code></h3><p>The semicolon is C#'s period. Forgetting it is the #1 beginner error — the compiler will point at the exact line for you.</p></div>
    <div class="card"><span class="pill">Rule 2</span><h3>C# is case-sensitive</h3><p><code class="inline">TextBlock</code> is a control; <code class="inline">textBlock</code> doesn't exist. <code class="inline">Content</code> works; <code class="inline">content</code> doesn't. Capital letters matter, always.</p></div>
    <div class="card"><span class="pill">Rule 3</span><h3>Braces <code class="inline">{ }</code> group things</h3><p>They wrap a class body, a method body — and in <code class="inline">new Button { … }</code> they wrap the settings you apply while creating an object. Every <code class="inline">{</code> needs its <code class="inline">}</code>.</p></div>
    <div class="card"><span class="pill">Rule 4</span><h3>Text lives in <code class="inline">" "</code></h3><p><code class="inline">Content = "Say Hello"</code> is a string; <code class="inline">Content = Say Hello</code> is a compile error. Comments start with <code class="inline">//</code> and are ignored by the compiler.</p></div>

<section data-tab="GUI Ideas" data-file="Events.cs">
  <p class="eyebrow">08 · Developing a GUI — the concepts</p>
  <h2>What is a GUI, really?</h2>
  <p class="sub">A <b>G</b>raphical <b>U</b>ser <b>I</b>nterface is a program you operate with windows, buttons, and text boxes instead of typed commands. Three ideas make every GUI work:</p>
  <div class="grid3">
    <div class="card"><span class="pill">Idea 1 · Controls</span><h3>Building blocks</h3><p>A <b>control</b> is a reusable visual component: <code class="inline">Button</code>, <code class="inline">TextBlock</code>, <code class="inline">TextBox</code>. Each is an <b>object</b> created from an Avalonia class — your first taste of object-oriented programming.</p></div>
    <div class="card"><span class="pill">Idea 2 · Properties</span><h3>Settings of an object</h3><p>Every control has <b>properties</b> that describe it: its text, its size, its color. Set them as you create the object — <code class="inline">new Button { Content = "Say Hello" }</code> — or change them live at any time: <code class="inline">btnGreet.Content = "Clicked!";</code></p></div>
    <div class="card"><span class="pill">Idea 3 · Events</span><h3>Code that waits</h3><p>GUI programs are <b>event-driven</b>: they wait for something to happen — a <code class="inline">Click</code>, a key press — then run the <b>event handler</b> method you wrote. No click, no code.</p></div>
  </div>
  <div class="codewin" style="margin-top:18px">
    <div class="bar">The anatomy of an event handler — MainWindow.cs</div>
    <pre>
<span class="cl"><span class="ln">1</span><span class="c">// btnGreet.Click += BtnGreet_Click;   ← "when clicked, run this method"</span></span>
<span class="cl"><span class="ln">2</span><span class="k">private void</span> <span class="m">BtnGreet_Click</span><span class="p">(</span><span class="k">object</span><span class="p"> sender, </span><span class="t">RoutedEventArgs</span><span class="p"> e)</span></span>
<span class="cl"><span class="ln">3</span><span class="p">{</span></span>
<span class="cl"><span class="ln">4</span><span class="p">    lblGreeting.Text = </span><span class="s">"Hello, "</span><span class="p"> + txtName.Text + </span><span class="s">"!"</span><span class="p">;</span></span>
<span class="cl"><span class="ln">5</span><span class="p">}</span></span></pre>
  </div>
  <p class="note">🔎 Read line 4 aloud: "Set lblGreeting's Text to <i>Hello,</i> plus whatever is typed in the txtName text box." The greeting appears <b>on the window itself</b> — and the <code class="inline">+=</code> line (comment, line 1) is what connects the button to this method. You can already read GUI code. Next tab: you build one.</p>
</section>

    {h:'<span class="p">        </span><span class="m">Title</span><span class="p"> = </span><span class="s">&quot;My Studio App&quot;</span><span class="p">; </span><span class="m">Width</span><span class="p"> = </span><span class="n">500</span><span class="p">; </span><span class="m">Height</span><span class="p"> = </span><span class="n">350</span><span class="p">;</span>',
     t:'Title = "My Studio App"; Width = 500; Height = 350;',
     d:'Three properties of the window itself \u2014 the title-bar text and the size. Three statements, three semicolons. No \u201cobject dot\u201d needed because inside MainWindow, these ARE the window\u2019s own settings.'},
    {h:'<span class="p">        </span><span class="k">var</span><span class="p"> lblWelcome = </span><span class="k">new</span><span class="p"> </span><span class="t">TextBlock</span><span class="p"> { </span><span class="m">Text</span><span class="p"> = </span><span class="s">&quot;Welcome to MAC 109!&quot;</span><span class="p">, </span><span class="m">FontSize</span><span class="p"> = </span><span class="n">22</span><span class="p"> };</span>',
     t:'var lblWelcome = new TextBlock { … };',
     d:'TextBlock displays text \u2014 the GUI cousin of printing a line. \u201cvar\u201d tells the compiler \u201cyou figure out the type from the right-hand side.\u201d It\u2019s a local variable (not a field) because nothing outside the constructor needs it later.'},
    {h:'<span class="p">        </span><span class="k">var</span><span class="p"> btnGreet = </span><span class="k">new</span><span class="p"> </span><span class="t">Button</span><span class="p"> { </span><span class="m">Content</span><span class="p"> = </span><span class="s">&quot;Say Hello&quot;</span><span class="p"> };</span>',
     t:'var btnGreet = new Button { Content = "Say Hello" };',
     d:'A Button object. Careful: a Button\u2019s text lives in Content, not Text \u2014 the classic beginner trap. Same object-initializer pattern as every other control: new Type { property = value }.'},
    {h:'<span class="p">        </span><span class="p">btnGreet.</span><span class="m">Click</span><span class="p"> += </span><span class="m">BtnGreet_Click</span><span class="p">;</span>',
     t:'btnGreet.Click += BtnGreet_Click;',
     d:'The most important line in GUI programming: the event subscription. Read += as \u201cadd to the list\u201d: when btnGreet\u2019s Click event fires, run my BtnGreet_Click method. Your program stops being a top-to-bottom script and starts being a machine that WAITS for the user.'},
    {h:'<span class="p">        </span><span class="m">Content</span><span class="p"> = </span><span class="k">new</span><span class="p"> </span><span class="t">StackPanel</span><span class="p"> { </span><span class="m">Margin</span><span class="p"> = </span><span class="k">new</span><span class="p"> </span><span class="t">Thickness</span><span class="p">(</span><span class="n">20</span><span class="p">), </span><span class="m">Spacing</span><span class="p"> = </span><span class="n">12</span><span class="p">,</span>',
     t:'Content = new StackPanel { Margin = …, Spacing = 12,',
     d:'A window shows exactly ONE thing: its Content. Ours is a StackPanel \u2014 a layout container that stacks its children top-to-bottom automatically. Margin adds breathing room from the edges; Spacing sets the gap between children. Layout by container, not by dragging pixels \u2014 and it survives every resize.'},
    {h:'<span class="p">        </span><span class="p">    </span><span class="m">Children</span><span class="p"> = { lblWelcome, txtName, btnGreet, lblGreeting } };</span>',
     t:'Children = { lblWelcome, txtName, btnGreet, lblGreeting } };',
     d:'The stack\u2019s kids, in order. This one list IS your layout: reorder the names, reorder the window. Notice it mixes locals (lblWelcome, btnGreet) and fields (txtName, lblGreeting) \u2014 they\u2019re all just objects.'},
    {h:'<span class="p">    </span><span class="p">}</span>',
     t:'}',
     d:'Closes the constructor. Setup is done \u2014 the window appears, and the program now waits for events.'},
    {h:'<span class="p">    </span><span class="k">void</span><span class="p"> </span><span class="m">BtnGreet_Click</span><span class="p">(</span><span class="k">object</span><span class="p"> sender, </span><span class="t">RoutedEventArgs</span><span class="p"> e)</span>',
     t:'void BtnGreet_Click(object sender, RoutedEventArgs e)',
     d:'The event handler \u2014 the method the += line pointed at. Its shape is standard: sender (who fired the event) and e (the details). You don\u2019t memorize this line; you copy it and change the name.'},
    {h:'<span class="p">    </span><span class="p">{</span>',
     t:'{',
     d:'Opens the handler body. This code runs every single time the button is clicked \u2014 once per click, forever.'},
    {h:'<span class="p">        </span><span class="p">lblGreeting.</span><span class="m">Text</span><span class="p"> = </span><span class="s">&quot;Hello, &quot;</span><span class="p"> + txtName.</span><span class="m">Text</span><span class="p"> + </span><span class="s">&quot;!&quot;</span><span class="p">;</span>',
     t:'lblGreeting.Text = "Hello, " + txtName.Text + "!";',
     d:'The payoff, and the whole rhythm of GUI code: READ a property (txtName.Text \u2014 whatever the user typed), GLUE strings with +, WRITE a property (lblGreeting.Text). The greeting appears on the window itself. This is why txtName and lblGreeting had to be fields \u2014 the handler needed to reach them.'},
    {h:'<span class="p">    </span><span class="p">}</span>',
     t:'}',
     d:'Closes the handler.'},
    {h:'<span class="p">}</span>',
     t:'}',
     d:'Closes the MainWindow class. Count them: every { has found its }. VS Code highlights matching pairs when your cursor touches one.'}
  ];
  var explPre=document.getElementById('explCode');
  lines.forEach(function(L,i){
    var div=document.createElement('span');
    div.className='cl explain';
    div.innerHTML='<span class="ln">'+(i+1)+'</span>'+(L.h||'<span class="p"> </span>');
    div.addEventListener('click',function(){
      explPre.querySelectorAll('.cl').forEach(function(x){x.classList.remove('sel');});
      div.classList.add('sel');
      document.getElementById('explTitle').textContent='Line '+(i+1)+(L.t?' · '+L.t:'');
      document.getElementById('explText').textContent=L.d;
    });
    explPre.appendChild(div);
  });

  /* ---------- bug hunt ---------- */
  var bugLines=[
    {h:'<span class="k">public</span><span class="p"> </span><span class="m">MainWindow</span><span class="p">()</span>',bug:false,why:'Correct \u2014 a proper constructor: same name as the class, no return type.'},
    {h:'<span class="p">{</span>',bug:false,why:'Correct \u2014 an honest opening brace.'},
    {h:'<span class="p">    </span><span class="m">Title</span><span class="p"> = </span><span class="s">&quot;Bug Hunt&quot;</span><span class="p">; </span><span class="m">Width</span><span class="p"> = </span><span class="n">400</span><span class="p">;</span>',bug:false,why:'Correct \u2014 two statements, two semicolons, string in quotes.'},
    {h:'<span class="p">    </span><span class="k">var</span><span class="p"> lblTitle = </span><span class="k">new</span><span class="p"> </span><span class="t">textBlock</span><span class="p"> { </span><span class="m">Text</span><span class="p"> = </span><span class="s">&quot;Find the bugs!&quot;</span><span class="p"> };</span>',bug:true,why:'Error 1: lowercase \u201ctextBlock\u201d \u2014 C# is case-sensitive; the class is TextBlock.'},
    {h:'<span class="p">    </span><span class="k">var</span><span class="p"> txtInput = </span><span class="k">new</span><span class="p"> </span><span class="t">TextBox</span><span class="p"> { </span><span class="m">Watermark</span><span class="p"> = </span><span class="s">&quot;Type here\u2026&quot;</span><span class="p"> };</span>',bug:false,why:'Correct \u2014 a well-formed object initializer.'},
    {h:'<span class="p">    </span><span class="k">var</span><span class="p"> btnGo = </span><span class="k">new</span><span class="p"> </span><span class="t">Button</span><span class="p"> { </span><span class="m">Content</span><span class="p"> = </span><span class="p">Press me</span><span class="p"> };</span>',bug:true,why:'Error 2: Press me isn\u2019t wrapped in double quotes, so the compiler thinks it\u2019s code, not a string.'},
    {h:'<span class="p">    </span><span class="p">btnGo.</span><span class="m">Click</span><span class="p"> += </span><span class="m">BtnGo_Click</span>',bug:true,why:'Error 3: the statement is missing its semicolon at the end.'},
    {h:'<span class="p">    </span><span class="m">Content</span><span class="p"> = </span><span class="k">new</span><span class="p"> </span><span class="t">StackPanel</span><span class="p"> { </span><span class="m">Children</span><span class="p"> = { lblTitle, txtInput, btnGo } };</span>',bug:false,why:'Correct \u2014 the layout line is fine; the bugs were all above.'},
    {h:'<span class="p">}</span>',bug:false,why:'Correct \u2014 braces are balanced.'}
  ];
  var bugPre=document.getElementById('bugCode');var found=0;
  bugLines.forEach(function(L,i){
    var div=document.createElement('span');
    div.className='cl bugline';
    div.innerHTML='<span class="ln">'+(i+1)+'</span>'+L.h;
    div.addEventListener('click',function(){
      if(div.dataset.done)return;
      div.dataset.done='1';
      var tag=document.createElement('span');
      if(L.bug){
        div.classList.add('found');found++;
        document.getElementById('bugScore').textContent='Found: '+found+' / 3'+(found===3?'  🎉 You debug like a pro!':'');
        tag.className='buglabel err';tag.textContent='✗ '+L.why;
      }else{
        div.classList.add('wrongpick');
        tag.className='buglabel ok';tag.textContent='✓ '+L.why;
      }
      div.appendChild(tag);
    });
    bugPre.appendChild(div);
  });

  /* ---------- quiz ---------- */
  var quiz=[
    {q:'Which statement best describes the relationship between C# and .NET?',
     opts:['They are two names for the same thing','C# is the language you write; .NET is the platform and library your code runs on','.NET is the language; C# is the editor','C# only works on Windows computers'],
     a:1,why:'C# is the vocabulary and grammar; .NET supplies the runtime engine and thousands of pre-built classes \u2014 and it runs on Windows, macOS, and Linux alike.'},
    {q:'Your classmate has a MacBook; you have a Windows laptop. You both clone the same starter project. What happens?',
     opts:['Only the Windows copy runs \u2014 Macs need a virtual machine','Each must rewrite the GUI for their own system','Both build and run the identical app \u2014 .NET compiles to universal IL and Avalonia draws the same UI on every OS','It runs on Mac only if the Mac has Windows installed'],
     a:2,why:'That\u2019s the whole point of our stack: the compiler produces universal IL, the .NET runtime translates it for each CPU, and Avalonia draws the interface identically everywhere.'},
    {q:'In var b = new Button { Content = "Say Hello" };, what does the { } part do?',
     opts:['It defines a new class','It sets the object\u2019s properties at the moment it is created \u2014 an object initializer','It is a comment','It makes the button invisible'],
     a:1,why:'new Button creates the object; the braces immediately fill in its settings. One line: create + configure. You\u2019ll use this pattern for every control all semester.'},
    {q:'Which line correctly creates a button?',
     opts:['var b = new button { Content = &quot;Hi&quot; };','var b = new Button { Content = Hi };','var b = new Button { Content = &quot;Hi&quot; }','var b = new Button { Content = &quot;Hi&quot; };'],
     a:3,why:'It needs the capital-B Button (case matters), quotes around the string, and a semicolon at the end. Each other option breaks exactly one rule from this tab.'},
    {q:'The code inside BtnGreet_Click runs\u2026',
     opts:['Automatically when the program starts','Once per second','Only when the user clicks the button whose Click attribute names it','Never \u2014 it\u2019s just a comment'],
     a:2,why:'GUI apps are event-driven: handlers wait for their event. No click, no execution. That\u2019s the core difference from top-to-bottom console programs.'}
  ];
  var host=document.getElementById('quizHost');var score=0,answered=0;
  quiz.forEach(function(Q,qi){
    var box=document.createElement('div');box.className='q';
    var h=document.createElement('h3');h.textContent=(qi+1)+'. '+Q.q;box.appendChild(h);
    var why=document.createElement('p');why.className='why';why.textContent=Q.why;
    Q.opts.forEach(function(o,oi){
      var b=document.createElement('button');b.className='opt';b.textContent=o;
      b.addEventListener('click',function(){
        if(box.dataset.done)return;box.dataset.done='1';answered++;
        box.querySelectorAll('.opt').forEach(function(x,xi){
          x.disabled=true;
          if(xi===Q.a)x.classList.add('right');
        });
        if(oi===Q.a){score++;}else{b.classList.add('wrong');}
        why.classList.add('show');
        document.getElementById('quizScore').textContent='Score: '+score+' / '+quiz.length+(answered===quiz.length?(score===quiz.length?'  🏆 Perfect!':'  — review the explanations above, then move on.'):'');
      });
      box.appendChild(b);
    });
    box.appendChild(why);host.appendChild(box);
  });

  /* ================= GUI BUILDER ================= */
  var canvas=document.getElementById('canvas');
  var propBody=document.getElementById('propBody');
  var genCode=document.getElementById('genCode');
  var controls=[];var counts={Button:0,TextBlock:0,TextBox:0};var selected=null;var nextY=14;

  var defaults={Button:'button',TextBlock:'text',TextBox:''};
  var prefix={Button:'btnButton',TextBlock:'lblText',TextBox:'txtInput'};

  function addControl(type){
    counts[type]++;
    var c={type:type,name:prefix[type]+counts[type],
           text:type==='TextBox'?'':defaults[type]+counts[type],
           x:24+((controls.length%3)*10),y:nextY,el:null};
    nextY=Math.min(nextY+42,190);
    var el=document.createElement('div');
    el.className='ctl '+type;el.tabIndex=0;
    el.style.left=c.x+'px';el.style.top=c.y+'px';
    c.el=el;controls.push(c);
    canvas.appendChild(el);
    paint(c);select(c);
    attachDrag(c);
    el.addEventListener('mousedown',function(){select(c);});
    el.addEventListener('touchstart',function(){select(c);},{passive:true});
  }
  function paint(c){
    c.el.textContent=c.type==='TextBox'?(c.text||''):c.text;
    if(c.type==='TextBox'&&!c.text)c.el.innerHTML='&nbsp;';
  }
  function select(c){
    selected=c;
    controls.forEach(function(x){x.el.classList.toggle('selctl',x===c);});
    renderProps();
  }
  function renderProps(){
    if(!selected){propBody.innerHTML='<div class="hint">Select a control on the form to edit its properties.</div>';return;}
    propBody.innerHTML=
      '<div class="prow"><label>(Name)</label><input id="pName" value="'+esc(selected.name)+'"></div>'+
      '<div class="prow"><label>'+(selected.type==='Button'?'Content':'Text')+'</label><input id="pText" value="'+esc(selected.text)+'"></div>'+
      '<div class="prow" style="color:var(--muted);font-size:12px;line-height:1.5">Type: <b style="color:var(--type)">'+selected.type+'</b><br>Location: ('+Math.round(selected.x)+', '+Math.round(selected.y)+')</div>'+
      '<div class="prow"><button id="pDel" style="width:100%;background:#5a1d1d;color:#ffb4a5;border:1px solid #7a2a2a;border-radius:5px;padding:7px;cursor:pointer;font-size:12.5px">Delete control</button></div>';
    document.getElementById('pText').addEventListener('input',function(e){selected.text=e.target.value;paint(selected);regen();});
    document.getElementById('pName').addEventListener('input',function(e){selected.name=e.target.value.replace(/[^A-Za-z0-9_]/g,'')||selected.name;regen();});
    document.getElementById('pDel').addEventListener('click',function(){
      canvas.removeChild(selected.el);
      controls=controls.filter(function(x){return x!==selected;});
      selected=null;renderProps();regen();
    });
  }
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

  function attachDrag(c){
    var sx,sy,ox,oy,drag=false;
    function down(e){
      drag=true;
      var p=e.touches?e.touches[0]:e;
      sx=p.clientX;sy=p.clientY;ox=c.x;oy=c.y;
      e.preventDefault();
    }
    function move(e){
      if(!drag)return;
      var p=e.touches?e.touches[0]:e;
      c.x=Math.max(0,Math.min(canvas.clientWidth-40,ox+(p.clientX-sx)));
      c.y=Math.max(0,Math.min(canvas.clientHeight-26,oy+(p.clientY-sy)));
      c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';
    }
    function up(){if(drag){drag=false;regen();if(selected===c)renderProps();}}
    c.el.addEventListener('mousedown',down);
    c.el.addEventListener('touchstart',down,{passive:false});
    document.addEventListener('mousemove',move);
    document.addEventListener('touchmove',move,{passive:false});
    document.addEventListener('mouseup',up);
    document.addEventListener('touchend',up);
  }

  function line(html){return '<span class="cl">'+html+'</span>';}
  function regen(){
    var out=[];
    out.push(line('<span class="c">// MainWindow.cs \u2014 the C# this design describes</span>'));
    if(controls.length){
      var btn=firstButton(),txt=firstTextBox(),tb=firstTextBlock();
      controls.forEach(function(c){
        var bits='<span class="k">var</span><span class="p"> '+c.name+' = </span><span class="k">new</span> <span class="t">'+c.type+'</span><span class="p"> { </span>';
        if(c.type==='Button'){bits+='<span class="m">Content</span><span class="p"> = </span><span class="s">"'+esc(c.text)+'"</span>';}
        else if(c.type==='TextBlock'){bits+='<span class="m">Text</span><span class="p"> = </span><span class="s">"'+esc(c.text)+'"</span>';}
        else{bits+='<span class="m">Watermark</span><span class="p"> = </span><span class="s">"Type here\u2026"</span>';}
        bits+='<span class="p"> };</span>';
        out.push(line(bits));
      });
      if(btn){
        out.push(line('<span class="p"> </span>'));
        out.push(line('<span class="p">'+btn.name+'.</span><span class="m">Click</span><span class="p"> += </span><span class="m">'+btn.name+'_Click</span><span class="p">;</span>  <span class="c">// when clicked, run the method below</span>'));
      }
      out.push(line('<span class="p"> </span>'));
      var ordered=controls.slice().sort(function(a,b){return a.y-b.y;});
      var names=ordered.map(function(c){return c.name;}).join(', ');
      out.push(line('<span class="m">Content</span><span class="p"> = </span><span class="k">new</span> <span class="t">StackPanel</span><span class="p"> { </span><span class="m">Margin</span><span class="p"> = </span><span class="k">new</span> <span class="t">Thickness</span><span class="p">(</span><span class="n">20</span><span class="p">), </span><span class="m">Spacing</span><span class="p"> = </span><span class="n">12</span><span class="p">,</span>'));
      out.push(line('<span class="p">    </span><span class="m">Children</span><span class="p"> = { '+names+' } };</span>  <span class="c">// top-to-bottom order \u2014 drag to change it!</span>'));
      if(btn){
        out.push(line('<span class="p"> </span>'));
        out.push(line('<span class="k">void</span> <span class="m">'+btn.name+'_Click</span><span class="p">(</span><span class="k">object</span><span class="p"> sender, </span><span class="t">RoutedEventArgs</span><span class="p"> e)</span>'));
        out.push(line('<span class="p">{</span>'));
        if(tb&&txt){
          out.push(line('<span class="p">    '+tb.name+'.</span><span class="m">Text</span><span class="p"> = </span><span class="s">"Hello, "</span><span class="p"> + '+txt.name+'.</span><span class="m">Text</span><span class="p"> + </span><span class="s">"!"</span><span class="p">;</span>'));
        }else if(tb){
          out.push(line('<span class="p">    '+tb.name+'.</span><span class="m">Text</span><span class="p"> = </span><span class="s">"You clicked '+esc(btn.text)+'!"</span><span class="p">;</span>'));
        }else{
          out.push(line('<span class="c">    // add a TextBlock so the app has somewhere to answer</span>'));
        }
        out.push(line('<span class="p">}</span>'));
      }
    }else{
      out.push(line('<span class="c">// (empty window \u2014 add controls from the Toolbox)</span>'));
    }
    genCode.innerHTML=out.join('');
  }
  function firstButton(){for(var i=0;i<controls.length;i++)if(controls[i].type==='Button')return controls[i];return null;}
  function firstTextBox(){for(var i=0;i<controls.length;i++)if(controls[i].type==='TextBox')return controls[i];return null;}
  function firstTextBlock(){for(var i=0;i<controls.length;i++)if(controls[i].type==='TextBlock')return controls[i];return null;}

  stage.querySelectorAll('.toolitem').forEach(function(t){
    t.addEventListener('click',function(){addControl(t.dataset.add);regen();});
  });
  document.getElementById('resetBtn').addEventListener('click',function(){
    controls.forEach(function(c){canvas.removeChild(c.el);});
    controls=[];counts={Button:0,TextBlock:0,TextBox:0};selected=null;nextY=14;
    renderProps();regen();
  });

  /* ---- run mode ---- */
  var overlay=document.getElementById('runOverlay');
  var runCanvas=document.getElementById('runCanvas');
  var msgbox=document.getElementById('msgbox');
  document.getElementById('runBtn').addEventListener('click',function(){
    runCanvas.innerHTML='';
    var inputs={},liveEls={};
    controls.forEach(function(c){
      var el;
      if(c.type==='TextBox'){
        el=document.createElement('input');
        el.className='ctl TextBox';el.value=c.text;
        el.style.cursor='text';inputs[c.name]=el;
      }else{
        el=document.createElement('div');
        el.className='ctl '+c.type;el.textContent=c.text;
        el.style.cursor=c.type==='Button'?'pointer':'default';
      }
      liveEls[c.name]=el;
      el.style.left=c.x+'px';el.style.top=c.y+'px';el.style.position='absolute';
      if(c.type==='Button'){
        el.addEventListener('click',function(){
          var txt=firstTextBox(),tb=firstTextBlock();
          var msg=txt&&inputs[txt.name]?('Hello, '+(inputs[txt.name].value||'friend')+'!'):('You clicked '+c.text+'!');
          if(tb&&liveEls[tb.name]){liveEls[tb.name].textContent=msg;}
          else{document.getElementById('msgText').textContent=msg;msgbox.classList.add('show');}
        });
      }
      runCanvas.appendChild(el);
    });
    document.getElementById('runFormTitle').textContent=document.getElementById('designTitle').textContent;
    overlay.classList.add('show');
  });
  document.getElementById('closeRun').addEventListener('click',function(){overlay.classList.remove('show');});
  document.getElementById('msgOk').addEventListener('click',function(){msgbox.classList.remove('show');});

  /* ---------- boot ---------- */
  regen();
  slides[0].classList.add('active');
  tabs[0].classList.add('active');
  prevBtn.disabled=true;
  document.getElementById('lncol').textContent='Slide 1 of '+slides.length+' · '+secs[0].dataset.file;
})();
</script>
