<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAC 109 · Week 2: Input, Output &amp; Casting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1220; --surface:#181c2e; --surface2:#222840; --border:#2f3654;
    --ink:#eef0f8; --ink2:#c3c9dd; --muted:#9098b4;
    --brand:#6d63ff; --brand2:#a45cff; --brand-soft:#2a2d55; --brand-ink:#c9c5ff;
    --good:#22c58b; --good-soft:#12352b; --bad:#f06a60; --bad-soft:#3d1f23; --warn:#f5b83d; --warn-soft:#352b12;
    --code-bg:#0a0d18; --code-bar:#151a2c; --code-border:#2a3150; --code-text:#e6e9f2; --code-ln:#5b627a;
    --kw:#7aa2f7; --type:#2ac3de; --str:#e0af68; --com:#7f8aa8; --met:#c0caf5; --num:#ff9e64; --hl:#2c3350; --pin:#3b4a7a;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace;
    --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:var(--sans)}
  b{font-weight:700}

  /* ---------- app frame ---------- */
  #app{display:flex;flex-direction:column;height:100vh}
  #top{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:10px 22px;flex:0 0 auto}
  #top .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  #top .ttl{font-weight:700;font-size:15px}
  #top .ttl small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
  #top .right{margin-left:auto;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:14px}
  #progressWrap{width:140px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
  #progressBar{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}

  #tabstrip{background:var(--surface);display:flex;overflow-x:auto;flex:0 0 auto;border-bottom:1px solid var(--border);padding:0 14px;scrollbar-width:thin;gap:2px}
  .tab{background:transparent;color:var(--ink2);border:none;border-bottom:3px solid transparent;padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
  .tab:hover{color:var(--brand-ink)}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}
  .tab.active .dot{background:var(--brand)}
  .tab.done .dot{background:var(--good)}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:6px}

  #stage{flex:1 1 auto;overflow:hidden;position:relative}
  .slide{position:absolute;inset:0;overflow-y:auto;padding:34px max(40px,calc((100% - 1180px)/2)) 110px;display:none;animation:slidein .3s ease}
  .slide.active{display:block}
  .cl .src{white-space:pre;flex:1 1 auto}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.slide{animation:none}*{transition:none!important}}

  #bottom{background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 22px;flex:0 0 auto}
  #bottom button{background:var(--brand);color:#fff;border:none;padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600}
  #bottom button.ghost{background:var(--surface2);color:var(--ink)}
  #bottom button:hover{filter:brightness(1.07)}
  #bottom button:disabled{opacity:.35;cursor:default;filter:none}
  #bottom .where{color:var(--muted);font-size:13px;margin-left:6px}
  #bottom .grow{flex:1}
  #bottom .hint{color:var(--muted);font-size:12.5px}
  @media(max-width:700px){#bottom .hint,#top .right,#top .ttl small,.codewin .bar .tag,.codewin .bar .dots{display:none}#top .ttl{font-size:13.5px}#top{padding:8px 14px}#bottom{padding:8px 14px}.cl .ln{width:34px;padding-right:10px}.codewin pre{font-size:12.5px}}

  /* ---------- typography & cards ---------- */
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:10px;font-weight:600}
  h1{font-size:clamp(30px,4.2vw,46px);font-weight:800;line-height:1.12;margin-bottom:14px;letter-spacing:-.02em}
  h2{font-size:clamp(24px,3vw,32px);font-weight:800;margin-bottom:6px;letter-spacing:-.015em}
  h3{font-size:17px;font-weight:700}
  .sub{color:var(--ink2);max-width:76ch;font-size:16.5px;margin-bottom:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr}}
  @media(max-width:860px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.slide{padding:22px 16px 110px}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .card p{color:var(--ink2);font-size:15px;margin-top:8px}
  .pill{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--brand-soft);color:var(--brand-ink);border-radius:20px;padding:3px 11px;margin-bottom:10px;font-weight:600}
  .pill.g{background:var(--good-soft);color:#7ff0c3}.pill.w{background:var(--warn-soft);color:#fcd67a}.pill.r{background:var(--bad-soft);color:#ffb3ac}
  code.inline{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:.88em;color:var(--brand-ink)}
  .note{background:var(--warn-soft);border:1px solid #5c4a1a;border-radius:12px;padding:12px 16px;color:#fbe3a6;font-size:14px;margin-top:16px}
  .tip{background:var(--good-soft);border:1px solid #235e4a;border-radius:12px;padding:12px 16px;color:#bff5dd;font-size:14px;margin-top:16px}
  .rule{display:flex;gap:14px;align-items:flex-start}
  .rule .num{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--mono)}
  .objlist li{list-style:none;padding:7px 0 7px 30px;position:relative;font-size:15.5px}
  .objlist li::before{content:"▸";position:absolute;left:8px;color:var(--brand);font-weight:700}
  .checklist li{list-style:none;padding:9px 0 9px 32px;position:relative;font-size:15px;border-bottom:1px dashed var(--border)}
  .checklist li::before{content:"✓";position:absolute;left:4px;color:var(--good);font-weight:800}
  .kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:12.5px}

  /* ---------- hover-explain code examples ---------- */
  .ex{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;align-items:start;margin:16px 0 26px}
  @media(max-width:900px){.ex{grid-template-columns:1fr}}
  .codewin{background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius);overflow:hidden;box-shadow:0 14px 34px rgba(27,31,46,.18)}
  .codewin .bar{background:var(--code-bar);padding:9px 14px;font-family:var(--mono);font-size:12px;color:#aab1c8;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--code-border)}
  .codewin .bar .dots i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}
  .codewin .bar .fname{font-weight:700;color:#e6e9f2}
  .codewin .bar .tag{font-size:10.5px;background:#2f3650;color:#c0caf5;border-radius:20px;padding:2px 9px;font-family:var(--sans);font-weight:600}
  .codewin .bar .btns{margin-left:auto;display:flex;gap:6px}
  .codewin .bar button{background:#2f3650;border:1px solid #3d4661;color:#e6e9f2;border-radius:7px;padding:3px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
  .codewin .bar button:hover{background:#3b4463}
  .codewin .bar button.run{background:var(--good);border-color:var(--good);color:#fff}
  .codewin pre{padding:10px 0 12px;font-family:var(--mono);font-size:14px;line-height:1.7;overflow-x:auto;color:var(--code-text)}
  .cl{display:flex;padding:0 14px 0 0;white-space:pre;border-left:3px solid transparent;cursor:default}
  .cl .ln{width:44px;color:var(--code-ln);text-align:right;padding-right:16px;flex:0 0 auto;user-select:none}
  .cl.explain{cursor:pointer}
  .cl.explain:hover,.cl.explain.hot{background:var(--hl);border-left-color:var(--brand)}
  .cl.explain.pinned{background:var(--pin);border-left-color:#ffd166}
  .cl.explain:focus-visible{outline:none;background:var(--hl);border-left-color:var(--brand)}
  .k{color:var(--kw)}.t{color:var(--type)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.m{color:var(--met)}.n{color:var(--num)}.p{color:var(--code-text)}

  .explain-panel{position:sticky;top:6px}
  .expl{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--brand);border-radius:var(--radius);padding:16px 18px;min-height:150px;box-shadow:var(--shadow);transition:border-color .2s}
  .expl.pinned{border-left-color:#e0a800}
  .expl .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .expl .lbl .pinbadge{display:none;background:var(--warn-soft);color:#fcd67a;border-radius:20px;padding:1px 8px;letter-spacing:0;text-transform:none;font-family:var(--sans);font-weight:600}
  .expl.pinned .lbl .pinbadge{display:inline-block}
  .expl .codeq{font-family:var(--mono);font-size:13px;color:var(--brand-ink);background:var(--brand-soft);border-radius:8px;padding:6px 10px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
  .expl .why{font-size:15.5px;color:var(--ink);line-height:1.65}
  .expl .why b{color:var(--brand-ink)}
  .expl .why code{font-family:var(--mono);font-size:12.8px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--brand-ink)}
  .expl.idle .codeq{display:none}
  .expl.idle .why{color:var(--muted)}
  .term{background:#0e1017;border:1px solid #2a2f44;border-radius:var(--radius);padding:12px 16px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.8;color:#d8dcea;margin-top:12px;min-height:82px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
  .term .thead{font-size:10.5px;letter-spacing:.12em;color:#6b7390;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
  .term .tline{white-space:pre-wrap}
  .term .tline.typing{animation:pop .25s ease}
  .term .placeholder{color:#5f6785;font-style:italic}
  .term .prompt{color:#6b7390}
  @keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .exnote{font-size:14px;color:var(--ink2);margin:-12px 0 20px 4px}

  /* ---------- flip cards ---------- */
  .flip{perspective:900px;cursor:pointer;min-height:170px}
  .flip .inner{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
  .flip.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--border);padding:20px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
  .face.front{background:var(--surface)}
  .face.front .big{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--brand-ink)}
  .face.front small{color:var(--muted);margin-top:8px;font-size:12.5px}
  .face.back{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;transform:rotateY(180deg);border:none}
  .face.back p{font-size:14px;line-height:1.55}

  /* ---------- pipeline ---------- */
  .pipe{display:flex;align-items:stretch;flex-wrap:wrap;margin:18px 0 14px;gap:0}
  .pnode{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:center;flex:1;min-width:120px;cursor:pointer;box-shadow:var(--shadow)}
  .pnode b{display:block;font-size:14px}
  .pnode span{color:var(--muted);font-size:12px}
  .pnode:hover,.pnode.hot{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .parrow{display:flex;align-items:center;color:var(--brand);font-size:22px;padding:0 8px}

  /* ---------- bug hunt ---------- */
  .cl.bugline{cursor:pointer}
  .cl.bugline:hover{background:var(--hl)}
  .cl.bugline.found{background:#3a1f22;border-left-color:var(--bad)}
  .cl.bugline.wrongpick{background:#1e3a2c;border-left-color:var(--good)}
  .buglabel{margin-left:14px;font-family:var(--sans);font-size:12px;border-radius:5px;padding:1px 8px;white-space:normal}
  .buglabel.err{background:var(--bad);color:#fff}
  .buglabel.ok{background:var(--good);color:#fff}

  /* ---------- quiz ---------- */
  .q{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .q h3{margin-bottom:12px;font-size:16px}
  .q .opt{display:block;width:100%;text-align:left;background:var(--surface2);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:14.5px;font-family:var(--sans)}
  .q .opt code{font-family:var(--mono);font-size:13px}
  .q .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .q .opt.right{border-color:var(--good);background:var(--good-soft);color:#bff5dd;font-weight:600}
  .q .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#ffc9c4}
  .q .why{margin-top:10px;font-size:13.5px;color:var(--ink2);display:none}
  .q .why.show{display:block}
  #quizScore{font-family:var(--mono);color:var(--brand-ink);font-size:15px;margin-top:6px;font-weight:600}

  /* ---------- bridge table ---------- */
  .bridge{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:14px}
  .bridge th{background:var(--surface2);text-align:left;padding:11px 14px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .bridge td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top}
  .bridge td code{font-family:var(--mono);font-size:12.8px;background:var(--surface2);border-radius:6px;padding:2px 7px;color:var(--brand-ink);white-space:nowrap}
  .bridge td.arrow{color:var(--brand);font-weight:800;text-align:center;width:40px}
  .cheat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:1000px){.cheat{grid-template-columns:1fr 1fr}}
  @media(max-width:700px){.cheat{grid-template-columns:1fr}}
  .cheat .card{padding:14px 16px}
  .cheat .card h3{font-size:14px;margin-bottom:6px}
  .cheat .card code{display:block;font-family:var(--mono);font-size:12.5px;color:var(--brand-ink);background:var(--brand-soft);border-radius:8px;padding:8px 10px;white-space:pre-wrap;margin-top:6px}
  .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
  @media(max-width:900px){.hero{grid-template-columns:1fr}}

  .grad{background:linear-gradient(90deg,#8b83ff,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent}
  code.inline.big-inline{font-size:.8em;padding:2px 8px}
  .hero{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:start}
  @media(max-width:900px){.hero{grid-template-columns:1fr}}
  .score{font-family:var(--mono);color:var(--brand-ink);font-weight:600}
  /* IPO */
  .ipo{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:8px 0 16px}
  .ipo-box{flex:1;min-width:200px;border-radius:16px;padding:18px;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .ipo-box:hover,.ipo-box.hot{transform:translateY(-3px)}
  .ipo-box .ico{font-size:30px;margin-bottom:4px}
  .ipo-box b{display:block;font-size:18px;letter-spacing:.08em}
  .ipo-box span{display:block;color:var(--ink2);font-size:13.5px;margin:2px 0 8px}
  .ipo-box code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border-radius:8px;padding:4px 8px;color:var(--code-text);display:inline-block}
  .ipo-box.in{border-top:4px solid #2ac3de}.ipo-box.in.hot{box-shadow:0 0 0 3px rgba(42,195,222,.35)}
  .ipo-box.pr{border-top:4px solid #f5b83d}.ipo-box.pr.hot{box-shadow:0 0 0 3px rgba(245,184,61,.35)}
  .ipo-box.out{border-top:4px solid #22c58b}.ipo-box.out.hot{box-shadow:0 0 0 3px rgba(34,197,139,.35)}
  .ipo-arrow{display:flex;align-items:center;font-size:28px;color:var(--brand);padding:0 12px}
  @media(max-width:860px){.ipo-arrow{width:100%;justify-content:center;transform:rotate(90deg);padding:4px 0}}
  /* ladder */
  .ladder{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:4px 0 18px}
  .rung{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-family:var(--mono);font-weight:700;color:var(--brand-ink);text-align:center;box-shadow:var(--shadow)}
  .rung:nth-child(1){font-size:13px}.rung:nth-child(3){font-size:15px}.rung:nth-child(5){font-size:17px}.rung:nth-child(7){font-size:19px}
  .ladnote{flex-basis:100%;color:var(--muted);font-size:13px;margin-top:4px}.rung:nth-child(9){font-size:19px}
  .rung small{display:block;font-family:var(--sans);font-weight:500;color:var(--muted);font-size:11px}
  .rarrow{color:var(--good);font-weight:800;font-size:20px}
  /* mini tables & code blocks */
  table.mini{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  table.mini td{padding:6px 8px;border-top:1px solid var(--border);color:var(--ink2)}
  table.mini td:first-child{white-space:nowrap}
  table.mini code,code.block,.bridge td code{font-family:var(--mono);font-size:12.8px;background:var(--surface2);border-radius:6px;padding:2px 7px;color:var(--brand-ink)}
  code.block{display:block;white-space:pre;padding:8px 10px;margin-top:8px;overflow-x:auto}
  .q h3 code,.q .opt code,.expl .why code,.fwhy code{font-family:var(--mono);font-size:.88em;background:var(--surface2);border-radius:5px;padding:0 5px;color:var(--brand-ink)}
  /* terminal (live) */
  .term .tbody{min-height:40px}
  .term .tsample{margin-top:10px;padding-top:8px;border-top:1px dashed #2a2f44;font-family:var(--sans);font-size:12px;color:#8a92ad}
  .term .tsample code{font-family:var(--mono);color:#e0af68;background:#1a1e2e;border-radius:5px;padding:1px 6px}
  .term .tsample span{color:#6b7390}
  .tin{background:transparent;border:none;border-bottom:1px dashed #6d63ff;color:#7ee7ff;font-family:var(--mono);font-size:13.5px;outline:none;min-width:120px;width:45%;padding:0 2px;caret-color:#7ee7ff}
  .tin::placeholder{color:#4d5575;font-style:italic}
  .techo{color:#7ee7ff;font-weight:600}
  .terr{color:#ff8a80;font-weight:600;white-space:pre-wrap}
  .tdone{color:#5f6785;font-style:italic;font-family:var(--sans);font-size:12px;margin-top:4px}
  .tdone.bad{color:#ff8a80;font-style:normal}
  .term .tline{white-space:pre-wrap;tab-size:8;min-height:1.8em}
  /* window mockup */
  .wm-cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:6px}
  .wm{background:#f3f4f8;border:1px solid #b8bdcf;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.35);overflow:hidden;max-width:300px}

<template id="slides">

<!-- Start -->
<section data-tab="Start">
  <p class="eyebrow">Week 2 · Lecture</p>
  <h1>Input, Output &amp; Casting:<br>teaching your program to <span class="grad">talk and listen</span></h1>
  <div class="hero">
    <div>
      <p class="sub">Last week your programs could only <b>talk</b>: they printed the same thing every time. Today they learn to <b>listen</b>. You'll ask the user questions, read their answers, turn text into numbers, and print results that look professional. That's the exact skill a GUI needs: every TextBox is input, and every label is output.</p>
      <p class="pill">By the end of today you can</p>
      <ul class="objlist">
        <li>Explain the <b>Input → Process → Output</b> model that every program and every app follows</li>
        <li>Print polished output with <code class="inline">Write</code>, <code class="inline">WriteLine</code>, escape sequences, and formats like <code class="inline">:F2</code></li>
        <li>Read what the user types with <code class="inline">Console.ReadLine()</code>, and know why it's always a <b>string</b></li>
        <li>Turn text into numbers with <code class="inline">int.Parse</code>, <code class="inline">double.Parse</code>, <code class="inline">decimal.Parse</code>, and back with <code class="inline">ToString()</code></li>
        <li><b>Cast</b> between number types, and predict when data gets chopped or wrapped</li>
        <li>Read input safely with <code class="inline">int.TryParse</code>, so your program never crashes</li>
      </ul>
      <div class="tip">⌨️ <b>New this week:</b> the terminals are <b>live</b>. Press <b>▶ Run</b>, and when the program asks a question, <b>type your answer and press Enter</b>, just like a real console. Press Enter on an empty line to use the sample answer. Try weird answers too: that's how you learn what crashes.</div>
    </div>
    <div>
      <div class="card">
        <span class="pill g">Quick recap · Week 1</span>
        <h3>You already know…</h3>
        <p>✔ the program suit: <code class="inline">using System;</code> · <code class="inline">class Program</code> · <code class="inline">static void Main()</code><br>
        ✔ <code class="inline">Console.WriteLine("…");</code> prints a line<br>
        ✔ variables have a <b>type</b>: <code class="inline">int</code>, <code class="inline">double</code>, <code class="inline">decimal</code>, <code class="inline">string</code>, <code class="inline">bool</code>…<br>
        ✔ <code class="inline">"25" + 1</code> is <code class="inline">"251"</code> (text glues!)<br>
        ✔ <code class="inline">7 / 2</code> is <code class="inline">3</code> (int division!)</p>
      </div>
      <div class="card" style="margin-top:14px">
        <span class="pill">Today's 3 keywords</span>
        <p><b>Input</b>: data coming <i>into</i> the program (the keyboard).<br><b>Output</b>: data going <i>out</i> (the screen).<br><b>Casting</b>: changing a value from one type to another.</p>
      </div>
    </div>
  </div>
</section>

<!-- IPO -->
<section data-tab="Big Idea">
  <p class="eyebrow">01 · The big idea</p>
  <h2>Every program does three things: <span class="grad">Input → Process → Output</span></h2>
  <p class="sub">An ATM reads your PIN and amount (<b>input</b>), checks your balance (<b>process</b>), and gives you cash plus a receipt (<b>output</b>). A calculator, a game, Instagram: all the same three steps. Click each box.</p>
  <div class="ipo" id="ipo">
    <div class="ipo-box in" data-i="0"><div class="ico">⌨️</div><b>INPUT</b><span>the user types</span><code>Console.ReadLine()</code></div>
    <div class="ipo-arrow">→</div>
    <div class="ipo-box pr" data-i="1"><div class="ico">⚙️</div><b>PROCESS</b><span>convert + calculate</span><code>int.Parse(…) · (int)x · a + b</code></div>
    <div class="ipo-arrow">→</div>
    <div class="ipo-box out" data-i="2"><div class="ico">🖥️</div><b>OUTPUT</b><span>show the result</span><code>Console.WriteLine(…)</code></div>
  </div>
  <div class="expl" id="ipoInfo"><div class="lbl">Click a box ↑</div><div class="why" id="ipoText">Every program today follows these three steps, and so will every window you build this semester.</div></div>
  <h3 style="margin:26px 0 10px">Four words to own today (flip the cards)</h3>
  <div class="grid4">
    <div class="flip" tabindex="0" role="button" aria-label="Flip: Input"><div class="inner">
      <div class="face front"><span class="big">Input</span><small>▸ click to flip</small></div>
      <div class="face back"><p><b>Input</b> is any data that enters your program while it runs. Today: text typed on the keyboard. Next week: text typed into a TextBox.</p></div></div></div>
    <div class="flip" tabindex="0" role="button" aria-label="Flip: Output"><div class="inner">
      <div class="face front"><span class="big">Output</span><small>▸ click to flip</small></div>
      <div class="face back"><p><b>Output</b> is any data your program shows or sends out. Today: text in the terminal. Next week: text on a label in your window.</p></div></div></div>
    <div class="flip" tabindex="0" role="button" aria-label="Flip: Parsing"><div class="inner">
      <div class="face front"><span class="big">Parsing</span><small>▸ click to flip</small></div>
      <div class="face back"><p><b>Parsing</b> means reading text and building the value it describes: the text <b>"25"</b> becomes the number <b>25</b>. Tool: <code>int.Parse</code>.</p></div></div></div>
    <div class="flip" tabindex="0" role="button" aria-label="Flip: Casting"><div class="inner">
      <div class="face front"><span class="big">Casting</span><small>▸ click to flip</small></div>
      <div class="face back"><p><b>Casting</b> changes a value from one number type to another: the double <b>3.9</b> becomes the int <b>3</b>. Syntax: <code>(int)x</code>.</p></div></div></div>
  </div>
</section>

<!-- Output -->
<section data-tab="Output">
  <p class="eyebrow">02 · Output: making your program talk nicely</p>
  <h2>Output: <code class="inline big-inline">Write</code>, <code class="inline big-inline">WriteLine</code>, special characters &amp; number formats</h2>
  <p class="sub">You know <code class="inline">Console.WriteLine</code>. Now let's make output <b>look good</b>: stay on one line, add tabs and quotes, and show money as <b>$4.50</b> instead of <b>4.5</b>. Hover each line, then press ▶ Run.</p>
  <div class="ex" data-ex="output"></div>
  <div class="grid2">
    <div class="card"><span class="pill">Escape sequences</span><h3>Special characters inside " "</h3>
      <table class="mini"><tr><td><code>\n</code></td><td>new line</td></tr><tr><td><code>\t</code></td><td>tab (jump to next column)</td></tr><tr><td><code>\"</code></td><td>a quote mark inside text</td></tr><tr><td><code>\\</code></td><td>one backslash</td></tr></table></div>
    <div class="card"><span class="pill">Number formats</span><h3>Put a format after a colon: <code class="inline">{x:F2}</code></h3>
      <table class="mini"><tr><td><code>{x:F2}</code></td><td>4.5 → <b>4.50</b> (2 decimals)</td></tr><tr><td><code>{x:F0}</code></td><td>1234.56 → <b>1235</b> (rounded)</td></tr><tr><td><code>{x:N2}</code></td><td>1234.56 → <b>1,234.56</b></td></tr><tr><td><code>x.ToString("F2")</code></td><td>same as {x:F2}, outside a $-string</td></tr></table></div>
  </div>
  <div class="tip">🧪 <b>Try it:</b> copy the program into VS Code and change <code class="inline">F2</code> to <code class="inline">F4</code>, then add a line <code class="inline">Console.WriteLine("A\tB\tC");</code>. Predict first, then run.</div>
</section>

<!-- Input -->
<section data-tab="Input">
  <p class="eyebrow">03 · Input: making your program listen</p>
  <h2><code class="inline big-inline">Console.ReadLine()</code>: wait, listen, give back a <span class="grad">string</span></h2>
  <p class="sub">ReadLine does three things: it <b>pauses</b> the program, <b>waits</b> for the user to type and press Enter, then <b>gives back</b> everything they typed as a <b>string</b>. Press ▶ Run below and <b>have a conversation</b> with your program.</p>
  <div class="ex" data-ex="readline"></div>
  <div class="grid3">
    <div class="card"><span class="pill">The pattern</span><h3>Prompt, then read</h3><code class="block">Console.Write("Question? ");
string answer = Console.ReadLine();</code><p>Always ask first. A blinking cursor with no question confuses users.</p></div>
    <div class="card"><span class="pill g">Why Write, not WriteLine?</span><h3>Keep the cursor on the line</h3><p>With <code class="inline">Write</code> the user types right next to the question: <i>What is your name? Maria</i>. With WriteLine they'd type on the line below. Both work; Write looks nicer.</p></div>
    <div class="card"><span class="pill w">VS Code warning?</span><h3>A squiggle is not an error</h3><p>VS Code may underline <code class="inline">Console.ReadLine()</code> with "possible null value". It's a <b>warning</b>, and the program still runs. (ReadLine returns null only if input is closed.) Optional silencer: <code class="inline">Console.ReadLine() ?? ""</code></p></div>
  </div>
  <div class="note">⚠️ <b>Running in VS Code:</b> press <span class="kbd">F5</span> or use <b>Run ▸ Start Debugging</b>. If typing doesn't work in the Debug Console, open <b>Terminal ▸ New Terminal</b> and run it there. Most online C# compilers have an <b>input/stdin</b> box: type all answers there, one per line, <i>before</i> running.</div>
</section>

<!-- Parse -->
<section data-tab="Text → Number">
  <p class="eyebrow">04 · Reading numbers</p>
  <h2>The #1 input problem: <span class="grad">"19" is not 19</span></h2>
  <p class="sub">When a user types <b>19</b>, ReadLine hands you the <b>text</b> "19": two characters, like letters in a word. You can't do math with text. <b>Parse</b> reads the text and builds the real number. Run it with your age, then run it again and type <b>abc</b>.</p>
  <div class="ex" data-ex="parse"></div>
  <div class="grid2" style="margin-bottom:22px">
    <div class="card"><span class="pill">The Parse family</span><h3>One Parse per type</h3>
      <table class="mini"><tr><td><code>int.Parse("25")</code></td><td>→ 25</td></tr><tr><td><code>double.Parse("3.75")</code></td><td>→ 3.75</td></tr><tr><td><code>decimal.Parse("19.99")</code></td><td>→ 19.99 (money)</td></tr><tr><td><code>bool.Parse("true")</code></td><td>→ true</td></tr><tr><td><code>char.Parse("A")</code></td><td>→ 'A'</td></tr></table></div>
    <div class="card"><span class="pill r">💥 When Parse crashes</span><h3>An <i>exception</i></h3><p>If the text isn't a valid number (<i>abc</i>, <i>twenty</i>, an empty line, or <i>3.5</i> for int.Parse), the program stops with a <b>FormatException</b>: C#'s way of saying "I can't build a number from that." A crash is not a disaster; it's a message. Read it, then fix the input or use <b>TryParse</b> (two tabs ahead).</p></div>
  </div>
  <h3 style="margin-bottom:4px">Read two numbers, calculate everything</h3>
  <p class="sub" style="margin-bottom:6px">The one-line pattern you'll type most this semester: <code class="inline">double a = double.Parse(Console.ReadLine());</code> Read it <b>inside out</b>: read text → parse it → store it.</p>
  <div class="ex" data-ex="calc"></div>
</section>

<!-- Casting -->
<section data-tab="Casting">
  <p class="eyebrow">05 · Casting between number types</p>
  <h2>Casting: moving a value into a <span class="grad">different-sized box</span></h2>
  <p class="sub">Each number type is a box of a certain size. Moving a value into a <b>bigger</b> box is always safe, so C# does it for you (<b>implicit</b>). Moving into a <b>smaller</b> box might not fit, so you must write a <b>cast</b> (<b>explicit</b>): the type name in parentheses, like <code class="inline">(int)</code>.</p>
  <div class="ladder" aria-label="Safe widening order">
    <div class="rung">byte<small>1 B</small></div><div class="rarrow">→</div>
    <div class="rung">int<small>4 B</small></div><div class="rarrow">→</div>
    <div class="rung">long<small>8 B</small></div><div class="rarrow">→</div>
    <div class="rung">double<small>8 B · decimals</small></div>
    <span class="ladnote">Left to right = automatic. A double's <i>range</i> is far bigger than a long's, so it sits at the end. (decimal is its own island: int and long go in automatically, but double ↔ decimal always needs a cast.)</span>
  </div>
  <div class="grid2" style="margin-bottom:6px">
    <div class="card"><span class="pill g">→ Implicit (automatic)</span><p>Follow the arrows <b>left to right</b> and C# converts for you: <code class="inline">double d = 10;</code> · <code class="inline">long big = someInt;</code>. Nothing can be lost. (<code class="inline">char</code> → <code class="inline">int</code> is automatic too, and int → decimal.)</p></div>
    <div class="card"><span class="pill w">← Explicit (a cast)</span><p>Going <b>right to left</b> needs a cast: <code class="inline">int i = (int)9.99;</code> gives <b>9</b>. The decimals are <b>chopped</b>, not rounded. And if the number is too big for the box, it <b>wraps around</b>.</p></div>
  </div>
  <div class="ex" data-ex="cast"></div>
  <h3 style="margin-bottom:4px">Casting inside math: the two classic surprises</h3>
  <p class="sub" style="margin-bottom:6px">Surprise 1: the right side of <code class="inline">=</code> is computed first, <i>on its own</i>. Surprise 2: <code class="inline">byte + byte</code> is an <code class="inline">int</code>. Hover lines 10–24.</p>
  <div class="ex" data-ex="castmath"></div>
</section>

<!-- Convert -->
<section data-tab="Convert">
  <p class="eyebrow">06 · Parse, Convert, ToString: which tool when?</p>
  <h2>Casting is for numbers. <span class="grad">Text needs different tools.</span></h2>
  <p class="sub">You can't cast text: <code class="inline">(int)"42"</code> is a compile error, because a string isn't a number of a different size; it's a different <i>kind</i> of thing. For text you use <b>Parse</b> or <b>Convert</b> going in, and <b>ToString()</b> going out.</p>
  <div class="ex" data-ex="convert"></div>
  <h3 style="margin:6px 0 10px">🔎 Conversion Finder: pick any two types</h3>
  <div class="finder card">
    <div class="frow">
      <label>From <select id="fromT"></select></label>
      <span class="farrow">→</span>
      <label>To <select id="toT"></select></label>
    </div>
    <div class="fres"><span class="fbadge" id="fBadge"></span><code class="fcode" id="fCode"></code><div class="fwhy" id="fWhy"></div></div>
  </div>
  <table class="bridge" style="margin-top:16px">
    <thead><tr><th>You have…</th><th>You want…</th><th>Use</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td>text (string)</td><td>a number</td><td><b>Parse</b> / Convert</td><td><code>int.Parse(text)</code></td></tr>
      <tr><td>text from a user</td><td>a number, safely</td><td><b>TryParse</b></td><td><code>int.TryParse(text, out int n)</code></td></tr>
      <tr><td>any value</td><td>text</td><td><b>ToString()</b></td><td><code>total.ToString("F2")</code></td></tr>
      <tr><td>a small number type</td><td>a bigger one</td><td>nothing (implicit)</td><td><code>double d = count;</code></td></tr>
      <tr><td>a bigger number type</td><td>a smaller one</td><td>a <b>cast</b></td><td><code>(int)average</code></td></tr>
      <tr><td>a double</td><td>a <i>rounded</i> int</td><td><b>Convert</b> / Math.Round</td><td><code>Convert.ToInt32(3.7)</code> → 4</td></tr>
    </tbody>
  </table>
</section>

<!-- TryParse -->
<section data-tab="Safe Input">
  <p class="eyebrow">07 · Safe input</p>
  <h2><code class="inline big-inline">int.TryParse</code>: the Parse that <span class="grad">never crashes</span></h2>
  <p class="sub">Users make typos. Real apps can't crash every time someone types "twenty". <b>TryParse</b> <i>tries</i> the conversion and tells you honestly whether it worked, as a <b>bool</b>. Run it with <b>21</b>, then with <b>abc</b>, then with an empty line.</p>
  <div class="ex" data-ex="tryparse"></div>
  <div class="grid3">
    <div class="card"><span class="pill">Parse</span><h3>Trusts the input</h3><p>Great when the text is guaranteed to be a number (you wrote it yourself). Crashes on bad input.</p></div>
    <div class="card"><span class="pill g">TryParse</span><h3>Checks the input</h3><p>Returns <code class="inline">true</code>/<code class="inline">false</code>, never crashes. The number comes out through <code class="inline">out int number</code>, or 0 if it failed.</p></div>
    <div class="card"><span class="pill w">Coming soon</span><h3>+ if = friendly apps</h3><p><code class="inline">if (success) { … } else { … }</code> lets you print "Please type a number" instead of garbage. That's the decisions lecture.</p></div>
  </div>
</section>

<!-- Practice -->
<section data-tab="★ Practice Apps">
  <p class="eyebrow">08 · Put it all together</p>
  <h2>Three complete <span class="grad">Input → Process → Output</span> apps</h2>
  <p class="sub">Each program is labeled with <code class="inline">// INPUT</code>, <code class="inline">// PROCESS</code>, <code class="inline">// OUTPUT</code>. Run each one here, then copy it into VS Code and complete the challenge below it.</p>
  <h3 class="apph">🌡️ App 1 · Temperature Converter</h3>
  <div class="ex" data-ex="temp"></div>
  <p class="challenge">🎯 <b>Challenge:</b> add a second conversion: Celsius → Fahrenheit, using <code class="inline">f = c * 9 / 5 + 32</code>. Ask for the Celsius value with its own prompt.</p>
  <h3 class="apph">🍽️ App 2 · Tip Calculator</h3>
  <div class="ex" data-ex="tip"></div>
  <p class="challenge">🎯 <b>Challenge:</b> also print the tip each person pays. Then run it and type <b>0</b> people. What happens, and why?</p>
  <h3 class="apph">📝 App 3 · Grade Average</h3>
  <div class="ex" data-ex="grades"></div>
  <p class="challenge">🎯 <b>Challenge:</b> change <code class="inline">sum / 3.0</code> to <code class="inline">sum / 3</code> and run with 85, 92, 88. Explain the new output in one sentence. Then add a 4th exam.</p>
</section>

<!-- Bug Hunt -->
<section data-tab="Bug Hunt">
  <p class="eyebrow">09 · Find the type bugs</p>
  <h2>🐞 Bug hunt: 4 input &amp; conversion errors</h2>
  <p class="sub" style="margin-bottom:10px">This program won't compile. Every bug is about <b>types</b>: text vs numbers, big box vs small box. Hover to read each line, <b>click</b> the broken ones. <span id="bugScore" class="score">Found: 0 / 4</span></p>
  <div class="ex">
    <div class="codewin"><div class="bar"><span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span><span class="fname">Program.cs</span><span class="tag">4 errors hiding</span></div><pre id="bugCode"></pre></div>

function CsCrash(type,msg){this.type=type;this.msg=msg;}
var cs={
  fmtErr:function(s){return new CsCrash('System.FormatException',"The input string '"+s+"' was not in a correct format.");},
  intParse:function(s){
    var t=String(s).trim();
    if(!/^[+-]?\d+$/.test(t))throw cs.fmtErr(s);
    var v=Number(t);
    if(v>2147483647||v<-2147483648)throw new CsCrash('System.OverflowException','Value was either too large or too small for an Int32.');
    return v;
  },
  dblParse:function(s){
    var t=String(s).trim();
    if(!/^[+-]?(\d[\d,]*(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/.test(t))throw cs.fmtErr(s);
    return Number(t.replace(/,/g,''));
  },
  decParse:function(s){
    var t=String(s).trim();
    if(!/^[+-]?(\d[\d,]*(\.\d*)?|\.\d+)$/.test(t))throw cs.fmtErr(s);
    return Number(t.replace(/,/g,''));
  },
  tryInt:function(s){try{return [true,cs.intParse(s)];}catch(e){return [false,0];}},
  i32:function(x){return x|0;},
  d:function(x){ /* default double.ToString() in .NET 8 */
    if(!isFinite(x))return isNaN(x)?'NaN':(x>0?'\u221e':'-\u221e');
    if(x===0)return '0';
    var a=Math.abs(x);
    if(a>=1e15||a<1e-5){var e=x.toExponential().split('e');var ex=parseInt(e[1],10);return e[0]+'E'+(ex<0?'-':'+')+(Math.abs(ex)<10?'0':'')+Math.abs(ex);}
    return String(x);
  },
  F:function(x,n){return isFinite(x)?x.toFixed(n):cs.d(x);},
  N:function(x,n){return isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:n,maximumFractionDigits:n}):cs.d(x);},
  M:function(x,n){var p=Math.pow(10,n);return (Math.sign(x)*Math.round(Math.abs(x)*p+1e-7)/p).toFixed(n);}, /* decimal: round half away from zero */
  b:function(v){return v?'True':'False';}
};

/* default explanations for the fixed "suit" lines */
function defaultNote(line){
  var t=line.trim();
  if(t==='')return 'A blank line. The compiler ignores it; it\u2019s a paragraph break for humans.';
  if(t==='using System;')return 'The toolbox line: gives this file access to <b>System</b>, where Console, Convert and Math live.';
  if(t==='class Program')return 'The container class. Every C# program lives inside a class.';
  if(t==='static void Main()')return 'The starting point: execution begins here and runs top to bottom.';
  if(t==='{')return 'Opens a block. Every { needs its matching }.';
  if(t==='}')return 'Closes a block: the partner of an earlier {.';
  if(/^\/\//.test(t))return 'A comment: a note for humans. The compiler skips it.';
  return null;
}

(function(){
  "use strict";

  /* ---------- syntax highlighter ---------- */
  var KW=/^(using|class|static|void|int|double|string|bool|var|new|return|public|private|true|false|if|else|char|decimal|float|long|byte|out)$/;
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function hl(line){
    var out='',i=0,n=line.length;
    while(i<n){
      var ch=line[i];
      if(ch==='/'&&line[i+1]==='/'){out+='<span class="c">'+esc(line.slice(i))+'</span>';break;}
      if(ch==='"'||(ch==='$'&&line[i+1]==='"')){
        var j=i+(ch==='$'?2:1);
        while(j<n&&line[j]!=='"'){if(line[j]==='\\')j++;j++;}
        j++;out+='<span class="s">'+esc(line.slice(i,j))+'</span>';i=j;continue;
      }
      if(ch==="'"){var q=line.indexOf("'",i+1);if(q>i){out+='<span class="s">'+esc(line.slice(i,q+1))+'</span>';i=q+1;continue;}}
      if(/[A-Za-z_]/.test(ch)){
        var j2=i;while(j2<n&&/[A-Za-z0-9_]/.test(line[j2]))j2++;
        var w=line.slice(i,j2);
        var after=/^\s*\(/.test(line.slice(j2));
        var before=/new\s+$/.test(line.slice(0,i));
        var cls=KW.test(w)?'k':before?'t':after?'m':/^[A-Z]/.test(w)?'t':'p';
        out+='<span class="'+cls+'">'+esc(w)+'</span>';i=j2;continue;
      }
      if(/[0-9]/.test(ch)){var j3=i;while(j3<n&&/[0-9.m]/.test(line[j3]))j3++;out+='<span class="n">'+line.slice(i,j3)+'</span>';i=j3;continue;}
      out+=esc(ch);i++;
    }
    return out;
  }

  /* ---------- live terminal ---------- */
  function Terminal(host,samples){
    this.host=host;this.samples=samples||[];this.token=0;
    host.innerHTML='<div class="thead"><span>▶ RUN → TERMINAL</span><span class="prompt">'+(this.samples.length?'type answers + Enter':'output')+'</span></div><div class="tbody"><div class="placeholder">Press ▶ Run to start the program.'+(this.samples.length?' It will ask you questions: type in here!':' Predict the output first!')+'</div></div>'+
      (this.samples.length?'<div class="tsample">Sample answers: '+this.samples.map(function(s){return '<code>'+esc(s)+'</code>';}).join(' · ')+' <span>(press Enter on an empty line to use them)</span></div>':'');
    this.body=host.querySelector('.tbody');
  }
  Terminal.prototype.reset=function(){this.token++;this.body.innerHTML='';this.cur=null;this.newLine();this.si=0;return this.token;};
  Terminal.prototype.newLine=function(){var d=document.createElement('div');d.className='tline typing';this.body.appendChild(d);this.cur=d;};
  Terminal.prototype.write=function(s){
    var parts=String(s).split('\n');
    for(var i=0;i<parts.length;i++){
      if(i>0)this.newLine();
      if(parts[i])this.cur.appendChild(document.createTextNode(parts[i]));
    }
  };
  Terminal.prototype.readLine=function(tok){
    var self=this;var sample=this.samples[this.si++]||'';
    return new Promise(function(resolve){
      var inp=document.createElement('input');inp.className='tin';inp.type='text';inp.spellcheck=false;inp.autocomplete='off';
      inp.placeholder=sample;inp.setAttribute('aria-label','Type your answer and press Enter');
      self.cur.appendChild(inp);
      try{inp.focus({preventScroll:true});}catch(e){inp.focus();}
      inp.addEventListener('keydown',function(e){
        if(e.key!=='Enter')return;
        e.preventDefault();e.stopPropagation();
        if(tok!==self.token)return;
        var v=inp.value===''?sample:inp.value;
        var sp=document.createElement('span');sp.className='techo';sp.textContent=v;
        inp.replaceWith(sp);self.newLine();resolve(v);
      });
    });
  };
  Terminal.prototype.crash=function(err){
    if(this.cur&&!this.cur.textContent&&!this.cur.children.length)this.cur.remove();
    var d=document.createElement('div');d.className='tline terr';
    d.textContent='Unhandled exception. '+err.type+': '+err.msg;this.body.appendChild(d);
    var h=document.createElement('div');h.className='tline tdone bad';h.textContent='💥 The program crashed and stopped here. Every line after the crash never ran.';this.body.appendChild(h);
  };
  Terminal.prototype.done=function(){
    if(this.cur&&!this.cur.textContent&&!this.cur.children.length)this.cur.remove();
    var d=document.createElement('div');d.className='tline tdone';d.textContent='✔ program finished';this.body.appendChild(d);
  };

  /* ---------- hover-explain example ---------- */
  function buildExample(host,key){
    var ex=EX[key];var code=CODE[key];var lines=code.split('\n');
    var win=document.createElement('div');win.className='codewin';
    var bar=document.createElement('div');bar.className='bar';
    bar.innerHTML='<span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span><span class="fname">'+esc(ex.file)+'</span><span class="tag">'+esc(ex.tag)+'</span><span class="btns"></span>';
    var btns=bar.querySelector('.btns');
    var copy=document.createElement('button');copy.type='button';copy.textContent='Copy';btns.appendChild(copy);
    var run=null;if(ex.sim){run=document.createElement('button');run.type='button';run.className='run';run.textContent='▶ Run';btns.appendChild(run);}
    win.appendChild(bar);var pre=document.createElement('pre');win.appendChild(pre);

    var panel=document.createElement('div');panel.className='explain-panel';
    var expl=document.createElement('div');expl.className='expl idle';
    expl.innerHTML='<div class="lbl"><span>Explanation</span><span class="pinbadge">📌 pinned: click again to unpin</span></div><div class="codeq"></div><div class="why">Hover any line of the code to read what it does. Click a line to pin it.</div>';
    panel.appendChild(expl);
    var codeq=expl.querySelector('.codeq'),why=expl.querySelector('.why'),lbl=expl.querySelector('.lbl span');

    var term=null;
    if(ex.sim){var th=document.createElement('div');th.className='term';panel.appendChild(th);term=new Terminal(th,ex.samples);}
    else if(ex.window){
      var w=ex.window,rows='';
      w.rows.forEach(function(r){
        if(r[0]==='textbox')rows+='<div class="wm-tb">'+esc(r[1])+'</div>';
        if(r[0]==='button')rows+='<div><span class="wm-btn">'+esc(r[1])+'</span></div>';
        if(r[0]==='label')rows+='<div class="wm-lbl">'+esc(r[1])+'</div>';
      });
      var wm=document.createElement('div');wm.style.marginTop='12px';
      wm.innerHTML='<div class="wm-cap">▶ RUN → A WINDOW (after typing and clicking)</div><div class="wm"><div class="wm-title"><span>'+esc(w.title)+'</span><span>— ▢ ✕</span></div><div class="wm-body">'+rows+'</div></div>';
      panel.appendChild(wm);
    }

    var pinned=null,rowEls=[];
    function note(i){return ex.notes[i+1]||defaultNote(lines[i])||'';}
    function show(i){expl.classList.remove('idle');lbl.textContent='Line '+(i+1);codeq.textContent=lines[i].trim()||'(blank line)';why.innerHTML=note(i);}
    function idle(){if(pinned!==null){show(pinned);return;}expl.classList.add('idle');lbl.textContent='Explanation';why.innerHTML='Hover any line of the code to read what it does. Click a line to pin it.';}
    lines.forEach(function(L,i){
      var row=document.createElement('span');row.className='cl explain';row.tabIndex=0;row.setAttribute('role','button');
      row.setAttribute('aria-label','Line '+(i+1)+': '+(L.trim()||'blank'));
      row.innerHTML='<span class="ln">'+(i+1)+'</span><span class="src">'+(hl(L)||' ')+'</span>';
      row.addEventListener('mouseenter',function(){if(pinned===null){rowEls.forEach(function(r){r.classList.remove('hot');});row.classList.add('hot');show(i);}});
      row.addEventListener('mouseleave',function(){if(pinned===null){row.classList.remove('hot');idle();}});
      row.addEventListener('focus',function(){if(pinned===null)show(i);});
      row.addEventListener('click',function(){
        if(pinned===i){pinned=null;row.classList.remove('pinned');expl.classList.remove('pinned');show(i);return;}
        rowEls.forEach(function(r){r.classList.remove('pinned','hot');});
        pinned=i;row.classList.add('pinned');expl.classList.add('pinned');show(i);
      });
      row.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();}});
      pre.appendChild(row);rowEls.push(row);
    });

    copy.addEventListener('click',function(){
      function ok(){copy.textContent='Copied ✓';setTimeout(function(){copy.textContent='Copy';},1600);}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(ok,ok);}
      else{var ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);ok();}
    });
    if(run){
      run.addEventListener('click',function(){
        var tok=term.reset();run.textContent='↻ Restart';
        var io={write:function(s){if(tok===term.token)term.write(s);},writeLine:function(s){if(tok===term.token)term.write((s===undefined?'':s)+'\n');},readLine:function(){return term.readLine(tok);}};
        ex.sim(io).then(function(){if(tok===term.token){term.done();run.textContent='↻ Run again';}},
          function(err){if(tok!==term.token)return;if(err instanceof CsCrash){term.crash(err);}else{term.crash({type:'Error',msg:String(err)});}run.textContent='↻ Run again';});
      });
    }
    host.appendChild(win);host.appendChild(panel);
  }

  /* ---------- slides & tabs ---------- */
  var tpl=document.getElementById('slides'),stage=document.getElementById('stage'),strip=document.getElementById('tabstrip');
  var secs=tpl.content.querySelectorAll('section'),slides=[],tabs=[],visited={};
  secs.forEach(function(sec,i){
    var s=sec.cloneNode(true);s.classList.add('slide');stage.appendChild(s);slides.push(s);
    var t=document.createElement('button');t.className='tab';t.type='button';t.innerHTML='<span class="dot"></span>'+sec.dataset.tab;
    t.addEventListener('click',function(){go(i);});strip.appendChild(t);tabs.push(t);
  });
  stage.querySelectorAll('.ex[data-ex]').forEach(function(h){buildExample(h,h.dataset.ex);});
  var cur=0,prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
  function go(i){
    if(i<0||i>=slides.length)return;
    slides[cur].classList.remove('active');tabs[cur].classList.remove('active');
    if(visited[cur])tabs[cur].classList.add('done');visited[cur]=true;cur=i;
    slides[cur].classList.add('active');tabs[cur].classList.add('active');
    tabs[cur].scrollIntoView({inline:'nearest',block:'nearest'});slides[cur].scrollTop=0;
    prevBtn.disabled=(cur===0);nextBtn.disabled=(cur===slides.length-1);
    document.getElementById('progressBar').style.width=(cur/(slides.length-1)*100)+'%';
    document.getElementById('where').textContent=(cur+1)+' / '+slides.length+' · '+secs[cur].dataset.tab;
  }
  prevBtn.addEventListener('click',function(){go(cur-1);});nextBtn.addEventListener('click',function(){go(cur+1);});
  document.addEventListener('keydown',function(e){
    var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
    if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);
  });

  /* ---------- flip cards ---------- */
  stage.querySelectorAll('.flip').forEach(function(f){
    function tog(){f.classList.toggle('flipped');}
    f.addEventListener('click',tog);f.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tog();}});
  });

  /* ---------- IPO boxes ---------- */
  var ipoInfo=[
    '<b>INPUT</b>: data flows <i>into</i> the program. In the console: <code>Console.ReadLine()</code> waits for the user to type and press Enter. It <b>always</b> gives you a <b>string</b>, even when the user types digits. Next week: <code>txtName.Text</code> from a TextBox.',
    '<b>PROCESS</b>: the program works on the data. Step one is usually <b>converting</b> the text into the right type (<code>int.Parse</code>, casting). Step two is the actual work: math, gluing text, decisions. The user never sees this part.',
    '<b>OUTPUT</b>: results flow <i>out</i>. In the console: <code>Console.WriteLine</code>, formatted nicely with <code>:F2</code>. Next week: <code>lblResult.Text = …</code> puts the result on a label in your window.'
  ];
  var ipoBoxes=stage.querySelectorAll('#ipo .ipo-box');
  ipoBoxes.forEach(function(b){
    function sel(){ipoBoxes.forEach(function(x){x.classList.remove('hot');});b.classList.add('hot');document.getElementById('ipoText').innerHTML=ipoInfo[+b.dataset.i];}
    b.addEventListener('click',sel);b.addEventListener('mouseenter',sel);
  });

  /* ---------- Conversion Finder ---------- */
  var T=['string','int','double','decimal','long','byte','char','bool'];
  var SAMPLE={int:'65',double:'65.7',decimal:'65.7m',long:'65L',byte:'65',char:"'A'",bool:'true'};
  var SVAL={int:65,double:65.7,decimal:65.7,long:65,byte:65,char:65,bool:true};
  var STXT={int:'"65"',double:'"65.7"',decimal:'"65.7"',long:'"65"',byte:'"65"',char:'"A"',bool:'"true"'};
  var VAR={string:'text',int:'n',double:'d',decimal:'m',long:'big',byte:'small',char:'c',bool:'flag'};
  var IMPLICIT={byte:['int','long','double','decimal'],int:['long','double','decimal'],long:['double','decimal'],char:['int','long','double','decimal']};
  var CONVM={int:'ToInt32',double:'ToDouble',decimal:'ToDecimal',long:'ToInt64',byte:'ToByte',char:'ToChar',bool:'ToBoolean',string:'ToString'};
  function show(v,t){
    if(t==='char')return "'"+String.fromCharCode(v)+"'";
    if(t==='bool')return v?'true':'false';
    if(t==='string')return '"'+v+'"';
    return String(v);
  }
  function finder(){
    var f=document.getElementById('fromT').value,t=document.getElementById('toT').value;
    var badge=document.getElementById('fBadge'),codeEl=document.getElementById('fCode'),whyEl=document.getElementById('fWhy');
    var decl=(f==='string'?'string text = '+STXT[t==='string'?'int':t]:f+' '+VAR[f]+' = '+SAMPLE[f])+';';
    var src=VAR[f],b,c,w;
    if(f===t){b=['same','g','No conversion needed'];c=decl;w='It is already the type you want.';}
    else if(f==='string'){
      b=['parse','','Parse (text → '+t+')'];c=decl+'\n'+t+' '+VAR[t]+' = '+t+'.Parse(text);';
      var val=t==='char'?"'A'":t==='bool'?'true':STXT[t].replace(/"/g,'');
      w='Text can’t be cast. <b>'+t+'.Parse</b> reads the text and builds the value: <b>'+val+'</b>. It crashes if the text is invalid; for user input prefer <b>'+t+'.TryParse</b>'+(t==='bool'||t==='char'?'':'')+'.';
    }
    else if(t==='string'){b=['tostring','','ToString()'];c=decl+'\nstring text = '+src+'.ToString();';w='Every value can turn itself into text with <b>.ToString()</b>. Result: <b>'+(f==='bool'?'"True"':f==='char'?'"A"':'"'+(f==='double'||f==='decimal'?'65.7':'65')+'"')+'</b>'+(f==='bool'?' (capital T when converted to text).':'.');}
    else if(f==='bool'||t==='bool'){
      if(f==='char'||t==='char'){b=['none','r','Not possible'];c=decl+'\n// no conversion between char and bool';w='There is no meaningful conversion between a character and true/false. A cast won\u2019t compile, and Convert.ToBoolean(c) / Convert.ToChar(flag) compile but <b>crash</b> at runtime with an InvalidCastException.';}
      else if(f==='bool'){b=['convert','w','Convert only (no cast)'];c=decl+'\n'+t+' '+VAR[t]+' = Convert.'+CONVM[t]+'(flag);';w='You can’t cast a bool to a number in C#. <b>Convert</b> maps true → <b>1</b>, false → <b>0</b>.';}
      else {b=['convert','w','Convert only (no cast)'];c=decl+'\nbool flag = Convert.ToBoolean('+src+');';w='You can’t cast a number to bool. <b>Convert.ToBoolean</b> gives <b>false</b> for 0 and <b>true</b> for anything else (here: true). Clearer alternative: <code>'+src+' != 0</code>.';}
    }
    else if(IMPLICIT[f]&&IMPLICIT[f].indexOf(t)>=0){
      b=['implicit','g','Implicit: automatic'];c=decl+'\n'+t+' '+VAR[t]+' = '+src+';';
      w='A <b>'+t+'</b> can hold every possible <b>'+f+'</b> value, so nothing can be lost and C# converts automatically. Result: <b>'+(f==='char'?'65':'65')+'</b>'+(f==='char'?' (the character code of \'A\').':'.');
    }
    else {
      var v=SVAL[f],r=Math.trunc(v);
      b=['cast','w','Explicit: needs a cast'];c=decl+'\n'+t+' '+VAR[t]+' = ('+t+')'+src+';';
      var res=(t==='double'||t==='decimal')?String(v):show(r,t);
      w='A <b>'+t+'</b> can’t hold every <b>'+f+'</b> value'+((f==='double'||f==='decimal')&&t!=='double'&&t!=='decimal'?' (decimals get <b>chopped</b>)':'')+', so C# requires a cast: <b>('+t+')</b>. Result: <b>'+res+'</b>.'+(t==='byte'?' Values over 255 would wrap around.':'')+(t==='char'?' The number becomes the character with that code.':'')+(f==='double'&&t==='decimal'?' (double → decimal needs a cast because their precision rules differ.)':'');
    }
    badge.textContent=b[2];badge.className='fbadge '+b[1];codeEl.innerHTML=c.split('\n').map(hl).join('\n');whyEl.innerHTML=w;
  }
  var fromS=document.getElementById('fromT'),toS=document.getElementById('toT');
  T.forEach(function(t){fromS.add(new Option(t,t));toS.add(new Option(t,t));});
  fromS.value='string';toS.value='int';
  fromS.addEventListener('change',finder);toS.addEventListener('change',finder);finder();

  /* ---------- bug hunt ---------- */
  var BUG={7:[true,'<b>Bug:</b> ReadLine takes <b>no arguments</b>; it can’t print a question. The compiler says <i>No overload for method \'ReadLine\' takes 1 arguments</i>. Fix: a separate <code>Console.Write("Your name? ");</code> first, then <code>Console.ReadLine()</code>.'],
    9:[true,'<b>Bug:</b> ReadLine returns a <b>string</b>, but tickets is an <b>int</b> box. <i>Cannot implicitly convert type \'string\' to \'int\'</i>. Fix: <code>int.Parse(Console.ReadLine())</code>.'],
    11:[false,'Correct: prompt was printed on line 10, and the text is parsed into a double.'],
    13:[true,'<b>Bug:</b> int × double gives a <b>double</b> (e.g. 37.5). Putting it in an int would lose the cents, so C# refuses: <i>Cannot implicitly convert type \'double\' to \'int\'</i>. Fix: <code>double total = …</code>'],
    14:[true,'<b>Bug:</b> a number can’t be stored in a string box. <i>Cannot implicitly convert type \'int\' to \'string\'</i>. Fix: <code>total.ToString("F2")</code>.'],
    15:[false,'Correct: gluing strings. Once the bugs above are fixed, this prints the friendly total.']};
  var bugLines=CODE.bug.split('\n'),bugPre=document.getElementById('bugCode'),bugExpl=document.getElementById('bugExpl'),found=0;
  var bq=bugExpl.querySelector('.codeq'),bw=bugExpl.querySelector('.why');
  bugLines.forEach(function(L,i){
    var info=BUG[i+1]||[false,'Correct: '+(defaultNote(L)||'this line is fine.')];
    var d=document.createElement('span');d.className='cl explain bugline';d.tabIndex=0;
    d.innerHTML='<span class="ln">'+(i+1)+'</span><span class="src">'+(hl(L)||' ')+'</span>';
    d.addEventListener('mouseenter',function(){bugExpl.classList.remove('idle');bq.textContent=L.trim()||'(blank line)';bw.innerHTML=d.dataset.done?info[1]:'Line '+(i+1)+'. Right side type? Left side box? <b>Click to decide.</b>';});
    d.addEventListener('click',function(){
      if(d.dataset.done)return;d.dataset.done='1';var tag=document.createElement('span');
      if(info[0]){d.classList.add('found');found++;document.getElementById('bugScore').textContent='Found: '+found+' / 4'+(found===4?'  🎉 Type detective!':'');tag.className='buglabel err';tag.textContent='✗ bug';}
      else{d.classList.add('wrongpick');tag.className='buglabel ok';tag.textContent='✓ fine';}
      d.querySelector('.src').appendChild(tag);bw.innerHTML=info[1];
    });
    d.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();d.click();}});
    bugPre.appendChild(d);
  });

  /* ---------- quiz ---------- */
  var quiz=[
    {q:'What type does <code>Console.ReadLine()</code> give back?',opts:['<code>int</code>','Whatever type the user typed','<code>string</code>, always','<code>char</code>'],a:2,why:'Always a string, even if the user types digits. Converting it is YOUR job (Parse / TryParse).'},
    {q:'The user types <b>5</b>. What prints? <code>string t = Console.ReadLine(); Console.WriteLine(t + 5);</code>',opts:['<code>10</code>','<code>55</code>','<code>t5</code>','A compile error'],a:1,why:'t is the text "5", so + glues: "5" + 5 → "55". Parse it first to get 10.'},
    {q:'Which line correctly reads a whole number from the user?',opts:['<code>int n = Console.ReadLine();</code>','<code>int n = (int)Console.ReadLine();</code>','<code>int n = int.Parse(Console.ReadLine());</code>','<code>int n = Console.ReadLine(int);</code>'],a:2,why:'ReadLine gives a string; int.Parse turns it into an int. You can’t cast text: (int)"5" is a compile error.'},
    {q:'Why do we usually prompt with <code>Console.Write</code> instead of <code>WriteLine</code>?',opts:['Write is faster','So the user types on the same line as the question','WriteLine can’t print questions','ReadLine only works after Write'],a:1,why:'Write leaves the cursor right after the prompt, so the answer appears next to the question. Both work; Write just looks nicer.'},
    {q:'What does <code>$"{4.5:F2}"</code> produce?',opts:['<code>4.5</code>','<code>4.50</code>','<code>5</code>','<code>4.5F2</code>'],a:1,why:':F2 = fixed-point with 2 decimals. It changes only how the number looks.'},
    {q:'What is stored? <code>int x = (int)8.9;</code>',opts:['<code>9</code>','<code>8</code>','<code>8.9</code>','A compile error'],a:1,why:'Casting to int chops off the decimals (truncation). It never rounds. Use Convert.ToInt32 or Math.Round to get 9.'},
    {q:'Which line compiles WITHOUT a cast?',opts:['<code>int i = 3.5;</code>','<code>byte b = someInt;</code>','<code>double d = 10;</code>','<code>int i = someLong;</code>'],a:2,why:'int → double is widening (small box → big box), so it’s implicit. The others go from a bigger type into a smaller one and need a cast.'},
    {q:'<code>double avg = 9 / 2;</code> What is avg?',opts:['<code>4.5</code>','<code>4</code>','<code>5</code>','<code>4.0</code> printed as 4.5'],a:1,why:'The right side is computed first as int / int = 4. Only then is 4 stored in the double. Fix: (double)9 / 2 or 9 / 2.0.'},
    {q:'<code>byte a = 10, b = 20;</code> Why does <code>byte sum = a + b;</code> fail?',opts:['10 + 20 is too big for a byte','a + b produces an <code>int</code>, and int → byte needs a cast','bytes can’t be added','sum is a reserved word'],a:1,why:'C# widens bytes to int before adding, so the result type is int. Storing an int in a byte needs (byte)(a + b), or just use int sum.'},
    {q:'The user types <b>abc</b> into <code>int.Parse(Console.ReadLine())</code>. What happens?',opts:['n becomes 0','n becomes -1','The program crashes with a FormatException','The compiler catches it'],a:2,why:'Parse can’t build a number from letters, so it throws a FormatException at runtime. The compiler can’t know what the user will type.'},
    {q:'<code>bool ok = int.TryParse("abc", out int n);</code> What are ok and n?',opts:['ok = true, n = 0','ok = false, n = 0','It crashes','ok = false, n = "abc"'],a:1,why:'TryParse never crashes: it returns false and sets n to 0. That’s why real apps use it for user input.'},
    {q:'Next week: <code>txtAge</code> is a TextBox. What type is <code>txtAge.Text</code>?',opts:['<code>int</code>','<code>string</code>, so you need <code>int.Parse(txtAge.Text)</code>','<code>TextBox</code>','It depends on what the user typed'],a:1,why:'Exactly like ReadLine: a TextBox’s Text is always a string. Today’s Parse skills transfer directly.'}
  ];
  var host=document.getElementById('quizHost'),score=0,answered=0;
  quiz.forEach(function(Q,qi){
    var box=document.createElement('div');box.className='q';
    var h=document.createElement('h3');h.innerHTML=(qi+1)+'. '+Q.q;box.appendChild(h);
    var why=document.createElement('p');why.className='why';why.innerHTML=Q.why;
    Q.opts.forEach(function(o,oi){
      var b=document.createElement('button');b.className='opt';b.type='button';b.innerHTML=o;
      b.addEventListener('click',function(){
        if(box.dataset.done)return;box.dataset.done='1';answered++;
        box.querySelectorAll('.opt').forEach(function(x,xi){x.disabled=true;if(xi===Q.a)x.classList.add('right');});
        if(oi===Q.a)score++;else b.classList.add('wrong');
        why.classList.add('show');
        document.getElementById('quizScore').textContent='Score: '+score+' / '+quiz.length+(answered===quiz.length?(score===quiz.length?'  🏆 Perfect!':'  · review the explanations, then try the practice apps.'):'');
      });
      box.appendChild(b);
    });
    box.appendChild(why);host.appendChild(box);
  });

  /* ---------- boot ---------- */
  slides[0].classList.add('active');tabs[0].classList.add('active');prevBtn.disabled=true;
  document.getElementById('where').textContent='1 / '+slides.length+' · '+secs[0].dataset.tab;
})();
